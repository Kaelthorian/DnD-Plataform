    function backgroundChoiceKey(backgroundName, label) {
      return `background:${normalizeName(backgroundName)}:${normalizeName(label)}`;
    }

    function raceChoiceKey(raceName, label) {
      return `race:${normalizeName(raceName)}:${normalizeName(label)}`;
    }

    function backgroundChoiceAlertTitle(label) {
      if (/equipment/i.test(label)) return "Elegir equipo inicial del background";
      return `Elegir ${label.toLowerCase()} del background`;
    }

    function countWordToNumber(value) {
      const text = String(value || "").toLowerCase();
      const parsed = Number.parseInt(text, 10);
      if (Number.isFinite(parsed)) return parsed;
      return { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 }[text] || 1;
    }

    function languageChoiceOptions() {
      const officialLanguages = languages.filter((language) => language?.name && language.source === "XPHB");
      const unique = new Map();
      officialLanguages.forEach((language) => {
        const key = normalizeName(language.name);
        if (!unique.has(key)) unique.set(key, language.name);
      });
      return [...unique.values()]
        .sort((a, b) => a.localeCompare(b))
        .map((value) => ({ value, text: value, label: value }));
    }

    const SKILL_NAMES = [
      "Acrobatics",
      "Animal Handling",
      "Arcana",
      "Athletics",
      "Deception",
      "History",
      "Insight",
      "Intimidation",
      "Investigation",
      "Medicine",
      "Nature",
      "Perception",
      "Performance",
      "Persuasion",
      "Religion",
      "Sleight of Hand",
      "Stealth",
      "Survival"
    ];

    const SKILLS_BY_ABILITY = {
      intelligence: ["Arcana", "History", "Investigation", "Nature", "Religion"],
      wisdom: ["Animal Handling", "Insight", "Medicine", "Perception", "Survival"],
      charisma: ["Deception", "Intimidation", "Performance", "Persuasion"]
    };

    function skillChoiceOptions(values = SKILL_NAMES) {
      const unique = new Map();
      values.forEach((value) => {
        const key = normalizeName(value);
        const canonical = SKILL_NAMES.find((skill) => normalizeName(skill) === key) || value;
        if (canonical && !unique.has(normalizeName(canonical))) unique.set(normalizeName(canonical), canonical);
      });
      return [...unique.values()].map((value) => ({ value, text: value, label: value }));
    }

    function expertiseSkillChoiceOptions(values = SKILL_NAMES) {
      return skillChoiceOptions(values).map((option) => ({
        ...option,
        value: `expertise:${option.value}`,
        type: "expertiseSkill",
        skillName: option.value,
        description: `${option.value}: double proficiency bonus.`
      }));
    }

    function languageLabelFromKey(key) {
      const normalized = normalizeName(key);
      const match = languages.find((language) => normalizeName(language?.name || "") === normalized);
      if (match?.name) return match.name;
      if (normalized === "other") return "Other";
      if (normalized === "any standard") return "Any Standard";
      return titleCaseWords([String(key || "").replace(/([a-z])([A-Z])/g, "$1 $2")])[0];
    }

    function choiceOptionsFromKeys(keys = [], fallbackOptions = []) {
      const fallbackByName = new Map(fallbackOptions.map((option) => [normalizeName(option.value || option.label || option.text), option]));
      return keys.map((key) => {
        const normalized = normalizeName(key);
        const fallback = fallbackByName.get(normalized);
        if (fallback) return fallback;
        const label = languageLabelFromKey(key);
        return { value: label, text: label, label };
      });
    }

    function toolChoiceOptions() {
      const tools = Object.values(BACKGROUND_CHOICE_OPTION_SETS).flat();
      return [...new Set(tools)]
        .sort((a, b) => a.localeCompare(b))
        .map((value) => ({ value, text: value, label: value }));
    }

    function raceSizeLabel(value) {
      return { T: "Tiny", S: "Small", M: "Medium", L: "Large", H: "Huge", G: "Gargantuan" }[value] || value;
    }

    function raceSizeChoiceOptions(values = []) {
      return values
        .map(raceSizeLabel)
        .filter(Boolean)
        .map((value) => ({ value, text: value, label: value }));
    }

    const SPELLCASTING_ABILITY_OPTIONS = [
      { value: "Intelligence", text: "Intelligence", label: "Intelligence" },
      { value: "Wisdom", text: "Wisdom", label: "Wisdom" },
      { value: "Charisma", text: "Charisma", label: "Charisma" }
    ];

    function raceSpellcastingAbilityChoiceLabel(description) {
      const text = String(description || "");
      if (/\bFiendish Legacy\b/i.test(text)) return "Fiendish Legacy Spellcasting Ability";
      const traitMatch = text.match(/\b([A-Z][A-Za-z' -]+?)\s+(?:You are|Choose|You know|Starting at|When you|At \d)/);
      const traitName = traitMatch?.[1]?.trim();
      if (traitName && traitName.length <= 40 && !/^(Source|Creature Type|Size|Darkvision)$/i.test(traitName)) return `${traitName} Spellcasting Ability`;
      return "Race Spellcasting Ability";
    }

    function collectEntryTables(entries, tables = []) {
      const list = Array.isArray(entries) ? entries : [entries];
      list.forEach((entry) => {
        if (!entry || typeof entry !== "object") return;
        if (entry.type === "table" && Array.isArray(entry.rows)) tables.push(entry);
        collectEntryTables(entry.entries, tables);
        collectEntryTables(entry.items, tables);
      });
      return tables;
    }

    function ancestryBreathFallback(raceName, caption) {
      const raceKey = normalizeName(raceName);
      const captionKey = normalizeName(caption);
      if (raceKey === "dragonborn" && captionKey === "draconic ancestors") return "15 ft. cone or 30 ft. line (Dex. save)";
      if (captionKey.includes("chromatic")) return "30 ft. line (Dex. save)";
      if (captionKey.includes("gem") || captionKey.includes("metallic")) return "15 ft. cone (Dex. save)";
      return "";
    }

    function draconicAncestryChoiceSpecs(race) {
      if (!race?.entries?.length) return [];
      return collectEntryTables(race.entries)
        .filter((table) => /(?:draconic|chromatic|gem|metallic)\s+ancest/i.test(table.caption || ""))
        .map((table) => {
          const options = table.rows
            .map((row) => {
              if (!Array.isArray(row) || row.length < 2) return null;
              const dragon = strip5eTags(row[0]);
              const damageType = strip5eTags(row[1]);
              const breathWeapon = strip5eTags(row[2] || ancestryBreathFallback(race.name, table.caption || ""));
              if (!dragon || !damageType) return null;
              return {
                value: dragon,
                text: dragon,
                label: `${dragon} (${damageType}${breathWeapon ? `, ${breathWeapon}` : ""})`,
                damageType,
                breathWeapon
              };
            })
            .filter(Boolean);
          if (!options.length) return null;
          const label = table.caption || "Draconic Ancestry";
          return {
            key: raceChoiceKey(race.name, `${label}:${options.map((item) => item.value).join("|")}`),
            label: `${label}: elegir una opcion`,
            sectionLabel: label,
            count: 1,
            options
          };
        })
        .filter(Boolean);
    }

    function fiendishLegacyChoiceSpecs(race) {
      if (!race?.entries?.length || normalizeName(race.name) !== "tiefling") return [];
      return collectEntryTables(race.entries)
        .filter((table) => normalizeName(table.caption || "") === "fiendish legacies")
        .map((table) => {
          const options = table.rows
            .map((row) => {
              if (!Array.isArray(row) || row.length < 4) return null;
              const legacy = strip5eTags(row[0]);
              const level1 = strip5eTags(row[1]);
              const level3 = strip5eTags(row[2]);
              const level5 = strip5eTags(row[3]);
              if (!legacy || !level1) return null;
              return {
                value: legacy,
                text: legacy,
                label: `${legacy}: ${level1}`,
                description: [
                  level1,
                  `Starting at 3rd level, you always have the ${level3} spell prepared.`,
                  `Starting at 5th level, you always have the ${level5} spell prepared.`
                ].filter(Boolean).join(" ")
              };
            })
            .filter(Boolean);
          if (!options.length) return null;
          return {
            key: raceChoiceKey(race.name, `Fiendish Legacy:${options.map((item) => item.value).join("|")}`),
            label: "Fiendish Legacy: elegir una opcion",
            sectionLabel: "Fiendish Legacy",
            count: 1,
            options
          };
        })
        .filter(Boolean);
    }

    function raceNamedListChoiceSpecs(race) {
      if (!race?.entries?.length) return [];
      return race.entries
        .filter((entry) => entry && typeof entry === "object")
        .map((entry) => {
          const text = flattenEntryText(entry.entries || entry.entry || "");
          if (!/choose (?:one of the following options|(?:a )?(?:lineage|legacy))/i.test(text)) return null;
          const options = collectNamedListChoiceOptions(entry.entries || entry.entry || [])
            .map((option) => ({ ...option, text: option.value }));
          if (!options.length) return null;
          const label = entry.name || "Race Choice";
          return {
            key: raceChoiceKey(race.name, `${label}:${options.map((item) => item.value).join("|")}`),
            label: `${label}: elegir una opcion`,
            sectionLabel: label,
            count: 1,
            options
          };
        })
        .filter(Boolean);
    }

    function skillsFromText(value) {
      const text = String(value || "");
      return SKILL_NAMES.filter((skill) => textIncludesPhrase(text, skill));
    }

    function parseSkillListText(value) {
      return String(value || "")
        .replace(/\bor\b/gi, ",")
        .replace(/\band\b/gi, ",")
        .split(",")
        .map((item) => item.trim())
        .flatMap((item) => skillsFromText(item))
        .filter(Boolean);
    }

    function backgroundSkillChoiceSpecs(background) {
      const groups = Array.isArray(background?.skillProficiencies) ? background.skillProficiencies : [];
      const choices = [];
      groups.forEach((group, index) => {
        const choose = group?.choose;
        if (choose?.from?.length) {
          const options = skillChoiceOptions(choose.from);
          if (!options.length) return;
          const count = choose.count || 1;
          choices.push({
            key: backgroundChoiceKey(background.name, `skillProficiencies:${index}:${options.map((item) => item.value).join("|")}`),
            label: `Skill Proficiencies: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel: "Skill Proficiencies",
            count,
            options
          });
          return;
        }
        if (Number.isFinite(group?.any)) {
          const count = group.any;
          const options = skillChoiceOptions();
          if (!options.length) return;
          choices.push({
            key: backgroundChoiceKey(background.name, `skillProficiencies:${index}:any`),
            label: `Skill Proficiencies: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel: "Skill Proficiencies",
            count,
            options
          });
        }
      });
      return choices;
    }

    function fixedBackgroundSkillProficienciesFromData(background) {
      const groups = Array.isArray(background?.skillProficiencies) ? background.skillProficiencies : [];
      return groups.flatMap((group) => Object.entries(group || {})
        .filter(([key, value]) => key !== "choose" && key !== "any" && value === true)
        .map(([key]) => SKILL_NAMES.find((skill) => normalizeName(skill) === normalizeName(key)) || titleCaseWords([key])[0]));
    }

    function selectedChoiceValues(choice) {
      const selected = selectedChoice(choice.key);
      if (!selected) return [];
      return Array.isArray(selected) ? selected : [selected];
    }

    function backgroundChoiceSelectionCount(choice) {
      return selectedChoiceValues(choice).filter(Boolean).length;
    }

    function isBackgroundChoiceComplete(choice) {
      return backgroundChoiceSelectionCount(choice) >= (choice.count || 1);
    }

    function updateMultiChoiceSelection(choice, value, checked) {
      const selectedValues = selectedChoiceValues(choice);
      const next = new Set(selectedValues);
      if (checked) {
        if (!next.has(value) && next.size >= (choice.count || 1)) {
          showStatus(`Maximo ${choice.count || 1} opciones`);
          return false;
        }
        next.add(value);
      } else {
        next.delete(value);
      }
      setSelectedChoice(choice.key, [...next]);
      return true;
    }

    function findBackgroundChoicesForOption(option) {
      const backgroundName = optionName(option);
      const description = optionDescriptionText(option);
      if (!backgroundName) return [];
      const backgroundDetail = selectedBackgroundDetail(backgroundName);
      const structuredSkillChoices = backgroundSkillChoiceSpecs(backgroundDetail);
      if (!description) return structuredSkillChoices;

      const labelPattern = BACKGROUND_CHOICE_LABELS
        .map((label) => label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
        .join("|");
      const choicePattern = new RegExp(
        `(${labelPattern}):\\s*Choose A or B:\\s*\\(A\\)\\s*([\\s\\S]*?);\\s*or\\s*\\(B\\)\\s*([\\s\\S]*?)(?=\\s+(?:${labelPattern}|Feature|Suggested Characteristics)\\b|$)`,
        "gi"
      );

      const choices = [...description.matchAll(choicePattern)].map((match) => {
        const label = cleanExtractedProficiencyText(match[1]);
        const optionA = cleanExtractedProficiencyText(match[2]);
        const optionB = cleanExtractedProficiencyText(match[3]);
        return {
          key: backgroundChoiceKey(backgroundName, label),
          label: backgroundChoiceAlertTitle(label),
          sectionLabel: label,
          options: [
            { value: "A", text: optionA, label: `A: ${optionA}` },
            { value: "B", text: optionB, label: `B: ${optionB}` }
          ]
        };
      });

      structuredSkillChoices.forEach((choice) => {
        if (!choices.some((existing) => existing.key === choice.key)) choices.push(choice);
      });

      const openChoicePattern = new RegExp(
        `(${labelPattern}):\\s*Choose (one|two|three) kind(?:s)? of ([^.;]+?)(?=\\s+(?:${labelPattern}|Equipment|Feature|Suggested Characteristics)\\b|[.;]|$)`,
        "gi"
      );
      [...description.matchAll(openChoicePattern)].forEach((match) => {
        const label = cleanExtractedProficiencyText(match[1]);
        const count = countWordToNumber(match[2]);
        const category = cleanExtractedProficiencyText(match[3]).replace(/\.$/, "");
        const normalizedCategory = normalizeName(category);
        const options = BACKGROUND_CHOICE_OPTION_SETS[normalizedCategory];
        if (!options?.length) return;
        const key = backgroundChoiceKey(backgroundName, `${label}:${category}`);
        if (choices.some((choice) => choice.key === key)) return;
        choices.push({
          key,
          label: `${label}: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
          sectionLabel: label,
          count,
          category,
          options: options.map((value) => ({ value, text: value, label: value }))
        });
      });

      const skillSection = extractColonSection(description, ["Skill Proficiencies", "Skill Proficiency"], BACKGROUND_CHOICE_LABELS.filter((label) => !/^Skill Proficienc/i.test(label)));
      if (skillSection && !structuredSkillChoices.length) {
        const skillChoiceSpecs = [];
        const chooseFromMatch = skillSection.match(/Choose\s+(one|two|three)\s+from\s+among\s+([^.;]+?)(?=$|[.;])/i);
        if (chooseFromMatch) {
          skillChoiceSpecs.push({
            count: countWordToNumber(chooseFromMatch[1]),
            options: parseSkillListText(chooseFromMatch[2])
          });
        }

        const oneFromMatch = skillSection.match(/(?:your choice of\s+)?one\s+from\s+among\s+([^.;]+?)(?=$|[.;])/i);
        if (oneFromMatch && !chooseFromMatch) {
          skillChoiceSpecs.push({ count: 1, options: parseSkillListText(oneFromMatch[1]) });
        }

        const allChoiceMatch = skillSection.match(/^(?:Choose\s+)?(?:Any\s+)?(one|two|three)\s+of your choice$/i);
        if (allChoiceMatch) {
          skillChoiceSpecs.push({ count: countWordToNumber(allChoiceMatch[1]), options: SKILL_NAMES });
        }

        const abilityChoiceMatch = skillSection.match(/one\s+([^.;]+?)\s+skill\s+of your choice/i);
        if (abilityChoiceMatch) {
          const abilityOptions = Object.entries(SKILLS_BY_ABILITY)
            .filter(([ability]) => textIncludesPhrase(abilityChoiceMatch[1], ability))
            .flatMap(([, abilitySkills]) => abilitySkills);
          skillChoiceSpecs.push({ count: 1, options: abilityOptions.length ? abilityOptions : SKILL_NAMES });
        }

        if (/one skill of your choice/i.test(skillSection) && !abilityChoiceMatch && !allChoiceMatch) {
          skillChoiceSpecs.push({ count: 1, options: SKILL_NAMES });
        }

        skillChoiceSpecs.forEach((spec, index) => {
          const options = skillChoiceOptions(spec.options);
          if (!options.length) return;
          const key = backgroundChoiceKey(backgroundName, `Skill Proficiencies:${index}:${options.map((item) => item.value).join("|")}`);
          if (choices.some((choice) => choice.key === key)) return;
          choices.push({
            key,
            label: `Skill Proficiencies: elegir ${spec.count === 1 ? "una opcion" : `${spec.count} opciones`}`,
            sectionLabel: "Skill Proficiencies",
            count: spec.count,
            options
          });
        });
      }

      const languageChoicePattern = new RegExp(
        `(${labelPattern}):\\s*(?:Any\\s+)?(One|Two|Three) of your choice(?:\\s*\\([^)]*\\))?(?=\\s+(?:${labelPattern}|Equipment|Feature|Suggested Characteristics)\\b|[.;]|$)`,
        "gi"
      );
      [...description.matchAll(languageChoicePattern)].forEach((match) => {
        const label = cleanExtractedProficiencyText(match[1]);
        if (normalizeName(label) !== "languages") return;
        const count = countWordToNumber(match[2]);
        const options = languageChoiceOptions();
        if (!options.length) return;
        const key = backgroundChoiceKey(backgroundName, `${label}:choice`);
        if (choices.some((choice) => choice.key === key)) return;
        choices.push({
          key,
          label: `${label}: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
          sectionLabel: label,
          count,
          options
        });
      });

      return choices;
    }

    function selectedBackgroundOption() {
      return selectedOption("background", fieldValue("Background"));
    }

    function findSelectedBackgroundChoices() {
      const option = selectedBackgroundOption();
      return option ? findBackgroundChoicesForOption(option) : [];
    }

    function selectedRaceOption() {
      return selectedOption("race", getSelectedRaceName());
    }

    function selectedRaceDetail() {
      return raceDetailByName(getSelectedRaceName());
    }

    function raceProficiencyChoiceSpecs(race, propertyName, sectionLabel, optionMapper) {
      const values = Array.isArray(race?.[propertyName]) ? race[propertyName] : [];
      const choices = [];
      values.forEach((group, index) => {
        const choose = group?.choose;
        if (choose?.from?.length) {
          const count = choose.count || 1;
          const options = optionMapper(choose.from);
          if (!options.length) return;
          choices.push({
            key: raceChoiceKey(race.name, `${propertyName}:${index}:${options.map((item) => item.value).join("|")}`),
            label: `${sectionLabel}: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel,
            count,
            options
          });
          return;
        }
        if (propertyName === "languageProficiencies" && Number.isFinite(group?.anyStandard)) {
          const count = group.anyStandard;
          const options = languageChoiceOptions();
          if (!options.length) return;
          choices.push({
            key: raceChoiceKey(race.name, `${propertyName}:${index}:anyStandard`),
            label: `${sectionLabel}: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel,
            count,
            options
          });
        }
        if (propertyName === "toolProficiencies" && Number.isFinite(group?.any)) {
          const count = group.any;
          const options = toolChoiceOptions();
          if (!options.length) return;
          choices.push({
            key: raceChoiceKey(race.name, `${propertyName}:${index}:any`),
            label: `${sectionLabel}: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel,
            count,
            options
          });
        }
      });
      return choices;
    }

    function fixedRaceProficiencyValues(race, propertyName, labelMapper) {
      const values = Array.isArray(race?.[propertyName]) ? race[propertyName] : [];
      const fixed = [];
      values.forEach((group) => {
        Object.entries(group || {}).forEach(([key, value]) => {
          if (key === "choose" || value !== true) return;
          fixed.push(labelMapper(key));
        });
      });
      return fixed;
    }

    function findRaceChoicesForOption(option) {
      const raceName = optionName(option);
      const race = raceDetailByName(raceName);
      const description = optionDescriptionText(option);
      if (!raceName) return [];

      const choices = [];
      if (race) {
        const sizeOptions = raceSizeChoiceOptions(Array.isArray(race.size) ? race.size : []);
        if (sizeOptions.length > 1) {
          choices.push({
            key: raceChoiceKey(race.name, `Size:${sizeOptions.map((item) => item.value).join("|")}`),
            label: "Size: elegir una opcion",
            sectionLabel: "Size",
            count: 1,
            options: sizeOptions
          });
        }
        choices.push(...draconicAncestryChoiceSpecs(race));
        choices.push(...fiendishLegacyChoiceSpecs(race));
        choices.push(...raceNamedListChoiceSpecs(race));
        choices.push(...raceProficiencyChoiceSpecs(race, "skillProficiencies", "Skill Proficiencies", (items) => skillChoiceOptions(items)));
        choices.push(...raceProficiencyChoiceSpecs(race, "languageProficiencies", "Languages", (items) => choiceOptionsFromKeys(items, languageChoiceOptions())));
        choices.push(...raceProficiencyChoiceSpecs(race, "toolProficiencies", "Tool Proficiencies", (items) => choiceOptionsFromKeys(items)));
      }

      const sizeMatch = String(description || "").match(/\bSize:\s*(Small|Medium|Tiny|Large)\s+or\s+(Small|Medium|Tiny|Large)\b/i);
      if (sizeMatch && !choices.some((choice) => normalizeName(choice.sectionLabel) === "size")) {
        const options = raceSizeChoiceOptions([sizeMatch[1], sizeMatch[2]]);
        choices.push({
          key: raceChoiceKey(raceName, `Size:${options.map((item) => item.value).join("|")}`),
          label: "Size: elegir una opcion",
          sectionLabel: "Size",
          count: 1,
          options
        });
      }

      if (/choose your eladrin'?s season:\s*autumn,\s*winter,\s*spring,\s*or\s*summer/i.test(description)
        && !choices.some((choice) => normalizeName(choice.sectionLabel) === "eladrin season")) {
        const options = ["Autumn", "Winter", "Spring", "Summer"].map((value) => ({ value, text: value, label: value }));
        choices.push({
          key: raceChoiceKey(raceName, "Eladrin Season"),
          label: "Eladrin Season: elegir una opcion",
          sectionLabel: "Eladrin Season",
          count: 1,
          options
        });
      }

      const languageText = extractRaceLanguageText(rawOptionDescriptionText(option) || description);
      const languageChoiceMatch = languageText.match(/\b(one|two|three)\s+(?:(?:other|extra)\s+)?languages?\s+of your choice\b/i);
      if (languageChoiceMatch) {
        const count = countWordToNumber(languageChoiceMatch[1]);
        const key = raceChoiceKey(raceName, "Languages:description-choice");
        if (!choices.some((choice) => choice.key === key || normalizeName(choice.sectionLabel) === "languages")) {
          choices.push({
            key,
            label: `Languages: elegir ${count === 1 ? "una opcion" : `${count} opciones`}`,
            sectionLabel: "Languages",
            count,
            options: languageChoiceOptions()
          });
        }
      }

      const skillChoiceMatch = String(description || "").match(/proficiency in one of the following skills of your choice:\s*([^.;]+)/i)
        || String(description || "").match(/proficiency in one skill of your choice/i);
      if (skillChoiceMatch && !choices.some((choice) => normalizeName(choice.sectionLabel) === "skill proficiencies")) {
        const options = skillChoiceMatch[1] ? skillChoiceOptions(parseSkillListText(skillChoiceMatch[1])) : skillChoiceOptions(SKILL_NAMES);
        if (options.length) {
          choices.push({
            key: raceChoiceKey(raceName, "Skill Proficiencies:description-choice"),
            label: "Skill Proficiencies: elegir una opcion",
            sectionLabel: "Skill Proficiencies",
            count: 1,
            options
          });
        }
      }

      const spellcastingAbilityPattern = /\bIntelligence,\s*Wisdom,\s*or\s*Charisma\s+is\s+your\s+spellcasting\s+ability\b|\bDC equals 8 \+ your proficiency bonus \+ your Intelligence,\s*Wisdom,\s*or\s*Charisma modifier\b/i;
      if (spellcastingAbilityPattern.test(description)
        && !choices.some((choice) => normalizeName(choice.sectionLabel) === "spellcasting ability")) {
        const label = raceSpellcastingAbilityChoiceLabel(description);
        choices.push({
          key: raceChoiceKey(raceName, "Spellcasting Ability:Intelligence|Wisdom|Charisma"),
          label: `${label}: elegir una opcion`,
          sectionLabel: "Spellcasting Ability",
          count: 1,
          options: SPELLCASTING_ABILITY_OPTIONS
        });
      }

      return choices;
    }

    function findSelectedRaceChoices() {
      const option = selectedRaceOption();
      return option ? findRaceChoicesForOption(option) : [];
    }

    function selectedRaceChoiceText(sectionLabel) {
      const choices = findSelectedRaceChoices()
        .filter((item) => normalizeName(item.sectionLabel) === normalizeName(sectionLabel));
      const values = choices.flatMap((choice) => isBackgroundChoiceComplete(choice)
        ? selectedChoiceValues(choice).map((value) => choice.options.find((option) => option.value === value)?.text || "")
        : []);
      return values.filter(Boolean).join(", ");
    }

    function selectedRaceChoiceOptions(sectionPattern) {
      const matcher = sectionPattern instanceof RegExp
        ? (label) => sectionPattern.test(label)
        : (label) => normalizeName(label) === normalizeName(sectionPattern);
      return findSelectedRaceChoices()
        .filter((choice) => matcher(choice.sectionLabel || ""))
        .flatMap((choice) => isBackgroundChoiceComplete(choice)
          ? selectedChoiceValues(choice).map((value) => choice.options.find((option) => option.value === value)).filter(Boolean)
          : []);
    }

    function selectedDraconicAncestryOption() {
      return selectedRaceChoiceOptions(/(?:draconic|chromatic|gem|metallic)\s+ancest/i)[0] || null;
    }

    function selectedFiendishLegacyOption() {
      return selectedRaceChoiceOptions("Fiendish Legacy")[0] || null;
    }

    function selectedRaceSpellcastingAbility() {
      return selectedRaceChoiceText("Spellcasting Ability");
    }

    function selectedRaceSkillChoices() {
      return findSelectedRaceChoices()
        .filter((choice) => normalizeName(choice.sectionLabel) === "skill proficiencies" || normalizeName(choice.sectionLabel) === "skill proficiency")
        .flatMap((choice) => isBackgroundChoiceComplete(choice) ? selectedChoiceValues(choice) : []);
    }

    function selectedBackgroundChoiceText(sectionLabel) {
      const choice = findSelectedBackgroundChoices()
        .find((item) => normalizeName(item.sectionLabel) === normalizeName(sectionLabel));
      if (!choice) return null;
      if (!isBackgroundChoiceComplete(choice)) return "";
      return selectedChoiceValues(choice)
        .map((value) => choice.options.find((option) => option.value === value)?.text || "")
        .filter(Boolean)
        .join(", ");
    }

    function backgroundSameAsAboveText() {
      return findSelectedBackgroundChoices()
        .filter((choice) => normalizeName(choice.sectionLabel) !== "equipment")
        .map((choice) => selectedBackgroundChoiceText(choice.sectionLabel))
        .find(Boolean) || "";
    }

    function normalizeBackgroundEquipmentText(value) {
      const sameAsAbove = backgroundSameAsAboveText();
      if (!sameAsAbove) return value;
      return String(value || "")
        .replace(/([A-Za-z' -]+)\s+\(same as above\)/gi, (_match, label) => `${label.trim()} (${sameAsAbove})`)
        .trim();
    }

    function applySelectedBackgroundChoices() {
      const equipmentChoice = findSelectedBackgroundChoices()
        .find((choice) => normalizeName(choice.sectionLabel) === "equipment");
      if (!equipmentChoice) {
        const backgroundDescription = selectedOptionDescription("background", fieldValue("Background"));
        const fixedEquipment = extractColonSection(backgroundDescription, ["Equipment"], ["Feature", "Suggested Characteristics"]);
        if (fixedEquipment) {
          const equipmentText = normalizeBackgroundEquipmentText(fixedEquipment);
          applyCurrencySource("background:equipment", parseCurrencyText(equipmentText));
          setGeneratedEquipmentValue("background:equipment", removeCurrencyText(equipmentText));
        } else {
          applyCurrencySource("background:equipment", null);
          setGeneratedEquipmentValue("background:equipment", "");
        }
        return;
      }
      const selected = selectedChoice(equipmentChoice.key);
      const option = equipmentChoice.options.find((item) => item.value === selected);
      if (!option) {
        applyCurrencySource("background:equipment", null);
        return;
      }

      const equipmentTextWithCoins = normalizeBackgroundEquipmentText(option.text);
      applyCurrencySource("background:equipment", parseCurrencyText(equipmentTextWithCoins));
      setGeneratedEquipmentValue("background:equipment", removeCurrencyText(equipmentTextWithCoins));
    }

    function renderBackgroundChoiceControls(option) {
      const choices = findBackgroundChoicesForOption(option);
      if (!choices.length) return [];
      return choices.map((choice) => {
        const group = document.createElement("div");
        group.className = "option-choice-group";

        const title = document.createElement("div");
        title.className = "option-choice-title";
        title.textContent = choice.label;
        group.appendChild(title);

        choice.options.forEach((item) => {
          const isMultiple = (choice.count || 1) > 1;
          const selectedValues = selectedChoiceValues(choice);
          const disabled = isSkillOptionAlreadyProficient(item, selectedValues);
          const label = document.createElement("label");
          label.className = "option-choice";
          label.classList.toggle("disabled", disabled);

          const input = document.createElement("input");
          input.type = isMultiple ? "checkbox" : "radio";
          input.name = choice.key;
          input.value = item.value;
          input.checked = selectedValues.includes(item.value);
          input.disabled = disabled;
          input.addEventListener("change", () => {
            if (activeSelectField?.dataset.optionType === "background") {
              activeSelectField.value = optionName(option);
              activeSelectField.dispatchEvent(new Event("input", { bubbles: true }));
              activeSelectField.dispatchEvent(new Event("change", { bubbles: true }));
            }
            if (isMultiple) {
              if (!updateMultiChoiceSelection(choice, item.value, input.checked)) input.checked = false;
            } else {
              setSelectedChoice(choice.key, item.value);
            }
            setOptionDescription(option);
          });

          const text = document.createElement("span");
          text.className = "option-choice-text";
          text.textContent = skillOptionLabel(item, disabled);
          label.append(input, text);
          group.appendChild(label);
        });
        return group;
      });
    }

    function renderClassChoiceControls(option) {
      const feature = classStartingSkillChoiceFeature(optionName(option));
      if (!feature) return [];
      const specs = featureChoiceSpecs(feature);
      const key = featureChoiceKey(feature);
      const selected = selectedFeatureChoices(key);
      return specs.map((spec, specIndex) => {
        const group = document.createElement("div");
        group.className = "option-choice-group";

        const title = document.createElement("div");
        title.className = "option-choice-title";
        title.textContent = `${spec.label}: elegir ${spec.count === 1 ? "una opcion" : `${spec.count} opciones`}`;
        group.appendChild(title);

        spec.options.forEach((item) => {
          const isMultiple = (spec.count || 1) > 1;
          const disabled = isSkillOptionAlreadyProficient(item, selected);
          const label = document.createElement("label");
          label.className = "option-choice";
          label.classList.toggle("disabled", disabled);

          const input = document.createElement("input");
          input.type = isMultiple ? "checkbox" : "radio";
          input.name = `${key}:${specIndex}`;
          input.value = item.value;
          input.checked = selected.includes(item.value);
          input.disabled = disabled;
          input.addEventListener("change", () => {
            if (activeSelectField?.dataset.optionType === "class") {
              activeSelectField.value = optionName(option);
              activeSelectField.dispatchEvent(new Event("input", { bubbles: true }));
              activeSelectField.dispatchEvent(new Event("change", { bubbles: true }));
            }
            const current = selectedFeatureChoices(key).filter((value) => !spec.options.some((optionItem) => optionItem.value === value));
            let picked = [...group.querySelectorAll("input:checked")].map((checked) => checked.value);
            if (picked.length > spec.count) {
              input.checked = false;
              picked = picked.filter((value) => value !== item.value);
              showStatus(`Maximo ${spec.count} opcion(es)`);
            }
            setSelectedFeatureChoices(key, [...current, ...picked]);
            setOptionDescription(option);
          });

          const text = document.createElement("span");
          text.className = "option-choice-text";
          text.textContent = skillOptionLabel(item, disabled);
          label.append(input, text);
          group.appendChild(label);
        });
        return group;
      });
    }

    function selectedSpellCountForLevel(level) {
      if (isWizardCharacter() && level > 0) {
        return wizardSpellbookNames()
          .map(findSpellByName)
          .filter((spell) => spell?.level === level)
          .length;
      }
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => Number(field.dataset.spellLevel) === level && field.value.trim())
        .filter((field) => !isAutoGrantedSpellField(field))
        .length;
    }

    function requiredSpellCountForLevel(level) {
      if (level === 0) return cantripsKnownForCharacter();
      const slots = spellSlotsForCharacter();
      return slots[level - 1] || 0;
    }

    function addMissingSpellAlerts(alerts) {
      const cantripRequired = requiredSpellCountForLevel(0);
      const cantripSelected = selectedSpellCountForLevel(0);
      if (cantripRequired > 0 && cantripSelected < cantripRequired) {
        addAlert(alerts, "important", "Elegir cantrips", `Faltan ${cantripRequired - cantripSelected} cantrip(s). Tu clase permite ${cantripRequired}; seleccionaste ${cantripSelected}.`);
      }

      if (isWizardCharacter()) {
        const maxKnown = wizardMaxSpellbookSpells();
        const known = wizardSpellbookNames().length;
        if (known < maxKnown) {
          addAlert(alerts, "important", "Completar spellbook", `Tu Wizard puede tener ${maxKnown} spell(s) en el libro para este nivel; tiene ${known}.`);
        }
        const preparedLimit = wizardPreparedSpellLimit();
        const prepared = selectedWizardPreparedSpellCount();
        if (prepared > preparedLimit) {
          addAlert(alerts, "critical", "Demasiados prepared spells", `Preparaste ${prepared}; tu limite actual es ${preparedLimit}.`);
        }
        return;
      }

      if (isBardCharacter()) {
        const maxKnown = bardKnownSpellLimit();
        const known = selectedKnownSpellNames().length;
        if (known < maxKnown) {
          addAlert(alerts, "important", "Elegir spells conocidos", `Tu Bard puede conocer ${maxKnown} spell(s) para este nivel; conoce ${known}.`);
        }
        return;
      }

      for (let level = 1; level <= maxSpellLevelForCharacter(); level += 1) {
        const required = requiredSpellCountForLevel(level);
        if (required <= 0) continue;
        const selected = selectedSpellCountForLevel(level);
        if (selected < required) {
          addAlert(alerts, "important", `Elegir spells nivel ${level}`, `Faltan ${required - selected} spell(s) de nivel ${level}. Slots disponibles: ${required}; seleccionaste ${selected}.`);
        }
      }
    }

    function addMissingFeatureChoiceAlerts(alerts) {
      choosableFeatureEntriesForCharacter().forEach((entry) => {
        missingFeatureChoiceSpecs(entry.feature).forEach(({ spec, missing }) => {
          addAlert(alerts, "important", `Elegir ${entry.feature.name}`, `Faltan ${missing} opcion(es) en ${spec.label}. Abrí Features & Traits para elegir.`);
        });
      });
    }

    function addMissingRaceChoiceAlerts(alerts) {
      findSelectedRaceChoices()
        .filter((choice) => !isBackgroundChoiceComplete(choice))
        .forEach((choice) => {
          addAlert(alerts, "important", choice.label, "La raza tiene una opcion pendiente. Abri Features & Traits para elegir.");
        });
    }

    function hasChoiceLanguageOrToolText() {
      return /of your choice|choose one|choose two|choose a|choose either/i.test(fieldValue("ProficienciesLang"));
    }

    function buildSheetAlerts() {
      const alerts = [];
      REQUIRED_CORE_FIELDS.forEach(([key, label]) => {
        if (!fieldValue(key)) addAlert(alerts, "critical", `Completar ${label}`, `Falta llenar el campo ${label}.`);
      });

      if (!fieldValue("HPMax")) addAlert(alerts, "critical", "Completar HP max", "Falta el maximo de hit points.");
      if (!fieldValue("HDTotal")) addAlert(alerts, "important", "Completar Hit Dice", "Falta el total de hit dice.");
      if (!fieldValue("Equipment")) addAlert(alerts, "important", "Completar Equipment", "Agrega equipo o elige el paquete inicial.");
      if (!fieldValue("ProficienciesLang")) addAlert(alerts, "important", "Revisar proficiencies/languages", "Faltan proficiencies o languages derivados de clase, raza y background.");
      if (hasChoiceLanguageOrToolText()) {
        addAlert(alerts, "important", "Elegir proficiencies/languages", "Hay opciones como 'of your choice' que requieren decision manual.");
      }

      addMissingSpellAlerts(alerts);
      addMissingFeatureChoiceAlerts(alerts);
      addMissingRaceChoiceAlerts(alerts);

      equippedEntries()
        .filter(({ item }) => item && !hasEquipmentProficiency(item))
        .forEach(({ item, record }) => {
          addAlert(alerts, "important", `${item.name}: sin proficiency`, `Equipado en ${slotLabel(record.slot)} con penalizacion.`);
        });
      const armorPenalty = armorProficiencyPenaltyText();
      if (armorPenalty) addAlert(alerts, "important", "Penalizacion por armadura", armorPenalty);

      findSelectedBackgroundChoices()
        .filter((choice) => !isBackgroundChoiceComplete(choice))
        .forEach((choice) => {
          addAlert(alerts, "important", choice.label, "El background tiene una opcion pendiente.", choice);
        });

      ["PersonalityTraits ", "Ideals", "Bonds", "Flaws"].forEach((key) => {
        if (!fieldValue(key)) addAlert(alerts, "optional", `Completar ${key.trim()}`, "Ayuda a definir roleplay, pero no bloquea la ficha.");
      });

      PAGE_TWO_OPTIONAL_FIELDS.forEach(([key, label]) => {
        if (!fieldValue(key)) addAlert(alerts, "optional", `Completar ${label}`, "Dato de pagina 2 opcional.");
      });

      return alerts.sort((a, b) => {
        const order = { critical: 0, important: 1, optional: 2 };
        return order[a.severity] - order[b.severity];
      });
    }

    function renderAlertChoice(alert) {
      if (!alert.choice) return null;
      const group = document.createElement("div");
      group.className = "alert-choice-group";
      const isMultiple = (alert.choice.count || 1) > 1;
      const selectedValues = selectedChoiceValues(alert.choice);
      alert.choice.options.forEach((option) => {
        const disabled = isSkillOptionAlreadyProficient(option, selectedValues);
        const label = document.createElement("label");
        label.className = "alert-choice";
        label.classList.toggle("disabled", disabled);

        const input = document.createElement("input");
        input.type = isMultiple ? "checkbox" : "radio";
        input.name = alert.choice.key;
        input.value = option.value;
        input.checked = selectedValues.includes(option.value);
        input.disabled = disabled;
        input.addEventListener("change", () => {
          if (isMultiple) {
            if (!updateMultiChoiceSelection(alert.choice, option.value, input.checked)) input.checked = false;
          } else {
            setSelectedChoice(alert.choice.key, option.value);
          }
        });

        const text = document.createElement("span");
        text.className = "alert-choice-text";
        text.textContent = skillOptionLabel(option, disabled);
        label.append(input, text);
        group.appendChild(label);
      });
      return group;
    }

    function renderAlertsPanel() {
      if (!alertsList || !alertsCounts || !alertsPanel || !alertsTrigger || !alertsIcon || !alertsBadge) return;
      const alerts = buildSheetAlerts();
      const counts = alerts.reduce((acc, alert) => {
        acc[alert.severity] = (acc[alert.severity] || 0) + 1;
        return acc;
      }, {});
      const total = alerts.length;
      const topSeverity = alerts[0]?.severity || "empty";
      const summary = total
        ? `${total} alerta(s): ${counts.critical || 0} criticas, ${counts.important || 0} importantes, ${counts.optional || 0} opcionales`
        : "No hay alertas pendientes";

      alertsPanel.className = `alerts-panel ${topSeverity}`;
      alertsTrigger.setAttribute("aria-label", summary);
      alertsTrigger.title = summary;
      alertsIcon.textContent = "!";
      alertsBadge.textContent = String(total);
      alertsCounts.textContent = `${counts.critical || 0} crit / ${counts.important || 0} imp / ${counts.optional || 0} opc`;
      alertsList.textContent = "";

      if (!alerts.length) {
        const empty = document.createElement("div");
        empty.className = "alert-empty";
        empty.textContent = "No hay alertas pendientes.";
        alertsList.appendChild(empty);
        return;
      }

      alerts.forEach((alert) => {
        const item = document.createElement("div");
        item.className = `alert-item ${alert.severity}`;
        item.title = alert.detail;

        const body = document.createElement("div");
        const title = document.createElement("div");
        title.className = "alert-title";
        title.textContent = alert.title;

        const detail = document.createElement("div");
        detail.className = "alert-detail";
        detail.textContent = `${ALERT_SEVERITY_LABELS[alert.severity]}: ${alert.detail}`;

        body.append(title, detail);
        const choice = renderAlertChoice(alert);
        if (choice) body.appendChild(choice);
        item.appendChild(body);
        alertsList.appendChild(item);
      });
    }

    const DERIVED_STAT_FIELDS = {

      },

    function skillCheckboxByName() {
      const map = new Map();
      Object.values(DERIVED_STAT_FIELDS).forEach((config) => {
        config.skills.forEach((skill) => {
          map.set(normalizeName(skill.field), skill.proficiency);
          if (normalizeName(skill.field) === "animal") map.set("animal handling", skill.proficiency);
          if (normalizeName(skill.field) === "sleightofhand") map.set("sleight of hand", skill.proficiency);
        });
      });
      return map;
    }

    function canonicalSkillName(value) {
      const normalized = normalizeName(String(value || "").replace(/^(?:skill|expertise):/i, ""));
      return SKILL_NAMES.find((skill) => normalizeName(skill) === normalized) || "";
    }

    function optionSkillName(option) {
      if (!option) return "";
      if (option.type === "skill") return canonicalSkillName(option.value || option.label || option.text);
      return canonicalSkillName(option.value || option.label || option.text);
    }

    function selectedSkillNamesFromValues(values = []) {
      return new Set(values.map(canonicalSkillName).filter(Boolean).map(normalizeName));
    }

    function selectedExpertiseSkillNames(values = []) {
      return new Set(values
        .filter((value) => String(value).startsWith("expertise:"))
        .map((value) => canonicalSkillName(String(value).replace(/^expertise:/, "")))
        .filter(Boolean)
        .map(normalizeName));
    }

    function allSelectedExpertiseSkillNames() {
      return new Set(Object.values(sheetMeta.featureChoices || {})
        .flatMap((value) => Array.isArray(value) ? value : value ? [value] : [])
        .filter((value) => String(value).startsWith("expertise:"))
        .map((value) => canonicalSkillName(String(value).replace(/^expertise:/, "")))
        .filter(Boolean)
        .map(normalizeName));
    }

    function isExpertiseSkillOptionUnavailable(option, selectedValues = []) {
      if (option?.type !== "expertiseSkill") return false;
      const skillName = canonicalSkillName(option.skillName || String(option.value || "").replace(/^expertise:/, ""));
      if (!skillName) return false;
      if (selectedExpertiseSkillNames(selectedValues).has(normalizeName(skillName))) return false;
      const checkboxKey = skillCheckboxByName().get(normalizeName(skillName));
      const field = checkboxKey ? getFieldByKey(checkboxKey) : null;
      if (!field?.checked) return true;
      return allSelectedExpertiseSkillNames().has(normalizeName(skillName));
    }

    function isSkillOptionAlreadyProficient(option, selectedValues = []) {
      if (option?.type === "expertiseSkill") return isExpertiseSkillOptionUnavailable(option, selectedValues);
      const skillName = optionSkillName(option);
      if (!skillName) return false;
      if (selectedSkillNamesFromValues(selectedValues).has(normalizeName(skillName))) return false;
      const checkboxKey = skillCheckboxByName().get(normalizeName(skillName));
      const field = checkboxKey ? getFieldByKey(checkboxKey) : null;
      return Boolean(field?.checked);
    }

    function skillOptionLabel(option, disabled) {
      const label = option.label || option.text || option.value || "";
      if (option?.type === "expertiseSkill" && disabled) {
        const skillName = canonicalSkillName(option.skillName || String(option.value || "").replace(/^expertise:/, ""));
        const checkboxKey = skillCheckboxByName().get(normalizeName(skillName));
        const field = checkboxKey ? getFieldByKey(checkboxKey) : null;
        return `${label} (${field?.checked ? "ya tiene Expertise en otra seleccion" : "requiere proficiency"})`;
      }
      return disabled && optionSkillName(option) ? `${label} (ya proficient)` : label;
    }

    function savingThrowCheckboxByAbility() {
      const map = new Map();
      Object.entries(DERIVED_STAT_FIELDS).forEach(([ability, config]) => {
        config.saves.forEach((save) => {
          map.set(normalizeName(ability), save.proficiency);
          const label = save.field.replace(/^ST\s+/i, "");
          map.set(normalizeName(label), save.proficiency);
        });
      });
      return map;
    }

    function selectedBackgroundSkillChoices() {
      return findSelectedBackgroundChoices()
        .filter((choice) => normalizeName(choice.sectionLabel) === "skill proficiencies" || normalizeName(choice.sectionLabel) === "skill proficiency")
        .flatMap((choice) => isBackgroundChoiceComplete(choice) ? selectedChoiceValues(choice) : []);
    }

    function fixedBackgroundSkillProficiencies() {
      const background = selectedBackgroundDetail();
      const structured = fixedBackgroundSkillProficienciesFromData(background);
      if (structured.length || Array.isArray(background?.skillProficiencies)) return structured;
      const description = selectedOptionDescription("background", fieldValue("Background"));
      const section = extractColonSection(description, ["Skill Proficiencies", "Skill Proficiency"], [
        "Tool Proficiencies",
        "Tool Proficiency",
        "Languages and Tool Proficiencies",
        "Languages",
        "Equipment",
        "Feature",
        "Suggested Characteristics"
      ]);
      if (!section) return [];
      const fixedText = section
        .replace(/Choose\s+(?:one|two|three)\s+from\s+among\s+[^.;]+/gi, "")
        .replace(/(?:,\s*|\s+and\s+)?(?:plus\s+)?(?:your choice of\s+)?one\s+from\s+among\s+[^.;]+/gi, "")
        .replace(/(?:,\s*|\s+and\s+)?one\s+[^.;]+?\s+skill\s+of your choice/gi, "")
        .replace(/(?:,\s*)?the skill associated with your faction[^.;]+/gi, "")
        .replace(/^(?:Choose\s+)?(?:Any\s+)?(?:one|two|three)\s+of your choice$/i, "");
      return skillsFromText(fixedText);
    }

    function classStartingSkillChoiceFeature(className = getMainClassName() || getSelectedClassName()) {
      const detail = classDetailByName(className);
      const groups = Array.isArray(detail?.classItem?.startingProficiencies?.skills)
        ? detail.classItem.startingProficiencies.skills
        : [];
      const choices = groups
        .map((group) => {
          if (Number.isFinite(group?.any)) return { count: group.any, options: SKILL_NAMES };
          if (group?.choose?.from?.length) return { count: group.choose.count || 1, options: group.choose.from };
          return null;
        })
        .filter(Boolean);
      if (!choices.length) return null;
      const count = choices.reduce((total, choice) => total + (choice.count || 1), 0);
      const optionSet = new Set();
      choices.forEach((choice) => choice.options.forEach((skill) => {
        const canonical = SKILL_NAMES.find((item) => normalizeName(item) === normalizeName(skill));
        if (canonical) optionSet.add(canonical);
      }));
      return {
        name: "Class Skill Proficiencies",
        source: detail.classItem.source,
        page: detail.classItem.page,
        className: detail.classItem.name,
        level: 1,
        isClassStartingSkillChoice: true,
        skillCount: count,
        skillOptions: [...optionSet],
        entries: [`Choose ${count} skill proficiencies from your class starting proficiencies.`]
      };
    }

    function classStartingSkillChoiceEntries(includeSelected = false) {
      const feature = classStartingSkillChoiceFeature();
      if (!feature) return [];
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      const selectedCount = selected.filter((value) => (feature.skillOptions || []).some((skill) => normalizeName(skill) === normalizeName(value))).length;
      if (selectedCount >= (feature.skillCount || 1) && !includeSelected) return [];
      return [{
        type: "classSkillChoice",
        title: "Class Skill Proficiencies",
        meta: `${feature.className} choice`,
        description: flattenEntryText(feature.entries),
        feature
      }];
    }

    function selectedClassSkillChoices() {
      const feature = classStartingSkillChoiceFeature();
      return feature ? selectedFeatureChoices(featureChoiceKey(feature)).map(canonicalSkillName).filter(Boolean) : [];
    }

    function fixedClassSkillProficiencies() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const groups = Array.isArray(detail?.classItem?.startingProficiencies?.skills)
        ? detail.classItem.startingProficiencies.skills
        : [];
      return groups
        .filter((group) => typeof group === "string")
        .map(canonicalSkillName)
        .filter(Boolean);
    }

    function updateClassSkillProficiencies() {
      const skills = [...fixedClassSkillProficiencies(), ...selectedClassSkillChoices()];
      applyGeneratedSkillProficiencies("class", [...new Set(skills)]);
    }

    function applyGeneratedSkillProficiencies(sourceKey, skillNames) {
      if (!sheetMeta.generatedSkillProficiencies || typeof sheetMeta.generatedSkillProficiencies !== "object") sheetMeta.generatedSkillProficiencies = {};
      const checkboxMap = skillCheckboxByName();
      const previous = sheetMeta.generatedSkillProficiencies[sourceKey] || [];
      previous.forEach((checkboxKey) => {
        const field = getFieldByKey(checkboxKey);
        if (!field) return;
        field.checked = false;
        delete field.dataset.generatedSkillSource;
      });

      const next = [];
      skillNames.forEach((skillName) => {
        const checkboxKey = checkboxMap.get(normalizeName(skillName));
        const field = checkboxKey ? getFieldByKey(checkboxKey) : null;
        if (!field) return;
        field.checked = true;
        field.dataset.generatedSkillSource = sourceKey;
        next.push(checkboxKey);
      });

      if (next.length) sheetMeta.generatedSkillProficiencies[sourceKey] = [...new Set(next)];
      else delete sheetMeta.generatedSkillProficiencies[sourceKey];
    }

    function applyGeneratedSavingThrowProficiencies(abilityNames) {
      if (!sheetMeta.generatedSavingThrowProficiencies || typeof sheetMeta.generatedSavingThrowProficiencies !== "object") sheetMeta.generatedSavingThrowProficiencies = {};
      const previous = sheetMeta.generatedSavingThrowProficiencies.auto || [];
      previous.forEach((checkboxKey) => {
        const field = getFieldByKey(checkboxKey);
        if (!field || field.dataset.generatedSavingThrowSource !== "auto") return;
        field.checked = false;
        delete field.dataset.generatedSavingThrowSource;
      });

      const checkboxMap = savingThrowCheckboxByAbility();
      const next = [];
      abilityNames.forEach((abilityName) => {
        const checkboxKey = checkboxMap.get(normalizeName(abilityName));
        const field = checkboxKey ? getFieldByKey(checkboxKey) : null;
        if (!field) return;
        field.checked = true;
        field.dataset.generatedSavingThrowSource = "auto";
        next.push(checkboxKey);
      });

      if (next.length) sheetMeta.generatedSavingThrowProficiencies.auto = [...new Set(next)];
      else delete sheetMeta.generatedSavingThrowProficiencies.auto;
    }

    function abilityNamesFromText(text) {
      return [
        ["Strength", /\b(?:strength|str)\b/i],
        ["Dexterity", /\b(?:dexterity|dex)\b/i],
        ["Constitution", /\b(?:constitution|con)\b/i],
        ["Intelligence", /\b(?:intelligence|int)\b/i],
        ["Wisdom", /\b(?:wisdom|wis)\b/i],
        ["Charisma", /\b(?:charisma|cha)\b/i]
      ].filter(([, pattern]) => pattern.test(text)).map(([name]) => name);
    }

    function selectedSavingThrowProficiencyAbilities() {
      const abilities = [];
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      (detail?.classItem?.proficiency || []).forEach((ability) => {
        const key = ABILITY_LABELS[ability] || String(ability || "").toUpperCase();
        const label = DERIVED_STAT_FIELDS[key]?.saves?.[0]?.field?.replace(/^ST\s+/i, "");
        if (label) abilities.push(label);
      });

      generatedEffectSources().forEach(({ source, text }) => {
        sentenceList(text).forEach((sentence) => {
          if (isConditionalEffectSentence(sentence, source)) return;
          if (!/\bsaving throws?\b/i.test(sentence)) return;
          if (!/\b(?:advantage on|proficiency in|proficient in)\b/i.test(sentence)) return;
          abilityNamesFromText(sentence).forEach((ability) => abilities.push(ability));
        });
      });

      return uniqueReadableValues(abilities);
    }

    function updateSavingThrowProficiencies() {
      applyGeneratedSavingThrowProficiencies(selectedSavingThrowProficiencyAbilities());
    }

    function updateBackgroundSkillProficiencies() {
      const skills = [...fixedBackgroundSkillProficiencies(), ...selectedBackgroundSkillChoices()];
      applyGeneratedSkillProficiencies("background", [...new Set(skills.map((skill) => SKILL_NAMES.find((item) => normalizeName(item) === normalizeName(skill)) || skill))]);
    }

    function fixedRaceSkillProficiencies() {
      const race = selectedRaceDetail();
      const structured = fixedRaceProficiencyValues(race, "skillProficiencies", (key) => titleCaseWords([key])[0]);
      const description = selectedOptionDescription("race", getSelectedRaceName());
      const text = extractRaceProficiencyText(description)
        .replace(/proficiency in one of the following skills of your choice:\s*[^.;]+/gi, "")
        .replace(/proficiency in one skill of your choice/gi, "");
      return [...structured, ...skillsFromText(text)];
    }

    function updateRaceSkillProficiencies() {
      const skills = [...fixedRaceSkillProficiencies(), ...selectedRaceSkillChoices()];
      applyGeneratedSkillProficiencies("race", [...new Set(skills.map((skill) => SKILL_NAMES.find((item) => normalizeName(item) === normalizeName(skill)) || skill))]);
    }

    function selectedFeatSkillChoices() {
      const choiceSources = [
        ...choosableFeatureEntriesForCharacter().map((entry) => entry.feature),
        ...activeFeatData().map((feat) => ({
          name: feat.name,
          source: feat.source,
          level: 1,
          isFeatFeature: true,
          feat,
          entries: feat.entries || []
        }))
      ].filter((feature, index, list) => list.findIndex((item) => featureChoiceKey(item) === featureChoiceKey(feature)) === index);
      return choiceSources
        .filter((feature) => !feature?.isClassStartingSkillChoice)
        .flatMap((feature) => selectedFeatureChoices(featureChoiceKey(feature)))
        .filter((value) => String(value).startsWith("skill:"))
        .map((value) => String(value).replace(/^skill:/, ""));
    }

    function selectedFeatToolChoices() {
      const choiceSources = [
        ...choosableFeatureEntriesForCharacter().map((entry) => entry.feature),
        ...activeFeatData().map((feat) => ({
          name: feat.name,
          source: feat.source,
          level: 1,
          isFeatFeature: true,
          feat,
          entries: feat.entries || []
        }))
      ].filter((feature, index, list) => list.findIndex((item) => featureChoiceKey(item) === featureChoiceKey(feature)) === index);
      return choiceSources
        .filter((feature) => !feature?.isClassStartingSkillChoice)
        .flatMap((feature) => selectedFeatureChoices(featureChoiceKey(feature)))
        .filter((value) => String(value).startsWith("tool:"))
        .map((value) => String(value).replace(/^tool:/, ""));
    }

    function selectedFeatureLanguageChoices() {
      const choiceSources = [
        ...choosableFeatureEntriesForCharacter().map((entry) => entry.feature),
        ...activeFeatData().map((feat) => ({
          name: feat.name,
          source: feat.source,
          level: 1,
          isFeatFeature: true,
          feat,
          entries: feat.entries || []
        }))
      ].filter((feature, index, list) => list.findIndex((item) => featureChoiceKey(item) === featureChoiceKey(feature)) === index);
      return choiceSources
        .filter((feature) => !feature?.isClassStartingSkillChoice)
        .flatMap((feature) => selectedFeatureChoices(featureChoiceKey(feature)))
        .filter((value) => String(value).startsWith("language:"))
        .map((value) => String(value).replace(/^language:/, ""));
    }

    function updateFeatSkillProficiencies() {
      const skills = selectedFeatSkillChoices();
      applyGeneratedSkillProficiencies("feat", [...new Set(skills.map((skill) => SKILL_NAMES.find((item) => normalizeName(item) === normalizeName(skill)) || skill))]);
    }

    function selectedAbilityScoreImprovementBonuses() {
      const bonuses = Object.fromEntries(ABILITY_KEYS.map((ability) => [ability, 0]));
      choosableFeatureEntriesForCharacter().forEach((entry) => {
        if (!isAbilityScoreImprovementFeature(entry.feature)) return;
        const selected = selectedFeatureChoices(featureChoiceKey(entry.feature));
        if (!selected.includes(ASI_CHOICE_VALUE)) return;
        selected
          .filter((value) => String(value).startsWith("asi:"))
          .forEach((value) => {
            const parts = String(value).replace(/^asi:/, "").split(":");
            parts.forEach((part) => {
              const match = part.match(/^([A-Z]{3})\+(\d)$/);
              if (!match || !ABILITY_KEYS.includes(match[1])) return;
              bonuses[match[1]] += Number.parseInt(match[2], 10) || 0;
            });
          });
      });
      activeFeatData().forEach((feat) => {
        (Array.isArray(feat.ability) ? feat.ability : []).forEach((item) => {
          if (!item || typeof item !== "object" || Array.isArray(item.choose)) return;
          Object.entries(item).forEach(([ability, amount]) => {
            const key = ABILITY_LABELS[ability] || String(ability || "").toUpperCase();
            if (!ABILITY_KEYS.includes(key) || !Number.isFinite(amount)) return;
            bonuses[key] += amount;
          });
        });
      });
      const featChoiceSources = [
        ...choosableFeatureEntriesForCharacter().map((entry) => entry.feature),
        ...activeFeatData().map((feat) => ({
          name: feat.name,
          source: feat.source,
          level: 1,
          isFeatFeature: true,
          feat,
          entries: feat.entries || []
        }))
      ].filter((feature, index, list) => list.findIndex((item) => featureChoiceKey(item) === featureChoiceKey(feature)) === index);
      featChoiceSources.forEach((feature) => {
        selectedFeatureChoices(featureChoiceKey(feature))
          .filter((value) => String(value).startsWith("feat-ability:"))
          .forEach((value) => {
            const match = String(value).replace(/^feat-ability:/, "").match(/^([A-Z]{3})\+(\d)$/);
            if (!match || !ABILITY_KEYS.includes(match[1])) return;
            bonuses[match[1]] += Number.parseInt(match[2], 10) || 0;
          });
      });
      return bonuses;
    }

    function clearRaceAbilityAdjustment(ability, field, bases, previousBonuses) {
      if (!field) return;
      const base = Number.parseInt(String(bases[ability] ?? "").trim(), 10);
      if (Number.isFinite(base) && field.dataset.generatedAbilitySource === "race") field.value = String(base);
      delete bases[ability];
      delete previousBonuses[ability];
      delete field.dataset.generatedAbilitySource;
      delete field.dataset.generatedAbilityValue;
      field.title = field.dataset.key || ability;
    }

    function applyRaceAbilityAdjustments() {
      if (!sheetMeta.racialAbilityBases || typeof sheetMeta.racialAbilityBases !== "object") sheetMeta.racialAbilityBases = {};
      if (!sheetMeta.racialAbilityBonuses || typeof sheetMeta.racialAbilityBonuses !== "object") sheetMeta.racialAbilityBonuses = {};

      const bases = sheetMeta.racialAbilityBases;
      const previousBonuses = sheetMeta.racialAbilityBonuses;
      const asiBonuses = selectedAbilityScoreImprovementBonuses();
      const bonuses = Object.fromEntries(ABILITY_KEYS.map((ability) => [
        ability,
        asiBonuses[ability] || 0
      ]));

      ABILITY_KEYS.forEach((ability) => {
        const field = getFieldByKey(ability);
        if (!field) return;
        const bonus = bonuses[ability] || 0;
        if (!bonus) {
          clearRaceAbilityAdjustment(ability, field, bases, previousBonuses);
          return;
        }

        const currentValue = Number.parseInt(String(field.value || "").trim(), 10);
        const storedBase = Number.parseInt(String(bases[ability] ?? "").trim(), 10);
        const base = Number.isFinite(storedBase)
          ? storedBase
          : Number.isFinite(currentValue)
            ? currentValue
            : null;
        if (base == null) return;

        const next = base + bonus;
        field.value = String(next);
        field.dataset.generatedAbilitySource = "race";
        field.dataset.generatedAbilityValue = String(next);
        const parts = [
          asiBonuses[ability] ? `ASI ${formatModifier(asiBonuses[ability])}` : ""
        ].filter(Boolean);
        field.title = `${field.dataset.key || ability}: base ${base}${parts.length ? `, ${parts.join(", ")}` : ""}`;
        bases[ability] = base;
        previousBonuses[ability] = bonus;
      });

      ABILITY_KEYS.forEach((ability) => {
        if (bonuses[ability]) return;
        const field = getFieldByKey(ability);
        if (bases[ability] != null || previousBonuses[ability] != null || field?.dataset.generatedAbilitySource === "race") {
          clearRaceAbilityAdjustment(ability, field, bases, previousBonuses);
        }
      });
    }

    function captureManualRaceAbilityEdit(field, ability) {
      if (!field || field.dataset.generatedAbilitySource !== "race") return;
      const expected = field.dataset.generatedAbilityValue || "";
      if (String(field.value || "").trim() === expected) return;

      const value = Number.parseInt(String(field.value || "").trim(), 10);
      const bonus = Number.parseInt(String(sheetMeta.racialAbilityBonuses?.[ability] || "0"), 10);
      if (!Number.isFinite(value) || !Number.isFinite(bonus) || !bonus) {
        delete sheetMeta.racialAbilityBases?.[ability];
        delete sheetMeta.racialAbilityBonuses?.[ability];
        delete field.dataset.generatedAbilitySource;
        delete field.dataset.generatedAbilityValue;
        field.title = field.dataset.key || ability;
        return;
      }

      if (!sheetMeta.racialAbilityBases || typeof sheetMeta.racialAbilityBases !== "object") sheetMeta.racialAbilityBases = {};
      sheetMeta.racialAbilityBases[ability] = value - bonus;
      field.dataset.generatedAbilityValue = String(value);
      field.title = `${field.dataset.key || ability}: base ${value - bonus}, adjustments ${formatModifier(bonus)}`;
    }

    function proficiencyBonus() {
      const level = getFieldByKey("CharacterLevel")?.value || "";
      return proficiencyBonusForLevel(level);
    }

    function isProficient(checkboxKey) {
      return Boolean(getFieldByKey(checkboxKey)?.checked);
    }

    function hasExpertiseSkill(skillName) {
      const normalized = normalizeName(canonicalSkillName(skillName) || skillName);
      return normalized ? allSelectedExpertiseSkillNames().has(normalized) : false;
    }

    function hasJackOfAllTrades() {
      return normalizeName(getMainClassName()) === "bard" && getCharacterLevel() >= 2;
    }

    function derivedFieldValue(baseModifier, proficiencyKey, applyJack = false, skillName = "") {
      if (isProficient(proficiencyKey)) return baseModifier + proficiencyBonus() * (skillName && hasExpertiseSkill(skillName) ? 2 : 1);
      return baseModifier + (applyJack && hasJackOfAllTrades() ? Math.floor(proficiencyBonus() / 2) : 0);
    }

    function clampDexModifierForArmor(dexModifier, dexCap) {
      if (dexCap == null) return dexModifier;
      if (dexCap === 0) return 0;
      return Math.min(dexModifier, dexCap);
    }

    function textIncludesPhrase(text, phrase) {
      const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp(`(^|[^a-z])${escaped}($|[^a-z])`, "i").test(text);
    }

    function equipmentText() {
      return [...document.querySelectorAll(".field")]
        .filter((field) => field.dataset.key?.trim().toLowerCase().includes("equipment"))
        .map((field) => field.value || "")
        .join(" ")
        .toLowerCase();
    }

    function selectedRaceDescription() {
      const raceName = normalizeName(getSelectedRaceName());
      if (!raceName) return "";
      const race = (fieldOptions.get("race") || []).find((option) => normalizeName(optionName(option)) === raceName);
      return rawOptionDescriptionText(race).toLowerCase();
    }

    function raceAutoEffectDescription() {
      const race = selectedRaceDetail();
      if (race?.entries?.length) return "";
      return selectedOptionDescription("race", getSelectedRaceName());
    }

    function selectedOption(type, selectedName) {
      const normalized = normalizeName(selectedName);
      if (!normalized) return null;
      const matches = (fieldOptions.get(type) || []).filter((option) => normalizeName(optionName(option)) === normalized);
      if (type === "background" && matches.length > 1) {
        return matches.find((option) => normalizeName(rawOptionDescriptionText(option)).includes("source xphb"))
          || matches[0]
          || null;
      }
      return matches[0] || null;
    }

    function backgroundDetailRawByNameSource(name, source = "") {
      const normalizedName = normalizeName(name);
      const normalizedSource = normalizeName(source);
      if (!normalizedName) return null;
      const matches = backgroundDetails.filter((background) => normalizeName(background.name || "") === normalizedName);
      if (!matches.length) return null;
      if (normalizedSource) return matches.find((background) => normalizeName(background.source || "") === normalizedSource)
        || matches[0]
        || null;
      return matches.find((background) => normalizeName(background.source || "") === "xphb")
        || matches[0]
        || null;
    }

    function applyBackgroundEntryMod(entries, mod) {
      if (!Array.isArray(entries) || !mod) return entries;
      const mods = Array.isArray(mod) ? mod : [mod];
      mods.forEach((item) => {
        const mode = item?.mode;
        const items = Array.isArray(item?.items) ? item.items : item?.items ? [item.items] : [];
        if (!mode || !items.length) return;
        if (mode === "insertArr") {
          const index = Number.isFinite(item.index) ? Math.max(0, Math.min(entries.length, item.index)) : entries.length;
          entries.splice(index, 0, ...items);
          return;
        }
        if (mode === "appendArr") {
          entries.push(...items);
          return;
        }
        if (mode === "replaceArr") {
          let index = -1;
          if (Number.isFinite(item.replace?.index)) index = item.replace.index;
          else if (typeof item.replace === "string") index = entries.findIndex((entry) => normalizeName(entry?.name || "") === normalizeName(item.replace));
          if (index >= 0 && index < entries.length) entries.splice(index, 1, ...items);
          return;
        }
        if (mode === "removeArr") {
          const names = Array.isArray(item.names) ? item.names : item.names ? [item.names] : [];
          names.forEach((name) => {
            const index = entries.findIndex((entry) => normalizeName(entry?.name || "") === normalizeName(name));
            if (index >= 0) entries.splice(index, 1);
          });
        }
      });
      return entries;
    }

    function resolveBackgroundDetail(background, seen = new Set()) {
      if (!background || typeof background !== "object") return null;
      const key = `${normalizeName(background.name || "")}|${normalizeName(background.source || "")}`;
      if (seen.has(key)) return background;
      seen.add(key);
      if (!background._copy) return background;

      const baseRaw = backgroundDetailRawByNameSource(background._copy.name, background._copy.source);
      const base = resolveBackgroundDetail(baseRaw, seen);
      if (!base) return background;
      const resolved = JSON.parse(JSON.stringify({ ...base, ...background, _copy: undefined }));
      resolved.name = background.name || base.name;
      resolved.source = background.source || base.source;
      resolved.page = background.page || base.page;
      if (base.entries) resolved.entries = JSON.parse(JSON.stringify(base.entries));
      const mod = background._copy?._mod;
      if (mod?.entries) resolved.entries = applyBackgroundEntryMod(resolved.entries || [], mod.entries);
      return resolved;
    }

    function selectedBackgroundDetail(backgroundName = getFieldValueByNormalizedKey("background")) {
      const option = selectedOption("background", backgroundName);
      const optionSource = option?.source || "";
      const hasXphb = backgroundDetails.some((background) => normalizeName(background.name || "") === normalizeName(backgroundName) && normalizeName(background.source || "") === "xphb");
      const raw = backgroundDetailRawByNameSource(backgroundName, hasXphb ? "" : optionSource);
      return resolveBackgroundDetail(raw);
    }

    function countNumberToWord(value) {
      return { 1: "One", 2: "Two", 3: "Three", 4: "Four" }[value] || String(value);
    }

    function backgroundProficiencyText(groups = [], labelMapper = (value) => titleCaseWords([value])[0]) {
      const parts = [];
      groups.forEach((group) => {
        Object.entries(group || {}).forEach(([key, value]) => {
          if (key === "choose" && value?.from?.length) {
            parts.push(`Choose ${countNumberToWord(value.count || 1)} from among ${value.from.map(labelMapper).join(", ")}`);
            return;
          }
          if (key === "anyStandard" && Number.isFinite(value)) {
            parts.push(`${countNumberToWord(value)} of your choice`);
            return;
          }
          if (key === "any" && Number.isFinite(value)) {
            parts.push(`${countNumberToWord(value)} of your choice`);
            return;
          }
          if (value === true) parts.push(labelMapper(key));
        });
      });
      return [...new Set(parts.filter(Boolean))].join(", ");
    }

    function equipmentItemText(item) {
      if (typeof item === "string") {
        const quantity = itemQuantityFromRef(item);
        return `${equipmentQuantityPrefix(quantity)}${titleCaseWords([itemNameFromRef(item)])[0]}`;
      }
      if (!item || typeof item !== "object") return "";
      if (item.displayName) return item.displayName;
      if (item.special) return `${item.quantity ? `${item.quantity} ` : ""}${item.special}`;
      if (item.item) {
        const quantity = item.quantity || itemQuantityFromRef(item.item);
        return `${equipmentQuantityPrefix(quantity)}${titleCaseWords([itemNameFromRef(item.item)])[0]}`;
      }
      if (Number.isFinite(item.value)) return `${Math.round(item.value / 100)} gp`;
      if (Number.isFinite(item.containsValue)) return `pouch containing ${Math.round(item.containsValue / 100)} gp`;
      return "";
    }

    function classEquipmentTypeLabel(type) {
      const labels = {
        focusSpellcastingArcane: "Arcane Focus",
        focusSpellcastingDruidic: "Druidic Focus",
        focusSpellcastingHoly: "Holy Symbol",
        instrumentMusical: "Musical Instrument",
        toolArtisan: "Artisan's Tools",
        weaponMartial: "Martial Weapon",
        weaponMartialMelee: "Martial Melee Weapon",
        weaponSimple: "Simple Weapon",
        weaponSimpleMelee: "Simple Melee Weapon"
      };
      return labels[type] || titleCaseWords([String(type || "").replace(/([a-z])([A-Z])/g, "$1 $2")])[0];
    }

    function classEquipmentItemText(item) {
      if (Number.isFinite(item?.value) || Number.isFinite(item?.containsValue)) return "";
      if (typeof item === "string") {
        const quantity = itemQuantityFromRef(item);
        return `${equipmentQuantityPrefix(quantity)}${titleCaseWords([itemNameFromRef(item)])[0]}`;
      }
      if (!item || typeof item !== "object") return "";
      if (item.displayName) return item.displayName;
      if (item.special) return `${item.quantity ? `${item.quantity} ` : ""}${item.special}`;
      if (item.item) {
        const quantity = item.quantity || itemQuantityFromRef(item.item);
        const name = titleCaseWords([itemNameFromRef(item.item)])[0];
        return `${equipmentQuantityPrefix(quantity)}${name}`;
      }
      if (item.equipmentType) return `${item.quantity ? `${item.quantity} ` : ""}${classEquipmentTypeLabel(item.equipmentType)} (choose)`;
      if (Array.isArray(item.equipmentTypes) && item.equipmentTypes.length) {
        return `${item.quantity ? `${item.quantity} ` : ""}${item.equipmentTypes.map(classEquipmentTypeLabel).join(" or ")} (choose)`;
      }
      return "";
    }

    function equipmentItemHasObject(item) {
      if (typeof item === "string") return true;
      if (!item || typeof item !== "object") return false;
      return Boolean(item.displayName || item.special || item.item || item.equipmentType || item.equipmentTypes);
    }

    function classEquipmentCurrencyTotals(items = []) {
      const totals = { cp: 0, sp: 0, ep: 0, gp: 0, pp: 0 };
      items.forEach((item) => {
        if (!item || typeof item !== "object") return;
        const value = Number.isFinite(item.value) ? item.value : Number.isFinite(item.containsValue) ? item.containsValue : null;
        if (value == null) return;
        totals.cp += value;
      });
      totals.gp += Math.trunc(totals.cp / 100);
      totals.cp %= 100;
      return totals;
    }

    function selectedClassEquipmentGroupItems(group) {
      if (!group || typeof group !== "object") return [];
      if (Array.isArray(group)) return group;
      if (Array.isArray(group._)) return group._;
      const entries = Object.entries(group)
        .filter(([key, value]) => !key.startsWith("_") && Array.isArray(value));
      const preferred = entries.find(([key, value]) => key.toLowerCase() === "a" && value.some(equipmentItemHasObject))
        || entries.find(([, value]) => value.some(equipmentItemHasObject))
        || entries[0];
      return preferred?.[1] || [];
    }

    function selectedClassStartingEquipmentItems(classItem) {
      const equipment = classItem?.startingEquipment;
      if (!equipment) return [];
      if (Array.isArray(equipment.defaultData) && equipment.defaultData.length) {
