        return equipment.defaultData.flatMap(selectedClassEquipmentGroupItems);
      }
      return (equipment.default || [])
        .flatMap((entry) => splitEquipmentItems(strip5eTags(entry)))
        .map((displayName) => ({ displayName }));
    }

    function applySelectedClassEquipment() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const selectedItems = selectedClassStartingEquipmentItems(detail?.classItem);
      if (!selectedItems.length) {
        applyCurrencySource("class:equipment", null);
        setGeneratedEquipmentValue("class:equipment", "");
        return;
      }
      const equipmentText = selectedItems
        .map(classEquipmentItemText)
        .filter(Boolean)
        .join(", ");
      applyCurrencySource("class:equipment", classEquipmentCurrencyTotals(selectedItems));
      setGeneratedEquipmentValue("class:equipment", equipmentText);
    }

    function backgroundEquipmentText(startingEquipment = []) {
      return startingEquipment
        .flatMap((group) => Object.entries(group || {}).flatMap(([key, values]) => key.startsWith("_") || key.length === 1 ? values : []))
        .map(equipmentItemText)
        .filter(Boolean)
        .join(", ");
    }

    function backgroundEntryLine(entry) {
      if (!entry || typeof entry !== "object") return "";
      const name = String(entry.name || "").replace(/:$/, "");
      const body = flattenEntryText(entry.entries || entry.items || "").trim();
      if (/^(?:Ability Scores|Feat|Skill Proficiencies|Skill Proficiency|Tool Proficiencies|Tool Proficiency|Languages|Equipment)$/i.test(name)) return "";
      if (!name && body) return body;
      if (!body) return name;
      return `${name}: ${body}`;
    }

    function backgroundDescriptionText(backgroundName, fallbackDescription = "") {
      const detail = selectedBackgroundDetail(backgroundName);
      if (!detail) return fallbackDescription;
      const lines = [
        `Source: ${sourceLabel(detail.source)}${detail.page ? `, page ${detail.page}` : ""}.`
      ];
      const skills = backgroundProficiencyText(detail.skillProficiencies, (value) => SKILL_NAMES.find((skill) => normalizeName(skill) === normalizeName(value)) || titleCaseWords([value])[0]);
      const tools = backgroundProficiencyText(detail.toolProficiencies);
      const languagesText = backgroundProficiencyText(detail.languageProficiencies, languageLabelFromKey);
      const equipment = backgroundEquipmentText(detail.startingEquipment);
      if (skills) lines.push(`Skill Proficiencies: ${skills}`);
      if (tools) lines.push(`Tool Proficiencies: ${tools}`);
      if (languagesText) lines.push(`Languages: ${languagesText}`);
      if (equipment) lines.push(`Equipment: ${equipment}`);
      (detail.entries || [])
        .map(backgroundEntryLine)
        .filter(Boolean)
        .forEach((line) => lines.push(line));
      if (fallbackDescription && !detail.entries?.length && normalizeName(fallbackDescription) !== normalizeName(lines.join(" "))) lines.push(`Summary: ${fallbackDescription}`);
      return lines.join("\n");
    }

    function selectedOptionDescription(type, selectedName) {
      const option = selectedOption(type, selectedName);
      if (type === "background") return backgroundDescriptionText(optionName(option), rawOptionDescriptionText(option));
      return rawOptionDescriptionText(option);
    }

    function cleanExtractedProficiencyText(value) {
      const compact = String(value || "")
        .replace(/\s+/g, " ")
        .replace(/\s+([,.;:])/g, "$1")
        .trim();
      if (!compact) return "";

      const words = compact.split(" ");
      if (words.length % 2 === 0) {
        const half = words.length / 2;
        const left = words.slice(0, half).join(" ").toLowerCase();
        const right = words.slice(half).join(" ").toLowerCase();
        if (left === right) return words.slice(0, half).join(" ");
      }
      return compact;
    }

    function extractColonSection(description, labels, stopLabels) {
      const labelPattern = labels.map((label) => label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
      const stopPattern = stopLabels.map((label) => label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
      const match = String(description || "").match(new RegExp(`(?:${labelPattern}):\\s*([\\s\\S]*?)(?=\\s+(?:${stopPattern}):|$)`, "i"));
      return cleanExtractedProficiencyText(match?.[1] || "");
    }

    function extractRaceLanguageText(description) {
      const match = String(description || "").match(/Languages?\s+([\s\S]*?)(?=\s+(?:Age|Alignment|Size|Speed|Flight|Source|Darkvision|Creature Type|Feat|Skill Proficiencies|Tool Proficiencies|Equipment)\b|$)/i);
      const cleaned = cleanExtractedProficiencyText(match?.[1] || "");
      return cleaned.split(/(?<=[.!?])\s+/)[0] || "";
    }

    function extractRaceProficiencyText(description) {
      return String(description || "")
        .split(/(?<=[.!?])\s+/)
        .map((sentence) => sentence.trim())
        .filter((sentence) => /\bproficien(?:cy|cies|t)\b/i.test(sentence) && !/proficiency bonus/i.test(sentence))
        .map(cleanExtractedProficiencyText)
        .filter(Boolean)
        .join(" ");
    }

    function strip5eTags(value) {
      return String(value || "")
        .replace(/{@(?:dice|damage|dc|chance)\s+([^}|]+)(?:\|[^}]*)?}/g, "$1")
        .replace(/{@(?:feat|spell|item|filter|book|variantrule|condition|skill|creature|class|background|action|itemProperty|quickref|status|sense|hazard)\s+([^}|]+)(?:\|[^}]*)?}/g, "$1")
        .replace(/{@b\s+([^}]+)}/g, "$1")
        .replace(/{@i\s+([^}]+)}/g, "$1")
        .replace(/{@[^}]+\s+([^}]+)}/g, "$1")
        .replace(/\s+/g, " ")
        .trim();
    }

    function flattenEntryText(entry) {
      if (typeof entry === "string") return strip5eTags(entry);
      if (Array.isArray(entry)) return entry.map(flattenEntryText).filter(Boolean).join(" ");
      if (!entry || typeof entry !== "object") return "";
      const parts = [];
      if (entry.name) parts.push(`${entry.name}.`);
      if (entry.entries) parts.push(flattenEntryText(entry.entries));
      if (entry.items) parts.push(flattenEntryText(entry.items));
      return parts.filter(Boolean).join(" ");
    }

    function titleCaseWords(values = []) {
      return values.map((value) => String(value || "")
        .split(/\s+/)
        .map((word) => word ? `${word[0].toUpperCase()}${word.slice(1)}` : "")
        .join(" "));
    }

    function preferredClassSource(classes = []) {
      return classes.find((item) => item.source === "XPHB")
        || classes[0]
        || null;
    }

    function preferredRaceSource(races = []) {
      return races.find((item) => item.source === "XPHB")
        || races.find((item) => item.source === "MPMM")
        || races[0]
        || null;
    }

    function raceDetailByName(raceName) {
      const normalized = normalizeName(raceName);
      if (!normalized) return null;
      const matches = raceDetails.filter((race) => normalizeName(race.name || "") === normalized);
      return preferredRaceSource(matches);
    }

    function formatRaceSize(race) {
      const values = Array.isArray(race?.size) ? race.size : [];
      const labels = { T: "Tiny", S: "Small", M: "Medium", L: "Large" };
      return values.length ? `Size: ${values.map((value) => labels[value] || value).join(" or ")}.` : "";
    }

    function formatRaceSpeed(race) {
      if (Number.isFinite(race?.speed)) return `Speed: ${race.speed} ft.`;
      if (typeof race?.speed === "object" && race.speed) {
        return `Speed: ${Object.entries(race.speed).map(([key, value]) => `${key} ${value} ft.`).join(", ")}.`;
      }
      return "";
    }

    function raceDescriptionText(raceName, fallbackDescription = "") {
      const race = raceDetailByName(raceName);
      if (!race) return fallbackDescription;
      const lines = [
        `Source: ${sourceLabel(race.source)}${race.page ? `, page ${race.page}` : ""}.`,
        formatRaceSize(race),
        formatRaceSpeed(race)
      ].filter(Boolean);
      if (fallbackDescription) lines.push(`Summary: ${fallbackDescription}`);
      if (race.entries?.length) {
        lines.push("Traits:");
        race.entries.forEach((entry) => {
          const name = entry.name || "Trait";
          const body = flattenEntryText(entry.entries || entry).split(/(?<=[.!?])\s+/).slice(0, 2).join(" ");
          lines.push(`${name}: ${body}`);
        });
      }
      return lines.join("\n");
    }

    function classDetailByName(className) {
      const normalized = normalizeName(className);
      if (!normalized) return null;
      const matching = classDetails
        .flatMap((file) => (file.class || []).map((classItem) => ({ file, classItem })))
        .filter(({ classItem }) => normalizeName(classItem.name || "") === normalized);
      if (!matching.length) return null;
      const selected = preferredClassSource(matching.map(({ classItem }) => classItem));
      const file = matching.find(({ classItem }) => classItem === selected)?.file || matching[0].file;
      return { file, classItem: selected };
    }

    function formatStartingProficiencies(proficiencies = {}) {
      const lines = [];
      if (proficiencies.armor?.length) lines.push(`Armor: ${titleCaseWords(proficiencies.armor).join(", ")}.`);
      if (proficiencies.weapons?.length) lines.push(`Weapons: ${titleCaseWords(proficiencies.weapons).join(", ")}.`);
      if (proficiencies.tools?.length) lines.push(`Tools: ${titleCaseWords(proficiencies.tools).join(", ")}.`);
      const skillParts = (proficiencies.skills || []).map((skill) => {
        if (typeof skill === "string") return titleCaseWords([skill])[0];
        if (skill?.choose?.from) return `Choose ${skill.choose.count || 1}: ${titleCaseWords(skill.choose.from).join(", ")}`;
        return "";
      }).filter(Boolean);
      if (skillParts.length) lines.push(`Skills: ${skillParts.join("; ")}.`);
      return lines;
    }

    function formatHitDie(classItem) {
      return classItem?.hd?.faces ? `Hit Die: d${classItem.hd.faces}.` : "";
    }

    function formatSavingThrows(classItem) {
      return classItem?.proficiency?.length ? `Saving Throws: ${classItem.proficiency.map((item) => item.toUpperCase()).join(", ")}.` : "";
    }

    function formatStartingEquipment(classItem) {
      const equipment = classItem?.startingEquipment;
      if (!equipment) return [];
      const lines = [];
      if (equipment.default?.length) lines.push(`Starting Equipment: ${equipment.default.map(strip5eTags).join(" ")}`);
      if (equipment.goldAlternative) lines.push(`Gold Alternative: ${strip5eTags(equipment.goldAlternative)}.`);
      return lines;
    }

    function classFeaturesFor(detail, level = null) {
      if (!detail) return [];
      const { file, classItem } = detail;
      return (file.classFeature || [])
        .filter((feature) => feature.className === classItem.name)
        .filter((feature) => feature.classSource === classItem.source || feature.source === classItem.source)
        .filter((feature) => level == null || Number(feature.level) === Number(level))
        .sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
    }

    function classSubclassChoiceFeature(detail) {
      if (!detail?.classItem?.classFeatures) return null;
      const ref = detail.classItem.classFeatures.find((item) => typeof item === "object" && item.gainSubclassFeature)
        || detail.classItem.classFeatures.find((item) => /subclass/i.test(typeof item === "string" ? item : item.classFeature || ""));
      if (!ref) return null;
      const raw = typeof ref === "string" ? ref : ref.classFeature || "";
      const parts = raw.split("|");
      const level = Number.parseInt(parts[3] || "", 10) || Number.parseInt(String(raw).match(/\|(\d+)$/)?.[1] || "", 10) || 3;
      return {
        name: `${detail.classItem.name} Subclass`,
        source: detail.classItem.source,
        page: detail.classItem.page,
        className: detail.classItem.name,
        classSource: detail.classItem.source,
        level,
        isSubclassChoice: true,
        entries: [`Choose your ${detail.classItem.name} subclass.`]
      };
    }

    function subclassesForClassDetail(detail) {
      if (!detail?.classItem) return [];
      const className = normalizeName(detail.classItem.name || "");
      const classSource = normalizeName(detail.classItem.source || "");
      return (detail.file.subclass || []).filter((subclass) => {
        if (normalizeName(subclass.className || "") !== className) return false;
        const subclassClassSource = normalizeName(subclass.classSource || "");
        return !subclassClassSource || subclassClassSource === classSource || normalizeName(subclass.source || "") === classSource;
      });
    }

    function preferSubclassVariant(previous, next, classItem) {
      if (!previous) return next;
      const classSource = normalizeName(classItem?.source || "");
      const previousClassSource = normalizeName(previous.classSource || "");
      const nextClassSource = normalizeName(next.classSource || "");
      const previousSource = normalizeName(previous.source || "");
      const nextSource = normalizeName(next.source || "");
      if (nextClassSource === classSource && previousClassSource !== classSource) return next;
      if (previousClassSource === classSource && nextClassSource !== classSource) return previous;
      if (nextSource === classSource && previousSource !== classSource) return next;
      if (previousSource === classSource && nextSource !== classSource) return previous;
      if (nextSource === "phb" && !["xphb", "phb"].includes(previousSource)) return next;
      return previous;
    }

    function subclassOptionsForFeature(feature) {
      const detail = classDetailByName(feature?.className || getMainClassName());
      if (!detail) return [];
      const byName = new Map();
      subclassesForClassDetail(detail).forEach((subclass) => {
        const key = normalizeName(subclass.shortName || subclass.name || "");
        if (!key) return;
        byName.set(key, preferSubclassVariant(byName.get(key), subclass, detail.classItem));
      });
      return [...byName.values()]
        .sort((a, b) => (a.name || "").localeCompare(b.name || ""))
        .map((subclass) => ({
          value: subclass.shortName || subclass.name,
          label: subclass.name || subclass.shortName,
          type: "subclass",
          subclass,
          description: flattenEntryText(subclass.entries || subclass.fluff?.entries || "")
        }));
    }

    function selectedSubclassForCharacter() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const choiceFeature = classSubclassChoiceFeature(detail);
      const selected = selectedFeatureChoices(featureChoiceKey(choiceFeature))[0];
      if (!detail || !selected) return null;
      return subclassesForClassDetail(detail)
        .filter((subclass) => normalizeName(subclass.shortName || subclass.name || "") === normalizeName(selected))
        .reduce((best, subclass) => preferSubclassVariant(best, subclass, detail.classItem), null);
    }

    function subclassFeaturesForCharacter() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const subclass = selectedSubclassForCharacter();
      const level = Math.max(1, Math.min(20, getCharacterLevel()));
      if (!detail || !subclass) return [];
      return (detail.file.subclassFeature || [])
        .filter((feature) => feature.className === detail.classItem.name)
        .filter((feature) => normalizeName(feature.subclassShortName || "") === normalizeName(subclass.shortName || subclass.name || ""))
        .filter((feature) => feature.subclassSource === subclass.source || feature.source === subclass.source)
        .filter((feature) => Number(feature.level) <= level)
        .sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
    }

    function isSubclassChoiceFeature(feature, detail) {
      if (!feature || !detail?.classItem) return false;
      if (feature.isSubclassChoice) return true;
      const className = normalizeName(detail.classItem.name || "");
      const name = normalizeName(feature.name || "");
      const text = normalizeName(flattenEntryText(feature.entries || feature.entry || ""));
      return name === `${className} subclass`
        || name === "subclass"
        || text.includes(`choose your ${className} subclass`)
        || text.includes("choose your subclass");
    }

    function featureSummary(feature, long = false) {
      const body = flattenEntryText(feature.entries || feature.entry || "");
      const sentences = body.split(/(?<=[.!?])\s+/).filter(Boolean);
      const summary = long ? sentences.slice(0, 3).join(" ") : sentences[0] || "";
      return `${feature.name}: ${summary}`.trim();
    }

    function classTableLinesForLevel(classItem, level) {
      if (!classItem?.classTableGroups || !level) return [];
      const lines = [];
      classItem.classTableGroups.forEach((group) => {
        if (group.rowsSpellProgression?.[level - 1]) {
          const slots = group.rowsSpellProgression[level - 1]
            .map((count, index) => count ? `L${index + 1}: ${count}` : "")
            .filter(Boolean)
            .join(", ");
          if (slots) lines.push(`${group.title || "Spell Slots"}: ${slots}.`);
        }

        const row = group.rows?.[level - 1];
        if (!row || !group.colLabels?.length) return;
        const parts = group.colLabels.map((label, index) => {
          const value = row[index];
          if (value == null || value === 0 || value === "") return "";
          return `${strip5eTags(label)} ${value}`;
        }).filter(Boolean);
        if (parts.length) lines.push(parts.join(", ") + ".");
      });
      return lines;
    }

    function classSpellcastingLines(classItem) {
      const lines = [];
      if (classItem?.spellcastingAbility) lines.push(`Spellcasting: ${String(classItem.spellcastingAbility).toUpperCase()} (${classItem.casterProgression || "progression"}).`);
      if (Array.isArray(classItem?.cantripProgression) && classItem.cantripProgression.length) lines.push(`Cantrips: ${classItem.cantripProgression.join(" / ")}.`);
      if (Array.isArray(classItem?.preparedSpellsProgression) && classItem.preparedSpellsProgression.length) lines.push(`Prepared Spells: ${classItem.preparedSpellsProgression.join(" / ")}.`);
      return lines;
    }

    function classDescriptionText(className, fallbackDescription = "") {
      const detail = classDetailByName(className);
      if (!detail) return fallbackDescription;
      const { classItem } = detail;
      const lines = [
        `Source: ${sourceLabel(classItem.source)}${classItem.page ? `, page ${classItem.page}` : ""}.`,
        formatHitDie(classItem),
        formatSavingThrows(classItem),
        ...formatStartingProficiencies(classItem.startingProficiencies),
        ...formatStartingEquipment(classItem),
        ...classSpellcastingLines(classItem)
      ].filter(Boolean);

      if (fallbackDescription) lines.push(`Summary: ${fallbackDescription}`);

      const grouped = new Map();
      classFeaturesFor(detail).forEach((feature) => {
        if (!grouped.has(feature.level)) grouped.set(feature.level, []);
        grouped.get(feature.level).push(featureSummary(feature));
      });
      if (grouped.size) {
        lines.push("Features:");
        grouped.forEach((features, level) => {
          lines.push(`Level ${level}: ${features.join(" ")}`);
        });
      }
      return lines.join("\n");
    }

    function levelDescriptionText(level) {
      const className = getSelectedClassName() || getMainClassName();
      const detail = classDetailByName(className);
      const classItem = detail?.classItem || null;
      const lines = [
        `Level Summary: ${className || "Character"} level ${level}.`,
        `Proficiency bonus: ${formatModifier(proficiencyBonusForLevel(level))}.`
      ];

      const tableLines = classTableLinesForLevel(classItem, level);
      if (tableLines.length) lines.push(...tableLines);
      else {
        const slots = spellSlotsForCharacter();
        const slotText = slots.map((count, index) => count ? `L${index + 1}: ${count}` : "").filter(Boolean).join(", ");
        if (slotText) lines.push(`Spell Slots: ${slotText}.`);
      }

      const gained = classFeaturesFor(detail, level).map((feature) => featureSummary(feature, true));
      if (gained.length) lines.push(`Features gained: ${gained.join(" ")}`);
      else if (className) lines.push("Features gained: no class feature found for this level in local class data.");
      else lines.push("Choose a class to see class features for this level.");

      return lines.join("\n");
    }

    function featRefFromString(value) {
      const raw = strip5eTags(String(value || ""))
        .replace(/\|[^|)]+$/g, "")
        .trim();
      if (!raw) return null;
      const sourceMatch = String(value || "").match(/\|([^}|)]+)(?:\}|$)/);
      const parenMatch = raw.match(/\(([^)]+)\)\s*$/);
      const semicolonParts = raw.split(";").map((part) => part.trim()).filter(Boolean);
      const name = (semicolonParts[0] || raw)
        .replace(/\([^)]*\)\s*$/g, "")
        .replace(/\bfeat\b/gi, "")
        .replace(/\s+/g, " ")
        .trim();
      const variant = semicolonParts[1] || parenMatch?.[1] || "";
      if (!name || !/[A-Za-z0-9]/.test(name)) return null;
      return { name, source: sourceMatch?.[1] || "", variant };
    }

    function backgroundFeatRefsFromDetail(detail) {
      return (Array.isArray(detail?.feats) ? detail.feats : [])
        .flatMap((group) => Object.entries(group || {})
          .filter(([, enabled]) => enabled)
          .map(([ref]) => featRefFromString(ref)))
        .filter(Boolean);
    }

    function splitFeatChoiceList(value) {
      return String(value || "")
        .replace(/\bor\b/gi, ",")
        .replace(/\band\b/gi, ",")
        .split(",")
        .map((item) => featRefFromString(item))
        .filter(Boolean);
    }

    function backgroundFeatChoiceRefsFromText(description) {
      const refs = [];
      [...String(description || "").matchAll(/\b(?:you gain|gain)\s+(?:the\s+)?(.+?)\s+feat\s+\(your choice\)/gi)]
        .forEach((match) => splitFeatChoiceList(match[1]).forEach((ref) => refs.push(ref)));
      return refs;
    }

    function selectedBackgroundFeatChoiceRefs() {
      const detail = selectedBackgroundDetail();
      const structured = Array.isArray(detail?.feats) && detail.feats.length > 1
        ? backgroundFeatRefsFromDetail(detail)
        : [];
      const fallback = backgroundFeatChoiceRefsFromText(selectedOptionDescription("background", fieldValue("Background")));
      const seen = new Set();
      return [...structured, ...fallback].filter((ref) => {
        const key = `${normalizeName(ref.name)}|${normalizeName(ref.source)}|${normalizeName(ref.variant)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function featRefsFromBackgroundText(description) {
      const stopLabels = [
        "Skill Proficiencies",
        "Skill Proficiency",
        "Tool Proficiencies",
        "Tool Proficiency",
        "Languages and Tool Proficiencies",
        "Languages",
        "Equipment",
        "Feature"
      ];
      const refs = [];
      const section = extractColonSection(description, ["Feat"], stopLabels);
      if (section) refs.push(featRefFromString(section));
      sentenceList(description).forEach((sentence) => {
        if (/\byour choice\b/i.test(sentence)) return;
        const match = sentence.match(/\b(?:you gain|gain)\s+(?:the\s+)?(.+?)\s+feat\b/i);
        if (!match) return;
        const ref = featRefFromString(match[1]);
        if (!ref) return;
        const variantMatch = sentence.match(/\bmust choose\s+([A-Za-z' -]+?)\s+(?:for the feat|within it)\b/i);
        if (variantMatch?.[1] && !ref.variant) ref.variant = variantMatch[1].trim();
        refs.push(ref);
        });
      return refs.filter(Boolean);
    }

    function selectedBackgroundFeatRefs() {
      const detail = selectedBackgroundDetail();
      const hasStructuredChoice = Array.isArray(detail?.feats) && detail.feats.length > 1;
      const structured = hasStructuredChoice ? [] : backgroundFeatRefsFromDetail(detail);
      const fallback = featRefsFromBackgroundText(selectedOptionDescription("background", fieldValue("Background")))
        .filter((ref) => findFeatData(ref));
      const choiceNames = new Set(selectedBackgroundFeatChoiceRefs().map((ref) => normalizeName(ref.name)));
      const seen = new Set();
      return [...structured, ...fallback].filter((ref) => {
        if (choiceNames.has(normalizeName(ref.name))) return false;
        const key = `${normalizeName(ref.name)}|${normalizeName(ref.source)}|${normalizeName(ref.variant)}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function featDisplayName(ref) {
      const name = String(ref?.name || "");
      const hasVariantInName = ref?.variant && normalizeName(name).includes(normalizeName(ref.variant));
      return [name.replace(/\s*;\s*/g, ": "), ref?.variant && !hasVariantInName ? `(${titleCaseWords([ref.variant])[0]})` : ""].filter(Boolean).join(" ");
    }

    function featNameFromBackground(description) {
      return featRefsFromBackgroundText(description)[0]?.name || "";
    }

    function featureTextFromBackground(description) {
      return extractColonSection(description, ["Feature"], ["Suggested Characteristics"]);
    }

    function backgroundFeatureTitle(featureText) {
      const firstSentence = String(featureText || "").split(/(?<=[.!?])\s+/)[0] || "";
      const titleMatch = firstSentence.match(/^(.+?)(?=\s+(?:As|You|Your|When|While|In addition|The)\b)/);
      if (titleMatch?.[1]) return titleMatch[1].trim();
      const words = firstSentence.split(/\s+/).filter(Boolean);
      if (words.length <= 6) return firstSentence;
      return words.slice(0, 6).join(" ");
    }

    function selectedBackgroundFeatName() {
      return featNameFromBackground(selectedOptionDescription("background", fieldValue("Background")));
    }

    function selectedBackgroundFeatureText() {
      return featureTextFromBackground(selectedOptionDescription("background", fieldValue("Background")));
    }

    function featDescription(featName) {
      const normalized = normalizeName(featName);
      if (!normalized) return "";
      const feat = feats.find((item) => normalizeName(item.name) === normalized && item.source === "XPHB")
        || feats.find((item) => normalizeName(item.name) === normalized)
        || null;
      if (!feat) return `${featName}: feat otorgado por el background seleccionado.`;
      const body = flattenEntryText(feat.entries).split(/(?<=[.!?])\s+/).slice(0, 5).join(" ");
      return `${feat.name}: ${body || "feat otorgado por el background seleccionado."}`;
    }

    function selectedBackgroundFeatureEntries() {
      const detail = selectedBackgroundDetail();
      const detailed = (detail?.entries || [])
        .filter((entry) => entry && typeof entry === "object")
        .filter((entry) => entry.data?.isFeature || /\bFeature\b/i.test(entry.name || ""))
        .map((entry) => {
          const title = String(entry.name || "Background Feature").replace(/^Feature:\s*/i, "").trim();
          const description = flattenEntryText(entry.entries || entry.items || "").trim();
          return { title, description };
        })
        .filter((entry) => entry.title || entry.description);
      if (detailed.length) return detailed;

      const featureText = selectedBackgroundFeatureText();
      const featureTitle = backgroundFeatureTitle(featureText);
      return featureText ? [{ title: featureTitle || "Feature", description: featureText }] : [];
    }

    function backgroundFeatureEntries() {
      const featRefs = selectedBackgroundFeatRefs();
      const featureEntries = selectedBackgroundFeatureEntries();
      const entries = [];
      featRefs.forEach((ref) => {
        const feat = findFeatData(ref);
        const featName = feat?.name || ref.name;
        const displayName = featDisplayName({ ...ref, name: featName });
        const feature = feat ? {
          name: displayName,
          source: feat.source,
          page: feat.page,
          level: 1,
          isFeatFeature: true,
          choiceContext: `background:${normalizeName(getFieldValueByNormalizedKey("background") || "")}:${normalizeName(displayName)}`,
          featVariant: ref.variant,
          feat,
          entries: feat.entries || []
        } : null;
        entries.push({
          type: "feat",
          title: `Background Feat: ${displayName}`,
          meta: "Background feat",
          featName,
          featVariant: ref.variant,
          feat,
          feature,
          description: feat ? flattenEntryText(feat.entries) || featDescription(featName) : featDescription(featName),
          backgroundFeature: featureEntries.map((entry) => `${entry.title}: ${entry.description}`).join("\n\n")
        });
      });
      featureEntries.forEach((feature) => {
        entries.push({
          type: "backgroundFeature",
          title: `Background Feature: ${feature.title || "Feature"}`,
          meta: "Background feature",
          description: feature.description
        });
      });
      return entries;
    }

    function backgroundFeatChoiceEntries(includeSelected = false) {
      const featRefs = selectedBackgroundFeatChoiceRefs();
      if (!featRefs.length) return [];
      const backgroundName = getFieldValueByNormalizedKey("background") || "Background";
      const feature = {
        name: `${backgroundName} Feat`,
        source: selectedBackgroundDetail()?.source || "",
        level: 1,
        isBackgroundFeatChoice: true,
        featRefs,
        entries: [`Choose the feat granted by ${backgroundName}.`]
      };
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      if (selected.length && !includeSelected) return [];
      return [{
        type: "backgroundFeatChoice",
        title: `Background Feat Choice: ${backgroundName}`,
        meta: "Pending background feat",
        description: feature.entries.join(" "),
        feature
      }];
    }

    function classFeatureEntriesForCharacter() {
      const className = getMainClassName() || getSelectedClassName();
      const level = Math.max(1, Math.min(20, getCharacterLevel()));
      const detail = classDetailByName(className);
      if (!detail) return [];
      const seen = new Set();
      const classEntries = classFeaturesFor(detail)
        .filter((feature) => Number(feature.level) <= level)
        .filter((feature) => {
          const key = `${feature.level}:${normalizeName(feature.name)}:${feature.source}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map((feature) => {
          const normalizedFeature = isSubclassChoiceFeature(feature, detail)
            ? { ...feature, isSubclassChoice: true }
            : feature;
          return {
            type: "classFeature",
            title: `Level ${normalizedFeature.level}: ${normalizedFeature.name}`,
            meta: `${detail.classItem.name} feature`,
            description: flattenEntryText(normalizedFeature.entries || normalizedFeature.entry || ""),
            feature: normalizedFeature
          };
        });
      const subclassChoice = classSubclassChoiceFeature(detail);
      const subclassChoiceKey = subclassChoice ? `${subclassChoice.level}:${normalizeName(subclassChoice.name)}:${subclassChoice.source}` : "";
      if (subclassChoice && Number(subclassChoice.level) <= level && !seen.has(subclassChoiceKey)) {
        seen.add(subclassChoiceKey);
        classEntries.push({
          type: "classFeature",
          title: `Level ${subclassChoice.level}: ${subclassChoice.name}`,
          meta: `${detail.classItem.name} choice`,
          description: flattenEntryText(subclassChoice.entries || ""),
          feature: subclassChoice
        });
      }
      subclassFeaturesForCharacter().forEach((feature) => {
        classEntries.push({
          type: "classFeature",
          title: `Level ${feature.level}: ${feature.name}`,
          meta: `${feature.subclassShortName || "Subclass"} feature`,
          description: flattenEntryText(feature.entries || feature.entry || ""),
          feature
        });
      });
      return classEntries.sort((a, b) => {
        const levelA = Number(a.feature?.level) || 0;
        const levelB = Number(b.feature?.level) || 0;
        return levelA - levelB || a.title.localeCompare(b.title);
      });
    }

    function selectedFeatureChoiceEntries() {
      return choosableFeatureEntriesForCharacter().flatMap((entry) => {
        const key = featureChoiceKey(entry.feature);
        const selected = selectedFeatureChoices(key);
        const specOptions = featureChoiceSpecs(entry.feature).flatMap((spec) => spec.options || []);
        if (isAbilityScoreImprovementFeature(entry.feature) && selected.includes(ASI_CHOICE_VALUE)) {
          const asiChoice = selected.find((value) => String(value).startsWith("asi:"));
          const asiLabel = abilityScoreIncreaseOptions().find((option) => option.value === asiChoice)?.label || "pending ability choice";
          return [{
            type: "text",
            title: `${entry.feature.name}: ${ASI_CHOICE_VALUE}${asiChoice ? ` (${asiLabel})` : ""}`,
            meta: "Ability Score Improvement",
            description: asiChoice
              ? `Selected ${ASI_CHOICE_VALUE}: ${asiLabel}. Apply this increase to the character ability scores.`
              : `Selected ${ASI_CHOICE_VALUE}. Choose which ability score increase to apply.`,
            parentFeature: entry.feature
          }];
        }
        return selected
          .filter((choiceName) => !String(choiceName).startsWith("asi:") && choiceName !== ASI_CHOICE_VALUE)
          .map((choiceName) => {
          const selectedOption = specOptions.find((option) => option.value === choiceName);
          if (entry.feature?.isRaceFeature && !choiceName.startsWith("weapon-mastery:")) {
            const feat = findFeatData(choiceName);
            return {
              type: feat ? "feat" : "text",
              title: `${entry.feature.name}: ${choiceName}`,
              meta: feat ? "Race feat" : "Race choice",
              featName: feat?.name,
              description: flattenEntryText(feat?.entries || selectedOption?.description || ""),
              parentFeature: entry.feature
            };
          }
          if (entry.feature?.isSubclassChoice) {
            const subclass = subclassOptionsForFeature(entry.feature).find((option) => option.value === choiceName)?.subclass || null;
            return {
              type: "subclass",
              title: `${entry.feature.name}: ${choiceName}`,
              meta: "Subclass",
              description: flattenEntryText(subclass?.entries || subclass?.fluff?.entries || ""),
              subclass
            };
          }
          if (choiceName.startsWith("weapon-mastery:")) {
            const weaponName = choiceName.replace(/^weapon-mastery:/, "");
            const item = findItemData(weaponName);
            const masteryRef = item?.mastery?.[0] || "";
            const masteryName = splitRef(masteryRef).abbreviation || "Mastery";
            const mastery = masteryData(masteryRef);
            return {
              type: "weaponMastery",
              title: `${entry.feature.name}: ${weaponName} (${masteryName})`,
              meta: "Weapon Mastery",
              description: flattenEntryText(mastery?.entries || ""),
              weaponName,
              masteryName,
              mastery
            };
          }
          const feat = findFeatData(choiceName);
          const optional = optionalFeatureByName(choiceName);
          const cleanedChoiceName = String(choiceName).replace(/^(?:skill|tool|feat-ability|spell|expertise|language):/i, "");
          return {
            type: feat ? "feat" : optional ? "optionalfeature" : "text",
            title: `${entry.feature.name}: ${selectedOption?.type === "expertiseSkill" ? `Expertise in ${cleanedChoiceName}` : cleanedChoiceName}`,
            meta: feat ? "Selected feat" : optional ? "Selected feature option" : selectedOption?.type === "expertiseSkill" ? "Expertise" : "Selected choice",
            featName: feat?.name,
            optionalFeature: optional,
            description: flattenEntryText(feat?.entries || optional?.entries || selectedOption?.description || ""),
            parentFeature: entry.feature
          };
        });
      });
    }

    function renderSingleRaceChoiceControl(option, choice, onChange = null) {
      const group = document.createElement("div");
      group.className = "option-choice-group";
      appendText(group, "option-choice-title", choice.label);
      const isMultiple = (choice.count || 1) > 1;
      const selectedValues = selectedChoiceValues(choice);
      choice.options.forEach((item) => {
        const disabled = isSkillOptionAlreadyProficient(item, selectedValues);
        const label = document.createElement("label");
        label.className = "option-choice";
        label.classList.toggle("disabled", disabled);

        const input = document.createElement("input");
        input.type = isMultiple ? "checkbox" : "radio";
        input.name = choice.key;
        input.value = item.value;
        input.checked = selectedValues.includes(item.value);
        input.disabled = disabled;
        input.addEventListener("change", () => {
          if (isMultiple) {
            if (!updateMultiChoiceSelection(choice, item.value, input.checked)) input.checked = false;
          } else {
            setSelectedChoice(choice.key, item.value);
          }
          if (typeof onChange === "function") onChange(choice, item.value);
        });

        const text = document.createElement("span");
        text.className = "option-choice-text";
        text.textContent = skillOptionLabel(item, disabled);
        label.append(input, text);
        group.appendChild(label);
      });
      return group;
    }

    function buildRaceChoiceDrawerContent(choice) {
      const option = selectedRaceOption();
      const root = document.createElement("div");
      root.className = "item-sheet";
      appendText(root, "item-sheet-title", choice?.sectionLabel || "Race Choice", "h2");
      appendText(root, "item-sheet-subtitle", `${getSelectedRaceName() || "Race"} choice`);
      if (!option || !choice) {
        appendItemSection(root, "Sin datos", "Elegí una raza para ver esta opción.");
        return root;
      }
      root.appendChild(renderSingleRaceChoiceControl(option, choice, () => {
        updateDerivedStats();
        const entries = generatedFeaturesAndTraitsEntries();
        const refreshed = findSelectedRaceChoices().find((item) => item.key === choice.key) || choice;
        const body = buildRaceChoiceDrawerContent(refreshed);
        appendFeatureBackButton(body, entries);
        showDrawer(`Race Choice: ${refreshed.sectionLabel}`, isBackgroundChoiceComplete(refreshed) ? "Selected race choice" : "Pending race choice", body);
      }));
      return root;
    }

    function selectedRaceChoiceEntries() {
      const size = selectedRaceChoiceText("Size");
      const eladrinSeason = selectedRaceChoiceText("Eladrin Season");
      const spellcastingAbility = selectedRaceSpellcastingAbility();
      const ancestry = selectedDraconicAncestryOption();
      const fiendishLegacy = selectedFiendishLegacyOption();
      const namedListChoices = findSelectedRaceChoices()
        .filter((choice) => !["size", "eladrin season", "spellcasting ability", "fiendish legacy", "skill proficiencies", "skill proficiency", "languages", "tool proficiencies"].includes(normalizeName(choice.sectionLabel || "")))
        .flatMap((choice) => isBackgroundChoiceComplete(choice)
          ? selectedChoiceValues(choice).map((value) => ({
            choice,
            option: choice.options.find((item) => item.value === value)
          })).filter((item) => item.option)
          : []);
      const entries = [];
      if (size) {
        entries.push({
          type: "raceChoice",
          title: `Race Size: ${size}`,
          meta: "Race choice",
          description: `Selected race size: ${size}.`
        });
      }
      if (eladrinSeason) {
        entries.push({
          type: "raceChoice",
          title: `Eladrin Season: ${eladrinSeason}`,
          meta: "Race choice",
          description: `Selected eladrin season: ${eladrinSeason}.`
        });
      }
      if (spellcastingAbility) {
        entries.push({
          type: "raceChoice",
          title: `Race Spellcasting Ability: ${spellcastingAbility}`,
          meta: "Race choice",
          description: `${spellcastingAbility} is the spellcasting ability for spells and save DCs granted by this race trait.`
        });
      }
      namedListChoices.forEach(({ choice, option }) => {
        entries.push({
          type: "raceChoice",
          title: `${choice.sectionLabel}: ${option.value}`,
          meta: "Race choice",
          description: option.description || `Selected ${choice.sectionLabel}: ${option.value}.`
        });
      });
      if (fiendishLegacy) {
        entries.push({
          type: "raceChoice",
          title: `Fiendish Legacy: ${fiendishLegacy.value}`,
          meta: "Race choice",
          description: fiendishLegacy.description || `Selected Fiendish Legacy: ${fiendishLegacy.value}.`
        });
      }
      if (ancestry) {
        const damage = ancestry.damageType ? `${ancestry.damageType} damage` : "the selected damage type";
        entries.push({
          type: "raceChoice",
          title: `Draconic Ancestry: ${ancestry.value}`,
          meta: "Race choice",
          description: [
            `Draconic Ancestry: ${ancestry.value}.`,
            `Damage Resistance: You have resistance to ${damage}.`,
            ancestry.breathWeapon ? `Breath Weapon: ${ancestry.breathWeapon}; damage type ${ancestry.damageType}.` : `Breath Weapon damage type: ${ancestry.damageType}.`
          ].filter(Boolean).join("\n")
        });
      }
      return entries;
    }

    function raceChoiceControlEntries() {
      return findSelectedRaceChoices().map((choice) => {
        const selected = selectedChoiceValues(choice)
          .map((value) => choice.options.find((option) => option.value === value)?.label || value)
          .filter(Boolean);
        return {
          type: "raceChoiceControl",
          title: `Race Choice: ${choice.sectionLabel}`,
          meta: selected.length ? `Selected: ${selected.join(", ")}` : "Pending race choice",
          description: choice.label,
          choice
        };
      });
    }

    function raceFeatureEntriesForCharacter() {
      const race = raceDetailByName(getSelectedRaceName());
      if (!race?.entries?.length) return [];
      return race.entries
        .filter((entry) => entry && typeof entry === "object")
        .filter((entry) => !(normalizeName(race.name) === "tiefling" && normalizeName(entry.name || "") === "fiendish legacy"))
        .map((entry) => {
          const feature = {
            name: entry.name || "Race Trait",
            source: race.source,
            page: race.page,
            raceName: race.name,
            level: 1,
            isRaceFeature: true,
            entries: entry.entries || [entry]
          };
          return {
            type: "raceFeature",
            title: `Race: ${feature.name}`,
            meta: `${race.name} trait`,
            description: flattenEntryText(feature.entries),
            feature
          };
        });
    }

    function choosableFeatureEntriesForCharacter() {
      return [
        ...classStartingSkillChoiceEntries(true),
        ...backgroundFeatChoiceEntries(true),
        ...backgroundFeatureEntries().filter((entry) => entry.feature && featureChoiceSpecs(entry.feature).length),
        ...raceFeatureEntriesForCharacter(),
        ...classFeatureEntriesForCharacter()
      ];
    }

    function generatedFeaturesAndTraitsEntries() {
      const selectedEntries = selectedFeatureChoiceEntries();
      const baseEntries = [...raceFeatureEntriesForCharacter(), ...classFeatureEntriesForCharacter()]
        .filter((entry) => selectedFeatureChoices(featureChoiceKey(entry.feature)).length === 0 || featureChoiceSpecs(entry.feature).length > 0);
      return [...backgroundFeatureEntries(), ...backgroundFeatChoiceEntries(), ...classStartingSkillChoiceEntries(), ...raceChoiceControlEntries(), ...selectedRaceChoiceEntries(), ...baseEntries, ...selectedEntries];
    }

    function clearLegacyAdditionalFeaturesField(primaryField) {
      const legacy = getFieldByKey("Feat+Traits");
      if (!legacy || legacy === primaryField || legacy.dataset.pageNumber === "1") return;
      const lines = legacy.value.split(/\n+/).map((line) => line.trim()).filter(Boolean);
      const looksGenerated = lines.length > 0 && lines.every((line) => /^(Background Feat|Background Feature|Level \d+):/i.test(line));
      if (legacy.dataset.generatedFeaturesAndTraits === "true" || legacy.dataset.generatedBackgroundFeat === "true" || looksGenerated) {
        legacy.value = "";
        legacy.title = legacy.dataset.key || "Feat+Traits";
        legacy.dataset.generatedFeaturesAndTraits = "false";
        legacy.dataset.generatedBackgroundFeat = "false";
      }
    }

    function updateBackgroundFeatTraits() {
      const entries = generatedFeaturesAndTraitsEntries();
      const field = getFeaturesTraitsField();
      if (!field) return;
      clearLegacyAdditionalFeaturesField(field);
      bindFeatureDrawer(field);
      if (!entries.length) {
        if (field.dataset.generatedFeaturesAndTraits === "true") field.value = "";
        field.dataset.generatedFeaturesAndTraits = "false";
        field.dataset.featureName = "";
        field.dataset.featureTitle = "";
        field.dataset.featureMeta = "";
        field.dataset.featureDescription = "";
        field.dataset.backgroundFeature = "";
        field.removeAttribute("title");
        return;
      }

      field.value = entries.map((entry) => entry.title).join("\n");
      field.dataset.generatedFeaturesAndTraits = "true";
      field.dataset.generatedBackgroundFeat = "false";
      field.dataset.featureName = "";
      field.dataset.featureTitle = "Features & Traits";
      field.dataset.featureMeta = "Generated";
      field.dataset.featureDescription = entries.map((entry) => `${entry.title}\n${entry.description || ""}`).join("\n\n");
      field.dataset.backgroundFeature = "";
      field.removeAttribute("title");
    }

    function backgroundSectionText(backgroundDescription, labels, stopLabels) {
      for (const label of labels) {
        const selectedText = selectedBackgroundChoiceText(label);
        if (selectedText !== null) return selectedText;
      }
      return extractColonSection(backgroundDescription, labels, stopLabels);
    }

    function uniqueReadableValues(values) {
      const seen = new Set();
      return values
        .map(cleanExtractedProficiencyText)
        .filter(Boolean)
        .filter((value) => {
          const key = normalizeName(value);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function appendReadableSection(sections, title, items) {
      const lines = uniqueReadableValues(items)
        .map((item) => `- ${item}`);
      if (!lines.length) return;
      sections.push([title.toUpperCase(), ...lines].join("\n"));
    }

    const DAMAGE_TYPE_LABELS = [
      "acid",
      "bludgeoning",
      "cold",
      "fire",
      "force",
      "lightning",
      "necrotic",
      "piercing",
      "poison",
      "psychic",
      "radiant",
      "slashing",
      "thunder"
    ];

    const CONDITION_IMMUNITY_LABELS = [
      "charmed",
      "disease",
      "exhaustion",
      "frightened",
      "grappled",
      "incapacitated",
      "paralyzed",
      "petrified",
      "poisoned",
      "prone",
      "restrained",
      "stunned",
      "unconscious"
    ];

    function sentenceList(value) {
      return String(value || "")
        .replace(/\s+/g, " ")
        .split(/(?<=[.!?])\s+/)
        .map((sentence) => sentence.trim())
        .filter(Boolean);
    }

    function isConditionalEffectSentence(sentence, context = "") {
      return /\b(?:while|when|whenever|if|until|for the duration|during|as long as|provided that|once .* until|rage|raging|transform|transformation|activate|activated)\b/i.test(`${context} ${sentence}`);
    }

    function generatedEffectSources() {
      return generatedFeaturesAndTraitsEntries()
        .map((entry) => ({
          source: entry.title || entry.feature?.name || entry.optionalFeature?.name || "Feature",
          text: String(entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || "") || "")
        }))
        .filter((entry) => entry.text);
    }

    function selectedDefenseSources() {
      const passive = [];
      const conditional = [];
      generatedEffectSources().forEach(({ source, text }) => {
        sentenceList(text).forEach((sentence) => {
        const lower = sentence.toLowerCase();
          const resistances = [];
          const immunities = [];
        if (/\bresistan(?:ce|t)\b/.test(lower)) {
          DAMAGE_TYPE_LABELS.forEach((type) => {
            if (new RegExp(`\\b${type}\\s+damage\\b`, "i").test(sentence)) resistances.push(`${type} damage`);
          });
        }
        if (/\b(?:immune|immunity|immunities)\b/.test(lower)) {
          DAMAGE_TYPE_LABELS.forEach((type) => {
            if (new RegExp(`\\b${type}\\s+damage\\b`, "i").test(sentence)) immunities.push(`${type} damage`);
          });
          CONDITION_IMMUNITY_LABELS.forEach((condition) => {
            if (new RegExp(`\\b${condition}\\b`, "i").test(sentence)) {
              immunities.push(condition === "poisoned" ? "poisoned condition" : condition);
            }
          });
        }
          const parts = [];
          if (resistances.length) parts.push(`Resistances: ${uniqueReadableValues(resistances).join(", ")}`);
          if (immunities.length) parts.push(`Immunities: ${uniqueReadableValues(immunities).join(", ")}`);
          if (!parts.length) return;
          const line = `${source}: ${parts.join("; ")}`;
          if (isConditionalEffectSentence(sentence, source)) conditional.push(`${line} (${cleanExtractedProficiencyText(sentence).replace(/\.$/, "")}.)`);
          else passive.push(line);
        });
      });

      return {
        passive: uniqueReadableValues(passive),
        conditional: uniqueReadableValues(conditional)
      };
    }

    function calculateOtherProficienciesAndLanguages() {
      const stopLabels = [
        "Source",
        "Hit Die",
        "Armor",
        "Weapons",
        "Ability Scores",
        "Feat",
        "Skill Proficiencies",
        "Skill Proficiency",
        "Tool Proficiencies",
        "Tool Proficiency",
        "Languages and Tool Proficiencies",
        "Languages",
        "Equipment",
        "Feature"
      ];
      const sections = [];
      const classItems = [];

      const classDescription = selectedOptionDescription("class", getMainClassName());
      const classArmor = extractColonSection(classDescription, ["Armor"], stopLabels);
      const classWeapons = extractColonSection(classDescription, ["Weapons"], stopLabels);
      if (classArmor) classItems.push(`Armor: ${classArmor}`);
      if (classWeapons) classItems.push(`Weapons: ${classWeapons}`);
      const classFeatureLanguages = [
        ...classFeatureEntriesForCharacter()
          .filter((entry) => /\byou know thieves'? cant\b/i.test(flattenEntryText(entry.feature?.entries || entry.description || "")))
          .map(() => "Thieves' Cant"),
        ...selectedFeatureLanguageChoices()
      ];
      if (classFeatureLanguages.length) classItems.push(`Languages: ${uniqueReadableValues(classFeatureLanguages).join(", ")}`);
      appendReadableSection(sections, "Class", classItems);

      const backgroundDescription = selectedOptionDescription("background", getFieldValueByNormalizedKey("background"));
      const backgroundToolsAndLanguages = backgroundSectionText(backgroundDescription, ["Languages and Tool Proficiencies"], stopLabels);
      const backgroundTools = backgroundSectionText(backgroundDescription, ["Tool Proficiencies", "Tool Proficiency"], stopLabels);
      const backgroundLanguages = backgroundSectionText(backgroundDescription, ["Languages"], stopLabels);
      const backgroundItems = [];
      if (backgroundToolsAndLanguages) backgroundItems.push(`Tools/Languages: ${backgroundToolsAndLanguages}`);
      else {
        if (backgroundTools) backgroundItems.push(`Tools: ${backgroundTools}`);
        if (backgroundLanguages) backgroundItems.push(`Languages: ${backgroundLanguages}`);
      }
      appendReadableSection(sections, "Background", backgroundItems);

      const race = selectedRaceDetail();
      const raceDescription = selectedOptionDescription("race", getSelectedRaceName());
      const selectedRaceLanguages = selectedRaceChoiceText("Languages");
      const rawRaceLanguages = extractRaceLanguageText(raceDescription)
        .replace(/\b(?:one|two|three)\s+(?:(?:other|extra)\s+)?languages?\s+of your choice\b/gi, "")
        .replace(/\band\s*$/i, "")
        .replace(/[,.]\s*$/g, "")
        .trim();
      const fixedRaceLanguages = rawRaceLanguages ? [] : fixedRaceProficiencyValues(race, "languageProficiencies", languageLabelFromKey)
        .filter((language) => normalizeName(language) !== "other");
      const raceLanguages = [
        ...fixedRaceLanguages,
        rawRaceLanguages,
        selectedRaceLanguages
      ].filter(Boolean).join(", ");
      const raceToolProficiencies = [
        ...fixedRaceProficiencyValues(race, "toolProficiencies", (key) => titleCaseWords([key])[0]),
        selectedRaceChoiceText("Tool Proficiencies")
      ].filter(Boolean).join(", ");
      const raceProficiencies = extractRaceProficiencyText(raceDescription)
        .replace(/proficiency in one of the following skills of your choice:\s*[^.;]+/gi, "")
        .replace(/proficiency in one skill of your choice/gi, "")
        .trim();
      const raceItems = [];
      if (raceLanguages) raceItems.push(`Languages: ${raceLanguages}`);
      if (raceToolProficiencies) raceItems.push(`Tools: ${raceToolProficiencies}`);
      if (raceProficiencies) raceItems.push(`Proficiencies: ${raceProficiencies}`);
      appendReadableSection(sections, "Race", raceItems);

      const featItems = [];
      activeFeatData().forEach((feat) => {
        const tools = backgroundProficiencyText(feat.toolProficiencies, (value) => titleCaseWords([String(value).split("|")[0]])[0]);
        const languages = backgroundProficiencyText(feat.languageProficiencies, languageLabelFromKey);
        const skills = backgroundProficiencyText(feat.skillProficiencies, (value) => SKILL_NAMES.find((skill) => normalizeName(skill) === normalizeName(value)) || titleCaseWords([value])[0]);
        if (skills) featItems.push(`${feat.name} Skills: ${skills}`);
        if (tools) featItems.push(`${feat.name} Tools: ${tools}`);
        if (languages) featItems.push(`${feat.name} Languages: ${languages}`);
      });
      const selectedTools = selectedFeatToolChoices();
      if (selectedTools.length) featItems.push(`Selected feat tools: ${uniqueReadableValues(selectedTools).join(", ")}`);
      appendReadableSection(sections, "Feats", featItems);

      const defenses = selectedDefenseSources();
      const armorPenalty = armorProficiencyPenaltyText();
      if (armorPenalty) defenses.conditional.push(armorPenalty);
      appendReadableSection(sections, "Defenses", defenses.passive);

      appendReadableSection(sections, "Conditional Effects", defenses.conditional);

      return sections.join("\n\n");
    }

    function updateOtherProficienciesAndLanguages() {
      setFieldValue("ProficienciesLang", calculateOtherProficienciesAndLanguages());
    }

    function armorRuleFromEquipment(text) {
      return ARMOR_AC_RULES.find((rule) => rule.aliases.some((alias) => textIncludesPhrase(text, alias))) || null;
    }

    function hasShieldEquipped() {
      return Boolean(equippedInSlot("offHand")?.item && isShieldItem(equippedInSlot("offHand").item));
    }

    function equippedShieldArmorClassBonus() {
      const shield = equippedInSlot("offHand")?.item || null;
      if (!shield || !isShieldItem(shield)) return 0;
      const base = Number.isFinite(shield.ac) ? shield.ac : 2;
      return base + itemArmorClassBonus(shield);
    }

    function naturalArmorCandidates(dexModifier, conModifier) {
      const description = selectedRaceDescription();
      const candidates = [];
      if (!description) return candidates;

      if (/base armor class is 13 \+ your dexterity modifier|base ac of 13 \+ your dexterity modifier|base armor class of 13 \+ your dexterity modifier/.test(description)) {
        candidates.push(13 + dexModifier);
      }
      if (/ac is 12 \+ your dexterity modifier|base ac of 12 \+ your dexterity modifier/.test(description)) {
        candidates.push(12 + dexModifier);
      }
      if (/base ac of 17|armor class of 17/.test(description)) {
        candidates.push(17);
      }
      if (/ac is 12 \+ your constitution modifier|armor class is 12 \+ your constitution modifier/.test(description) && conModifier != null) {
        candidates.push(12 + conModifier);
      }
      return candidates;
    }

    function armorClassBonusFromRace() {
      const description = selectedRaceDescription();
      return /gain a \+1 bonus to your armor class|gain a \+1 bonus to ac/.test(description) ? 1 : 0;
    }

    function featureEffectEntries() {
      return generatedFeaturesAndTraitsEntries()
        .filter((entry) => entry.type !== "classFeature" || selectedFeatureChoices(featureChoiceKey(entry.feature)).length === 0)
        .map((entry) => ({
          title: entry.feature?.name || entry.optionalFeature?.name || entry.title || "",
          description: String(entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || "") || "")
        }));
    }

    function armorClassBonusFromFeatures(equippedArmor) {
      let bonus = 0;
      const hasArmor = Boolean(equippedArmor && isArmorItem(equippedArmor));
      const hasShield = hasShieldEquipped();
      featureEffectEntries().forEach(({ title, description }) => {
        const text = `${title}\n${description}`;
        const match = text.match(/(?:gain|gains|have|has|grants?)[^.]{0,80}\+(\d+)\s+bonus\s+to\s+(?:your\s+)?(?:armor class|ac)\b/i)
          || text.match(/\+(\d+)\s+(?:to|bonus to)\s+(?:your\s+)?(?:armor class|ac)\b/i);
        if (!match) return;

        const lower = text.toLowerCase();
        if (/wearing (?:light, medium, or heavy )?armor|wearing armor|while you(?:'re| are) wearing/i.test(text) && !hasArmor) return;
        if (/wielding .*shield|holding .*shield|while you have a shield/i.test(text) && !hasShield) return;
        if (/not wearing armor|aren't wearing armor|are not wearing armor/i.test(text) && hasArmor) return;

        if (lower.includes("defense") && !hasArmor) return;
        bonus += Number.parseInt(match[1], 10) || 0;
      });
      return bonus;
    }

    function calculateArmorClass() {
      const dexModifier = abilityModifier(getFieldByKey("DEX")?.value || "");
      if (dexModifier == null) return "";

      const conModifier = abilityModifier(getFieldByKey("CON")?.value || "");
      const wisModifier = abilityModifier(getFieldByKey("WIS")?.value || "");
      const equippedArmor = equippedInSlot("armor")?.item || null;
      const shieldBonus = equippedShieldArmorClassBonus();
      const raceBonus = armorClassBonusFromRace();
      const featureBonus = armorClassBonusFromFeatures(equippedArmor);
      const candidates = [{ ac: 10 + dexModifier, allowsShield: true }];

      const armor = armorRuleFromItem(equippedArmor);
      if (armor) candidates.push({ ac: armor.base + clampDexModifierForArmor(dexModifier, armor.dexCap) + (armor.bonus || 0), allowsShield: true });

      const className = normalizeName(getMainClassName());
      if (!armor && className === "barbarian" && conModifier != null) candidates.push({ ac: 10 + dexModifier + conModifier, allowsShield: true });
      if (!armor && className === "monk" && wisModifier != null) candidates.push({ ac: 10 + dexModifier + wisModifier, allowsShield: false });
      if (!armor) {
        naturalArmorCandidates(dexModifier, conModifier).forEach((ac) => {
          candidates.push({ ac, allowsShield: true });
        });
      }

      const best = Math.max(...candidates.map((candidate) => candidate.ac + (candidate.allowsShield ? shieldBonus : 0)));
      return String(best + raceBonus + featureBonus);
    }

    function updateArmorClass() {
      setFieldValue("AC", calculateArmorClass());
    }

    function extractRaceSpeed() {
      const description = selectedRaceDescription();
      if (!description) return "30";

      const walkingMatch = description.match(/(?:base walking speed|walking speed|walk speed)\s+(?:is\s+)?(?:of\s+)?(\d+)\s*feet/i);
      if (walkingMatch) return walkingMatch[1];

      const speedMatch = description.match(/(?:your speed|speed)\s+(?:is\s+)?(?:of\s+)?(\d+)\s*feet/i);
      if (speedMatch) return speedMatch[1];

      const fallbackSpecialSpeed = description.match(/(?:flying|swimming|climbing|climb|fly|swim) speed\s+(?:is\s+)?(?:of\s+)?(\d+)\s*feet/i);
      if (fallbackSpecialSpeed) return fallbackSpecialSpeed[1];

      return "30";
    }

    function updateSpeed() {
      setFieldValue("Speed", extractRaceSpeed());
    }

    function getHeightField() {
      return getFieldByKey("Height") || getFieldByKey("High") || getFieldByKey("Hight");
    }

    function selectedRaceSizeText() {
      const selectedSize = selectedRaceChoiceText("Size");
      if (selectedSize) return selectedSize;

      const race = selectedRaceDetail();
      const sizes = Array.isArray(race?.size) ? race.size.map(raceSizeLabel).filter(Boolean) : [];
      if (sizes.length === 1) return sizes[0];

      const description = selectedOptionDescription("race", getSelectedRaceName()) || selectedRaceDescription();
      const match = String(description || "").match(/\bYour size is (Tiny|Small|Medium|Large|Huge|Gargantuan)\b/i)
        || String(description || "").match(/\bSize:\s*(Tiny|Small|Medium|Large|Huge|Gargantuan)\b/i);
      return match ? raceSizeLabel(match[1]) : "";
    }

    function updateHeightFromRaceSize() {
      const field = getHeightField();
      if (!field) return;

      const size = selectedRaceSizeText();
      const previous = sheetMeta.generatedHeightFromRaceSize || "";
      const current = field.value.trim();
      if (!size) {
        if (current === previous) field.value = "";
        sheetMeta.generatedHeightFromRaceSize = "";
        return;
      }

      if (!current || current === previous) {
        field.value = size;
        sheetMeta.generatedHeightFromRaceSize = size;
      }
    }

    function updateProficiencyBonus() {
      const level = getFieldByKey("CharacterLevel")?.value || "";
      const bonus = proficiencyBonusForLevel(level);
      setFieldValue("ProfBonus", level ? formatModifier(bonus) : "");
    }

    function updatePassiveWisdomPerception() {
      const perception = Number.parseInt(fieldValue("Perception"), 10);
      if (!Number.isFinite(perception)) {
        setFieldValue("Passive", "");
        return;
      }
      setFieldValue("Passive", String(10 + perception));
    }

    function syncSpellcastingClassFromClassLevel() {
      const className = getFieldValueByNormalizedKey("classlevel");
      const detail = classDetailByName(className);
      const classItem = detail?.classItem || null;
      const hasSpellcasting = Boolean(
        classItem?.spellcastingAbility
        || classItem?.casterProgression
        || classItem?.cantripProgression?.length
        || classItem?.preparedSpellsProgression?.length
      );
      setFieldValue("Spellcasting Class 2", hasSpellcasting ? className : "");
    }

    function updateSpellcastingFields({ syncClass = false } = {}) {
      if (syncClass) syncSpellcastingClassFromClassLevel();

      const className = normalizeName(getSelectedClassName());
      const ability = SPELLCASTING_ABILITY_BY_CLASS[className] || "";
      const abilityLabel = SPELLCASTING_ABILITY_LABELS[ability] || "";
      setFieldValue("SpellcastingAbility 2", abilityLabel);

      const level = getFieldByKey("CharacterLevel")?.value || "";
      const abilityModifierValue = ability ? abilityModifier(getFieldByKey(ability)?.value || "") : null;
      if (!level || abilityModifierValue == null) {
        setFieldValue("SpellSaveDC  2", "");
        setFieldValue("SpellAtkBonus 2", "");
        return;
      }

      const bonus = proficiencyBonusForLevel(level);
      setFieldValue("SpellSaveDC  2", String(8 + bonus + abilityModifierValue));
      setFieldValue("SpellAtkBonus 2", formatModifier(bonus + abilityModifierValue));
    }

    function hasActiveFeat(name) {
      const normalized = normalizeName(name);
      return activeFeatData().some((feat) => normalizeName(feat.name) === normalized);
    }

    function updateInitiative() {
      const field = getFieldByKey("Initiative");
      if (!field) return;
      const previous = sheetMeta.generatedInitiative || sheetMeta.generatedInitiativeFromFeats || "";
      const dex = abilityModifier(getFieldByKey("DEX")?.value || "");
      if (dex == null) {
        if (field.value === previous) field.value = "";
        field.title = field.dataset.key || "Initiative";
        sheetMeta.generatedInitiative = "";
        sheetMeta.generatedInitiativeFromFeats = "";
        return;
      }
      const bonus = hasActiveFeat("Alert") ? proficiencyBonus() : 0;
      const next = formatModifier(dex + bonus);
      if (!field.value.trim() || field.value === previous) {
        field.value = next;
        field.title = bonus
          ? `${field.dataset.key || "Initiative"}: DEX ${formatModifier(dex)}, Alert ${formatModifier(bonus)}`
          : `${field.dataset.key || "Initiative"}: DEX ${formatModifier(dex)}`;
        sheetMeta.generatedInitiative = next;
        sheetMeta.generatedInitiativeFromFeats = "";
      }
    }

    function calculateMaximumHitPointsBase() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const hitDieFaces = Number.parseInt(detail?.classItem?.hd?.faces, 10);
      const level = getCharacterLevel();
      const constitutionModifier = abilityModifier(getFieldByKey("CON")?.value || "") ?? 0;
      if (!Number.isFinite(hitDieFaces) || hitDieFaces <= 0 || !Number.isFinite(level) || level <= 0) return null;
      return Math.max(1, level * (hitDieFaces + constitutionModifier));
    }

    function legacyMaximumHitPointsBase() {
      const detail = classDetailByName(getMainClassName() || getSelectedClassName());
      const hitDieFaces = Number.parseInt(detail?.classItem?.hd?.faces, 10);
      const level = getCharacterLevel();
      if (!Number.isFinite(hitDieFaces) || hitDieFaces <= 0 || !Number.isFinite(level) || level <= 0) return null;
      return Math.max(1, level * hitDieFaces);
    }

    function updateHitPointMaximum() {
      const field = getFieldByKey("HPMax");
      if (!field) return;
      const generated = sheetMeta.generatedHitPointMaximum || {};
      const previousValue = String(generated.value || "");
      const base = calculateMaximumHitPointsBase();
      const legacyBase = legacyMaximumHitPointsBase();
      if (base == null) {
        if (field.value === previousValue) field.value = "";
        sheetMeta.generatedHitPointMaximum = {};
        sheetMeta.generatedHitPointMaximumFromFeats = {};
        return;
      }

      const toughBonus = hasActiveFeat("Tough") ? getCharacterLevel() * 2 : 0;
      const next = base + toughBonus;
      const currentValue = Number.parseInt(String(field.value || "").trim(), 10);
      const legacyValue = legacyBase == null ? null : legacyBase + toughBonus;
      const hasLegacyGeneratedValue = Number.isFinite(currentValue) && currentValue === legacyValue && currentValue !== next;
      if (!field.value.trim() || field.value === previousValue || field.dataset.generatedHitPointMaximum === "true" || hasLegacyGeneratedValue) {
        field.value = String(next);
        field.dataset.generatedHitPointMaximum = "true";
      }
      field.title = `${field.dataset.key || "HPMax"}: ${getMainClassName() || getSelectedClassName()} d${classDetailByName(getMainClassName() || getSelectedClassName())?.classItem?.hd?.faces || "?"} max x nivel ${getCharacterLevel()}, CON ${formatModifier(abilityModifier(getFieldByKey("CON")?.value || "") ?? 0)}${toughBonus ? `, Tough ${formatModifier(toughBonus)}` : ""}`;
      sheetMeta.generatedHitPointMaximum = { base, bonus: toughBonus, value: String(next) };
      sheetMeta.generatedHitPointMaximumFromFeats = toughBonus ? { base, bonus: toughBonus, value: String(next) } : {};
    }

    function updateHitPointMaximumFromFeats() {
      updateHitPointMaximum();
    }

    function updateDerivedStats() {
      ensureCurrencyDefaults();
      applySelectedBackgroundChoices();
      applySelectedClassEquipment();
      applyRaceAbilityAdjustments();
      updateClassSkillProficiencies();
      updateBackgroundSkillProficiencies();
      updateRaceSkillProficiencies();
      updateFeatSkillProficiencies();
      updateSavingThrowProficiencies();
      updateProficiencyBonus();
      Object.entries(DERIVED_STAT_FIELDS).forEach(([ability, config]) => {
        const abilityField = getFieldByKey(ability);
        const modifier = abilityModifier(abilityField?.value || "");
        const formatted = formatModifier(modifier);
        setFieldValue(config.modifier, formatted);
        config.saves.forEach((target) => {
          const value = modifier == null ? null : derivedFieldValue(modifier, target.proficiency, false);
          setFieldValue(target.field, formatModifier(value));
        });
        config.skills.forEach((target) => {
          const value = modifier == null ? null : derivedFieldValue(modifier, target.proficiency, true, target.field);
          setFieldValue(target.field, formatModifier(value));
        });
      });
      updateInitiative();
      updateHitPointMaximumFromFeats();
      updatePassiveWisdomPerception();
      updateSpellcastingFields();
      updateArmorClass();
      updateSpeed();
      updateHeightFromRaceSize();
      updateOtherProficienciesAndLanguages();
      updateBackgroundFeatTraits();
      syncAutoCantrips();
      pruneInvalidSpellSourceSelections();
      pruneDuplicateSpellSelections();
      pruneOverLimitSpellSelections();
      updateEquipmentPanel();
      updatePreparedSpellsPanel();
    }

    function updateSpellSlots() {
      syncSpellSlotFields();
    }

    function handleDerivedStatInput(event) {
      const key = event.target?.dataset?.key?.trim();
      if (!key) return;
      const upperKey = key.toUpperCase();
      const isAbility = Boolean(DERIVED_STAT_FIELDS[upperKey]);
      const isProficiencyCheckbox = Object.values(DERIVED_STAT_FIELDS)
        .flatMap((config) => [...config.saves, ...config.skills])
        .some((target) => target.proficiency.toLowerCase() === key.toLowerCase());
      const isLevel = key.toLowerCase() === "characterlevel";
      const normalizedKey = key.toLowerCase();
      const affectsArmorClass = ["classlevel", "race"].includes(normalizedKey) || normalizedKey.includes("equipment");
      const affectsSpeed = normalizedKey === "race";
      const affectsOtherProficiencies = ["classlevel", "background", "race"].includes(normalizedKey);
      if (!isAbility && !isProficiencyCheckbox && !isLevel && !affectsArmorClass && !affectsSpeed && !affectsOtherProficiencies) return;
      if (isAbility) captureManualRaceAbilityEdit(event.target, upperKey);
      updateDerivedStats();
    }

    let saveTimer;
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveData().catch(console.error), 220);
    }

    async function renderPage(pdf, pageNumber) {
      const page = await pdf.getPage(pageNumber);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = BASE_WIDTH / baseViewport.width;
      const viewport = page.getViewport({ scale });

      const pageNode = document.createElement("section");
      pageNode.className = "sheet-page";
      pageNode.style.aspectRatio = `${viewport.width} / ${viewport.height}`;

      const canvas = document.createElement("canvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      pageNode.appendChild(canvas);

      const layer = document.createElement("form");
      layer.className = "field-layer";
      layer.autocomplete = "off";
      pageNode.appendChild(layer);
      app.appendChild(pageNode);

      await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;

      const annotations = await page.getAnnotations({ intent: "display" });
      annotations.forEach((annotation, index) => {
        const field = makeField(annotation, pageNumber, index, viewport);
        if (field) layer.appendChild(field);
      });
      createEquipmentPanel(layer);
      if (pageNumber === 1) createAddEquipmentButton(layer, viewport);
      if (pageNumber === 1) layer.appendChild(makeSyntheticLevelField(viewport));
      if (pageNumber === 1) createPreparedSpellsPanel(layer, viewport);
      if (pageNumber === 1) createRollHotspots(layer, viewport);
      if (pageNumber === 3) linkPreparedSpellFields(layer);
    }

    async function init() {
      await loadPdfJs();
      const [raceOptions, raceDetailData, backgroundOptions, backgroundDetailData, classOptions, classDetailData, spellOptions, featData, optionalFeatureData, itemData, languageData] = await Promise.all([
        loadRaceOptions(),
        loadRaceDetails(),
        loadBackgroundOptions(),
        loadBackgroundDetails(),
        loadClassOptions(),
        loadClassDetails(),
        loadSpellOptions(),
        loadFeatOptions(),
        loadOptionalFeatureOptions(),
        loadItemOptions(),
        loadLanguageOptions()
      ]);
      raceDetails = dedupeModernByName(Array.isArray(raceDetailData?.race) ? raceDetailData.race : [], (race) => race?.name || "", (race) => race?.source || "");
      backgroundDetails = dedupeModernByName(Array.isArray(backgroundDetailData?.background) ? backgroundDetailData.background : [], (background) => background?.name || "", (background) => background?.source || "");
      fieldOptions = new Map([
        ["race", raceOptions],
        ["background", backgroundOptions],
        ["class", classOptions],
        ["alignment", alignmentOptions()],
        ["level", levelOptions()]
      ]);
      spells = dedupeModernByName(spellOptions, (spell) => spell?.name || "", (spell) => spell?.source || "");
      classDetails = classDetailData;
      feats = dedupeModernByName(Array.isArray(featData?.feat) ? featData.feat : [], (feat) => feat?.name || "", (feat) => feat?.source || "");
      optionalFeatures = dedupeModernByName(Array.isArray(optionalFeatureData?.optionalfeature) ? optionalFeatureData.optionalfeature : [], (feature) => feature?.name || "", (feature) => feature?.source || "");
      items = dedupeModernByName([
        ...(Array.isArray(itemData?.baseItems?.baseitem) ? itemData.baseItems.baseitem : []),
        ...(Array.isArray(itemData?.items?.item) ? itemData.items.item : [])
      ], (item) => item?.name || "", (item) => item?.source || "");
      itemProperties = Array.isArray(itemData?.baseItems?.itemProperty) ? itemData.baseItems.itemProperty : [];
      itemTypes = Array.isArray(itemData?.baseItems?.itemType) ? itemData.baseItems.itemType : [];
      itemMasteries = Array.isArray(itemData?.baseItems?.itemMastery) ? itemData.baseItems.itemMastery : [];
      languages = Array.isArray(languageData?.language) ? languageData.language : [];

      const pdfBytes = await loadPdfBytes();
      const pdf = await pdfjsLib.getDocument({ data: pdfBytes, disableWorker: true }).promise;

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        await renderPage(pdf, pageNumber);
      }

      applyData(await loadData());
      syncAutoCantrips();
      pruneInvalidSpellSourceSelections();
      pruneDuplicateSpellSelections();
      pruneOverLimitSpellSelections();
      updateDerivedStats();
      updateSpellcastingFields({ syncClass: true });
      updateSpellSlots();
      updatePreparedSpellsPanel();
      renderAlertsPanel();
      clearFieldsButton?.addEventListener("click", () => {
        clearAllFields().catch(console.error);
      });
      longRestButton?.addEventListener("click", longRestSpellResources);
      characterReadyButton?.addEventListener("click", toggleCharacterReady);
      app.addEventListener("pointerdown", handleLockedSheetEvent, true);
      app.addEventListener("keydown", handleLockedSheetEvent, true);
      app.addEventListener("beforeinput", handleLockedSheetEvent, true);
      document.addEventListener("pointerdown", handleLockedAuxiliaryInput, true);
      document.addEventListener("keydown", handleLockedAuxiliaryInput, true);
      document.addEventListener("change", handleLockedAuxiliaryInput, true);
      app.addEventListener("input", handleDerivedStatInput);
      app.addEventListener("change", handleDerivedStatInput);
      app.addEventListener("change", handleWizardPreparedLimitChange);
      app.addEventListener("input", scheduleSave);
      app.addEventListener("change", scheduleSave);
      app.addEventListener("input", updatePreparedSpellsPanel);
      app.addEventListener("change", updatePreparedSpellsPanel);
      app.addEventListener("input", updateEquipmentPanel);
      app.addEventListener("change", updateEquipmentPanel);
      app.addEventListener("input", renderAlertsPanel);
      app.addEventListener("change", renderAlertsPanel);
      app.addEventListener("change", handleSpellAvailabilityChange);
      itemDrawerClose.addEventListener("click", closeItemDrawer);
      itemPickerClose?.addEventListener("click", closeItemPicker);
      itemPickerSearch?.addEventListener("input", renderItemPickerList);
      itemPickerFilters?.addEventListener("click", (event) => {
        const button = event.target.closest(".item-picker-filter");
        if (!button) return;
        activeItemFilter = button.dataset.filter || "all";
        selectedPickerItem = null;
        if (itemPickerAdd) itemPickerAdd.disabled = true;
        renderItemPickerList();
      });
      itemPickerQuantity?.addEventListener("input", () => {
        if (selectedPickerItem) showItemDrawer({ displayName: selectedPickerItem.name, quantity: pickerQuantity() }, selectedPickerItem);
      });
      itemPickerAdd?.addEventListener("click", addSelectedPickerItem);
      itemPickerBackdrop?.addEventListener("click", (event) => {
        if (event.target === itemPickerBackdrop) closeItemPicker();
      });
      document.addEventListener("pointerdown", (event) => {
        if (!activeSelectField) return;
        if (event.target === activeSelectField || optionMenu.contains(event.target)) return;
        closeOptionMenu();
      });
      window.addEventListener("resize", closeOptionMenu);
      window.addEventListener("scroll", (event) => {
        if (optionMenu.contains(event.target)) return;
        closeOptionMenu();
      }, true);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeOptionMenu();
          closeItemPicker();
          closeItemDrawer();
        }
      });
      loading.style.display = "none";
    }

    init().catch((error) => {
      console.error(error);
      loading.textContent = `No se pudo cargar el PDF: ${error?.message || error}`;
    });
  </script>
  <script>
    const RELEASE_REPO = "Kaelthorian/DnD-Plataform";
    const downloadReleaseText = document.getElementById("downloadReleaseText");
    const downloadReleaseButton = document.getElementById("downloadReleaseButton");

    function pickReleaseAsset(assets) {
      const preferredExtensions = [".exe", ".msi", ".zip", ".7z"];
      return preferredExtensions
        .map((extension) => assets.find((asset) => asset.name.toLowerCase().endsWith(extension)))
        .find(Boolean) || assets[0] || null;
    }

    async function loadDownloadRelease() {
      try {
        const response = await fetch(`https://api.github.com/repos/${RELEASE_REPO}/releases/latest`, {
          headers: { Accept: "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error(`GitHub respondio ${response.status}`);

        const release = await response.json();
        const asset = pickReleaseAsset(release.assets || []);
        downloadReleaseText.textContent = release.tag_name ? `Ultima version: ${release.tag_name}` : "Ultima version disponible";
        downloadReleaseButton.href = asset ? asset.browser_download_url : release.html_url;
        downloadReleaseButton.textContent = asset ? "Descargar" : "Ver release";
      } catch (error) {
        downloadReleaseText.textContent = "Ultima version";
        downloadReleaseButton.href = `https://github.com/${RELEASE_REPO}/releases/latest`;
        downloadReleaseButton.textContent = "Ver release";
      }
    }

    loadDownloadRelease();
  </script>
</body>
