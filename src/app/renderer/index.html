<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planilla DnD</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #d7d7d7;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .app {
      width: min(100vw - 24px, 1120px);
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .sheet-page {
      position: relative;
      width: 100%;
      margin: 0 auto 18px;
      background: #fff;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .field-layer {
      position: absolute;
      inset: 0;
    }

    .field {
      position: absolute;
      border: 1px solid transparent;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.02);
      color: #111;
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: clamp(8px, 1.08vw, 13px);
      line-height: 1.15;
      outline: none;
      padding: 1px 3px;
      resize: none;
    }

    .field:hover,
    .field:focus {
      border-color: rgba(0, 0, 0, 0.55);
      background: rgba(255, 255, 255, 0.68);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6);
    }

    .field.textarea {
      padding: 4px 5px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .field.proficiencies-box {
      background: rgba(255, 255, 255, 0.86);
      border-color: rgba(0, 0, 0, 0.16);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: clamp(7px, 0.95vw, 11px);
      line-height: 1.35;
      padding: 5px 6px;
    }

    .field.select {
      caret-color: transparent;
      cursor: pointer;
      padding-right: 14px;
    }

    .field.number {
      text-align: center;
      padding-left: 1px;
      padding-right: 1px;
    }

    .field.equipment-storage {
      opacity: 0;
      pointer-events: none;
    }

    .equipment-panel {
      position: absolute;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid transparent;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.04);
      color: #111;
      font: 10px/1.2 "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .equipment-header,
    .equipment-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 36px 50px 18px;
      gap: 3px;
      align-items: center;
    }

    .equipment-header {
      padding: 2px 3px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.24);
      background: rgba(255, 255, 255, 0.78);
      color: #333;
      font-size: 8px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .equipment-list {
      overflow-y: auto;
      overscroll-behavior: contain;
      background: rgba(255, 255, 255, 0.34);
    }

    .equipment-row {
      min-height: 20px;
      padding: 2px 3px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.12);
    }

    .equipment-qty,
    .equipment-value {
      white-space: nowrap;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .equipment-name {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #111;
      font: inherit;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .equipment-name:hover,
    .equipment-name:focus {
      text-decoration: underline;
      outline: none;
    }

    .equipment-equip {
      min-height: 16px;
      padding: 1px 3px;
      border: 1px solid rgba(0, 0, 0, 0.34);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.82);
      color: #111;
      font: 9px/1 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .equipment-remove {
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(0, 0, 0, 0.34);
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.82);
      color: #111;
      font: 700 10px/1 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .equipment-remove:hover,
    .equipment-remove:focus {
      background: #8b1e24;
      color: #fff;
      outline: none;
    }

    .equipment-equip.equipped {
      background: #111;
      color: #fff;
    }

    .equipment-equip:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .equipment-empty {
      padding: 6px;
      color: #555;
      font-size: 10px;
    }

    .add-equipment-button {
      position: absolute;
      z-index: 8;
      display: grid;
      place-items: center;
      border: 1px solid rgba(0, 0, 0, 0.42);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      font: 700 14px/1 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .add-equipment-button:hover,
    .add-equipment-button:focus {
      background: #111;
      color: #fff;
      outline: none;
    }

    .item-picker-backdrop {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.34);
    }

    .item-picker-backdrop.visible {
      display: flex;
    }

    .item-picker {
      width: min(560px, calc(100vw - 36px));
      height: min(640px, calc(100vh - 36px));
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: 14px;
      border: 1px solid rgba(0, 0, 0, 0.36);
      border-radius: 6px;
      background: #fff;
      color: #111;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      font: 13px/1.35 "Segoe UI", Arial, sans-serif;
    }

    .item-picker-header,
    .item-picker-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .item-picker-title {
      font-weight: 700;
    }

    .item-picker-close,
    .item-picker-add {
      min-height: 28px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .item-picker-add {
      padding: 0 12px;
      background: #111;
      color: #fff;
    }

    .item-picker-add:disabled {
      opacity: 0.42;
      cursor: default;
    }

    .item-picker-search {
      min-height: 30px;
      width: 100%;
      padding: 5px 8px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      font: inherit;
    }

    .item-picker-filters {
      display: flex;
      min-width: 0;
      overflow-x: auto;
      border-bottom: 1px solid #d0d0d0;
    }

    .item-picker-filter {
      flex: 0 0 auto;
      min-height: 30px;
      padding: 0 10px;
      border: 0;
      border-bottom: 3px solid transparent;
      border-radius: 0;
      background: #fff;
      color: #111;
      font: 700 11px/1 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .item-picker-filter.active {
      border-bottom-color: #111;
      background: #f0f0f0;
      color: #111;
    }

    .item-picker-list {
      overflow-y: auto;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fafafa;
    }

    .item-picker-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 7px 8px;
      border: 0;
      border-bottom: 1px solid #e0e0e0;
      background: transparent;
      color: #111;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .item-picker-row:hover,
    .item-picker-row:focus,
    .item-picker-row.selected {
      background: #ececec;
      outline: none;
    }

    .item-picker-row-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .item-picker-row-meta {
      color: #555;
      font-size: 11px;
      white-space: nowrap;
    }

    .item-picker-quantity {
      width: 82px;
      min-height: 28px;
      padding: 4px 6px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      font: inherit;
    }

    .item-drawer {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 40;
      width: min(390px, calc(100vw - 28px));
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: #fff;
      color: #111;
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.28);
      transform: translateX(-105%);
      transition: transform 180ms ease;
    }

    .item-drawer.spell-picker-drawer {
      width: min(920px, calc(100vw - 28px));
    }

    .item-drawer.feat-readable-drawer {
      width: min(760px, calc(100vw - 28px));
    }

    .item-drawer.visible {
      transform: translateX(0);
    }

    .item-drawer-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid #d0d0d0;
      background: #f7f7f7;
    }

    .item-drawer-title {
      font-weight: 700;
    }

    .item-drawer-meta {
      margin-top: 3px;
      color: #555;
      font-size: 12px;
    }

    .item-drawer-close {
      width: 28px;
      height: 28px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .item-drawer-body {
      padding: 14px;
      overflow-y: auto;
      font: 13px/1.45 "Segoe UI", Arial, sans-serif;
    }

    .item-drawer.feat-readable-drawer .item-drawer-body {
      padding: 18px 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    .item-sheet {
      display: grid;
      gap: 12px;
    }

    .item-sheet-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.1;
    }

    .item-sheet-subtitle {
      color: #555;
      font-size: 12px;
    }

    .item-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .item-stat {
      padding: 7px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #f8f8f8;
    }

    .item-stat-label {
      color: #555;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .item-stat-value {
      margin-top: 2px;
      font-weight: 700;
    }

    .item-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .item-chip {
      padding: 3px 6px;
      border: 1px solid #c9c9c9;
      border-radius: 999px;
      background: #fff;
      font-size: 11px;
    }

    .item-section {
      display: grid;
      gap: 5px;
    }

    .item-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .item-section-body {
      margin: 0;
      color: #222;
    }

    .item-drawer.feat-readable-drawer .item-section-body {
      white-space: pre-line;
    }

    .item-section-list {
      margin: 0;
      padding-left: 18px;
      color: #222;
    }

    .spell-picker {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(280px, 0.95fr);
      gap: 10px;
      align-items: start;
    }

    .spell-picker-main {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .spell-picker-list {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .list-search {
      width: 100%;
      min-height: 30px;
      padding: 5px 8px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      background: #fff;
      color: #111;
      font: 12px/1.25 "Segoe UI", Arial, sans-serif;
    }

    .list-search-empty {
      padding: 7px 8px;
      color: #555;
      font: 12px/1.3 "Segoe UI", Arial, sans-serif;
    }

    .collapsible-section {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .collapsible-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #f8f8f8;
      color: #111;
      font: 700 12px/1.2 "Segoe UI", Arial, sans-serif;
      text-align: left;
      cursor: pointer;
    }

    .collapsible-trigger:hover,
    .collapsible-trigger:focus {
      background: #ececec;
      outline: none;
    }

    .collapsible-icon {
      flex: 0 0 auto;
      font-size: 12px;
    }

    .collapsible-body {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .collapsible-section.collapsed .collapsible-body {
      display: none;
    }

    .spell-picker-current,
    .spell-picker-row {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #fff;
    }

    .spell-picker-row.active {
      border-color: #5c3a21;
      background: #f7f0e8;
    }

    .spell-picker-name {
      border: 0;
      padding: 0;
      background: transparent;
      color: #1f1f1f;
      font: 700 13px/1.25 "Segoe UI", Arial, sans-serif;
      text-align: left;
      cursor: pointer;
    }

    .spell-picker-meta {
      color: #666;
      font-size: 11px;
    }

    .spell-picker-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .spell-translation-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #f8f8f8;
    }

    .spell-picker-button {
      border: 1px solid #5c3a21;
      border-radius: 4px;
      background: #5c3a21;
      color: #fff;
      padding: 4px 8px;
      font: 700 11px/1 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    .spell-picker-button.secondary {
      background: #fff;
      color: #5c3a21;
    }

    .spell-translation-status {
      color: #555;
      font-size: 11px;
    }

    .spell-picker-detail {
      position: sticky;
      top: 0;
      max-height: calc(100vh - 118px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #fff;
      overflow: hidden;
    }

    .spell-picker-detail.hidden {
      display: none;
    }

    .spell-picker-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid #d0d0d0;
      background: #f7f7f7;
      font-weight: 700;
    }

    .spell-picker-detail-close {
      width: 26px;
      height: 26px;
      border: 1px solid #b8b8b8;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .spell-picker-detail-body {
      min-height: 0;
      padding: 10px;
      overflow-y: auto;
    }

    @media (max-width: 760px) {
      .spell-picker {
        grid-template-columns: 1fr;
      }

      .spell-picker-detail {
        position: static;
        max-height: none;
      }
    }

    .item-section-list li + li {
      margin-top: 5px;
    }

    .feature-list-button {
      width: 100%;
      display: block;
      padding: 8px 9px;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      background: #fff;
      color: #111;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .feature-list-button:hover,
    .feature-list-button:focus {
      background: #f0f0f0;
      outline: none;
    }

    .feature-list-button.choice-complete {
      border-color: #237a3b;
      background: #edf8ef;
      color: #0f3d20;
    }

    .feature-list-button.choice-complete:hover,
    .feature-list-button.choice-complete:focus {
      background: #dff2e3;
    }

    .feature-list-button.choice-pending {
      border-color: #b42318;
      background: #fff1f0;
      color: #5f1611;
    }

    .feature-list-button.choice-pending:hover,
    .feature-list-button.choice-pending:focus {
      background: #ffe1df;
    }

    .item-source {
      padding-top: 8px;
      border-top: 1px solid #d0d0d0;
      color: #555;
      font-size: 11px;
    }

    .option-menu {
      position: fixed;
      z-index: 20;
      display: flex;
      width: min(720px, calc(100vw - 24px));
      height: min(380px, calc(100vh - 24px));
      max-height: min(380px, calc(100vh - 24px));
      border: 1px solid rgba(0, 0, 0, 0.38);
      border-radius: 4px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.26);
      overflow: hidden;
    }

    .option-menu.spell-option-menu {
      height: min(560px, calc(100vh - 24px));
      max-height: min(560px, calc(100vh - 24px));
    }

    .option-menu.spell-option-menu .option-list {
      width: 50%;
    }

    .option-menu[hidden] {
      display: none;
    }

    .option-list {
      width: 42%;
      min-width: 190px;
      height: 100%;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border-right: 1px solid #d0d0d0;
    }

    .option-list .list-search {
      position: sticky;
      top: 0;
      z-index: 1;
      border-width: 0 0 1px;
      border-radius: 0;
    }

    .option-item {
      display: block;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      background: transparent;
      color: #111;
      font: 12px/1.2 "Segoe UI", Arial, sans-serif;
      text-align: left;
      cursor: pointer;
    }

    .option-empty {
      padding: 9px;
      color: #555;
      font: 12px/1.3 "Segoe UI", Arial, sans-serif;
    }

    .option-item:hover,
    .option-item.active,
    .option-item:focus {
      background: #1f5eff;
      color: #fff;
      outline: none;
    }

    .option-description {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      overflow-y: auto;
      overscroll-behavior: contain;
      color: #111;
      font: 12px/1.35 "Segoe UI", Arial, sans-serif;
    }

    .option-description-title {
      margin-bottom: 6px;
      font-weight: 700;
    }

    .option-description-line {
      margin: 0 0 7px;
    }

    .option-choice-group {
      display: grid;
      gap: 7px;
      margin: 10px 0 12px;
      padding: 9px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      background: #f7f7f7;
    }

    .option-choice-title {
      font-weight: 700;
    }

    .option-choice {
      display: grid;
      grid-template-columns: 16px minmax(0, 1fr);
      gap: 6px;
      align-items: start;
      cursor: pointer;
    }

    .option-choice.disabled,
    .alert-choice.disabled {
      color: #777;
      cursor: not-allowed;
      opacity: 0.72;
    }

    .option-choice input {
      margin: 2px 0 0;
    }

    .option-choice-text {
      overflow-wrap: anywhere;
    }

    @media (max-width: 720px) {
      .item-drawer,
      .item-drawer.feat-readable-drawer,
      .item-drawer.spell-picker-drawer {
        width: 100vw;
      }

      .option-menu {
        flex-direction: column;
      }

      .option-list {
        width: 100%;
        max-height: 210px;
        border-right: 0;
        border-bottom: 1px solid #d0d0d0;
      }

      .option-menu.spell-option-menu .option-list {
        max-height: min(360px, 58vh);
      }

      .option-description {
        max-height: 140px;
      }

      .option-menu.spell-option-menu .option-description {
        max-height: min(180px, 32vh);
      }
    }

    .field.checkbox {
      appearance: none;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
    }

    .field.checkbox:hover,
    .field.checkbox:focus {
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .field.checkbox:checked {
      background: radial-gradient(circle at 45% 30%, #111 0 32%, transparent 35%);
      border: 0;
      box-shadow: none;
    }

    .loading {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      background: #d7d7d7;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .status {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 6;
      padding: 5px 8px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    async function loadPdfJs() {
      try {
        if (!Promise.try) {
          Promise.try = (callback, ...args) => new Promise((resolve) => resolve(callback(...args)));
        }
        pdfjsLib = await import("./node_modules/pdfjs-dist/legacy/build/pdf.mjs");
        pdfjsLib.GlobalWorkerOptions.workerSrc = "./node_modules/pdfjs-dist/legacy/build/pdf.worker.mjs";
      } catch (error) {
        throw new Error("No se encontro PDF.js. Ejecuta `npm install` en la carpeta del proyecto antes de abrir la app.");
      }
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function loadPdfBytes() {
      if (desktopStore?.loadPdf) return base64ToBytes(await desktopStore.loadPdf());
      const response = await fetch("./DnD_5E_CharacterSheet_FormFillable.pdf");
      if (!response.ok) {
        throw new Error(`No se encontro DnD_5E_CharacterSheet_FormFillable.pdf (${response.status})`);
      }
      return new Uint8Array(await response.arrayBuffer());
    }

    async function loadRaceOptions() {
      if (desktopStore?.loadRaces) return dedupeModernByName(await desktopStore.loadRaces(), optionName, optionSource);
      const response = await fetch("./races.json");
      return dedupeModernByName(await response.json(), optionName, optionSource);
    }

    async function loadRaceDetails() {
      const response = await fetch("./5etools-src-main/data/races.json");
      if (!response.ok) return {};
      return response.json();
    }

    async function loadBackgroundOptions() {
      if (desktopStore?.loadBackgrounds) return dedupeModernByName(await desktopStore.loadBackgrounds(), optionName, optionSource);
      const response = await fetch("./backgrounds.json");
      return dedupeModernByName(await response.json(), optionName, optionSource);
    }

    async function loadBackgroundDetails() {
      const response = await fetch("./5etools-src-main/data/backgrounds.json");
      if (!response.ok) return {};
      return response.json();
    }

    async function loadClassOptions() {
      const withoutSidekicks = (options) => (options || []).filter((option) => !/sidekick/i.test(optionName(option)));
      if (desktopStore?.loadClasses) return dedupeModernByName(withoutSidekicks(await desktopStore.loadClasses()), optionName, optionSource);
      const response = await fetch("./classes.json");
      return dedupeModernByName(withoutSidekicks(await response.json()), optionName, optionSource);
    }

    async function loadClassDetails() {
      const indexResponse = await fetch("./5etools-src-main/data/class/index.json");
      if (!indexResponse.ok) return [];
      const classIndex = await indexResponse.json();
      const files = Object.values(classIndex).filter((file) => /^class-.*\.json$/i.test(file));
      const responses = await Promise.all(files.map((file) => fetch(`./5etools-src-main/data/class/${file}`).catch(() => null)));
      const loaded = await Promise.all(responses.map(async (response) => response?.ok ? response.json() : null));
      return loaded.filter(Boolean);
    }

    async function loadSpellOptions() {
      if (desktopStore?.loadSpells) return dedupeModernByName(await desktopStore.loadSpells(), (spell) => spell?.name || "", (spell) => spell?.source || "");
      const response = await fetch("./spells.json");
      return dedupeModernByName(await response.json(), (spell) => spell?.name || "", (spell) => spell?.source || "");
    }

    async function loadFeatOptions() {
      if (desktopStore?.loadFeats) return desktopStore.loadFeats();
      const response = await fetch("./5etools-src-main/data/feats.json");
      return response.json();

    async function loadOptionalFeatureOptions() {

    const MODERN_SOURCE_REPLACEMENTS = {
      phb: "xphb",
      dmg: "xdmg",
      mm: "xmm"
    };

    function sourceKey(source) {
      return normalizeName(source);
    }

    function optionSource(option) {
      const explicit = sourceKey(option?.source || "");
      if (explicit) return explicit;
      const match = String(rawOptionDescriptionText(option) || "").match(/\bSource:\s*([A-Za-z0-9]+)/i);
      return sourceKey(match?.[1] || "");
    }

    function isLegacySource(source) {
      return Boolean(MODERN_SOURCE_REPLACEMENTS[sourceKey(source)]);
    }

    function modernReplacementSource(source) {
      return MODERN_SOURCE_REPLACEMENTS[sourceKey(source)] || "";
    }

    function isModernSource(source) {
      const normalized = sourceKey(source);
      return normalized === "xphb" || normalized === "xdmg" || normalized === "xmm";
    }

    function sourcePreferenceRank(source) {
      const normalized = sourceKey(source);
      if (isModernSource(normalized)) return 0;
      if (isLegacySource(normalized)) return 3;
      return 1;
    }

    function preferModernEntry(previous, next, sourceGetter = (item) => item?.source || "") {
      if (!previous) return next;
      const previousRank = sourcePreferenceRank(sourceGetter(previous));
      const nextRank = sourcePreferenceRank(sourceGetter(next));
      if (nextRank !== previousRank) return nextRank < previousRank ? next : previous;
      return previous;
    }

    function dedupeModernByName(itemsList = [], nameGetter = optionName, sourceGetter = (item) => item?.source || "") {
      const byName = new Map();
      itemsList.forEach((item) => {
        const key = normalizeName(nameGetter(item));
        if (!key) return;
        byName.set(key, preferModernEntry(byName.get(key), item, sourceGetter));
      });
      return [...byName.values()];
    }

      if (pageNumber !== 3) return null;
      const x = rect[0];
      const y = rect[1];
      if (x < 210) {

        if (y >= 228) return 1;
        return 2;
      }
      if (x < 400) {
        if (y >= 399) return 3;
        if (y >= 173) return 4;
        return 5;

      if (y >= 455) return 6;
      if (y >= 285) return 7;
      if (y >= 144) return 8;
      return 9;

    function spellSlotsForCharacter() {
      const level = Math.min(20, Math.max(1, getCharacterLevel()));
      const className = normalizeName(getSelectedClassName());
      const progression = normalizeName(classDetailByName(getSelectedClassName())?.classItem?.casterProgression || "");
      if (progression === "full" || ["bard", "cleric", "druid", "sorcerer", "wizard"].includes(className)) {
        return FULL_CASTER_SLOTS[level] || [];
      }
      if (progression === "artificer" || className === "artificer") {
        return ARTIFICER_SLOTS[level - 1] || [];
      }
      if (progression === "1/2" || className === "paladin" || className === "ranger") {
        return HALF_CASTER_SLOTS[level - 1] || [];
      }
      if (className === "spellcaster sidekick") {
        return ARTIFICER_SLOTS[level - 1] || [];
      }
      if (className === "warlock") {
        const slotLevel = level < 3 ? 1 : level < 5 ? 2 : level < 7 ? 3 : level < 9 ? 4 : 5;
        const count = level === 1 ? 1 : level < 11 ? 2 : level < 17 ? 3 : 4;
        const slots = [];
        slots[slotLevel - 1] = count;
        return slots;
      }
      return [];
    }

    function cantripsKnownForCharacter() {
      const level = Math.min(20, Math.max(1, getCharacterLevel()));
      const className = normalizeName(getSelectedClassName());
      const progression = CANTRIPS_KNOWN_BY_CLASS[className];
      return progression ? progression[level - 1] || 0 : 0;
    }

    function maxSpellLevelForCharacter() {
      const slots = spellSlotsForCharacter();
      for (let level = 9; level >= 1; level -= 1) {
        if ((slots[level - 1] || 0) > 0) return level;
      }
      return 0;
    }

    function canUseSpellLevel(level) {
      if (level === 0) return true;
      return level <= maxSpellLevelForCharacter() || featGrantedSpellChoiceLimit(level) > 0;
    }

    function spellChooseMeta(value) {
      const text = String(value || "");
      const levelMatch = text.match(/\blevel=(\d+)/i);
      const classMatch = text.match(/\bclass=([^|;]+)/i);
      return {
        level: levelMatch ? Number.parseInt(levelMatch[1], 10) : null,
        className: classMatch?.[1] ? titleCaseWords([classMatch[1]])[0] : ""
      };
    }

    function additionalSpellGroupMeta(group) {
      const grants = [];
      collectAdditionalSpellItems(group?.known?._, false).forEach((grant) => grants.push(grant));
      collectAdditionalSpellItems(group?.prepared?._, true).forEach((grant) => grants.push(grant));
      collectAdditionalSpellItems(group?.innate?._, true).forEach((grant) => grants.push(grant));
      return grants;
    }

    function spellNameFromAdditionalSpellRef(value) {
      return strip5eTags(String(value || ""))
        .replace(/#c\b/i, "")
        .split("|")[0]
        .trim();
    }

    function additionalSpellGrantFromItem(item, prepared) {
      if (!item) return null;
      if (typeof item === "string") {
        const spellName = spellNameFromAdditionalSpellRef(item);
        const spell = findSpellByName(spellName);
        const forcedCantrip = /#c\b/i.test(item);
        return {
          spellName: spell?.name || titleCaseWords([spellName])[0],
          level: forcedCantrip ? 0 : spell?.level,
          className: "",
          count: 1,
          prepared
        };
      }
      const meta = spellChooseMeta(item.choose || item);
      if (meta.level == null) return null;
      return {
        level: meta.level,
        className: meta.className,
        count: item.count || 1,
        prepared
      };
    }

    function collectAdditionalSpellItems(value, prepared) {
      if (!value) return [];
      if (Array.isArray(value)) return value.map((item) => additionalSpellGrantFromItem(item, prepared)).filter(Boolean);
      if (typeof value === "string") return [additionalSpellGrantFromItem(value, prepared)].filter(Boolean);
      if (typeof value !== "object") return [];

      const grants = [];
      ["will", "daily", "rest"].forEach((key) => {
        const bucket = value[key];
        if (!bucket) return;
        if (Array.isArray(bucket)) bucket.forEach((item) => grants.push(additionalSpellGrantFromItem(item, prepared)));
        else if (typeof bucket === "object") Object.values(bucket).flat().forEach((item) => grants.push(additionalSpellGrantFromItem(item, prepared)));
      });
      return grants.filter(Boolean);
    }

    function featSpellListChoiceValue(group) {
      return `feat-spell-list:${group?.name || ""}`;
    }

    function featVariantFromName(value) {
      const match = String(value || "").match(/\(([^)]+)\)\s*$/);
      if (match?.[1]) return match[1];
      const magicInitiateMatch = String(value || "").match(/\bMagic Initiate\s*[:;]\s*([A-Za-z' -]+)\s*$/i);
      return magicInitiateMatch?.[1] || "";
    }

    function isMagicInitiateFeat(featOrFeature) {
      return normalizeName(featOrFeature?.name || "") === "magic initiate";

      return String(group?.name || "").replace(/\s+spells?$/i, "").trim();
    }

    function magicInitiateAbilityForClass(className) {
      const normalized = normalizeName(className);
      if (normalized === "wizard") return "INT";
      if (normalized === "cleric" || normalized === "druid") return "WIS";
      return "";

    function magicInitiateAbilityLabel(className) {
      const key = magicInitiateAbilityForClass(className);
      return { INT: "Intelligence", WIS: "Wisdom", CHA: "Charisma" }[key] || "";

    function magicInitiateSpellValue(spell) {

    }

    function magicInitiateSpellListOptions(feature, groups) {
      const key = featureChoiceKey(feature);
      const selected = selectedFeatureChoices(key);
      const currentValue = selected.find((value) => String(value).startsWith("feat-spell-list:")) || "";
      const usedByOtherMagicInitiates = new Set(Object.entries(sheetMeta.featureChoices || {})
        .filter(([choiceKey]) => choiceKey !== key && normalizeName(choiceKey).includes("magic initiate"))
        .flatMap(([, values]) => Array.isArray(values) ? values : values ? [values] : [])
        .filter((value) => String(value).startsWith("feat-spell-list:")));
      return groups.map((group) => {
        const value = featSpellListChoiceValue(group);
        const className = magicInitiateClassNameFromGroup(group);
        const disabled = usedByOtherMagicInitiates.has(value) && value !== currentValue;
        return {
          value,
          label: className || group.name || "Spell list",
          type: "spellList",
          disabled,
          description: disabled
            ? "Ya elegiste esta lista en otro Magic Initiate."
            : `Usa la lista ${className}; habilidad: ${magicInitiateAbilityLabel(className) || "segun la lista"}.`
        };
      });
    }

    function selectedMagicInitiateGroup(feature, groups) {
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      const selectedList = selected.find((value) => String(value).startsWith("feat-spell-list:"));
      if (selectedList) return groups.find((group) => featSpellListChoiceValue(group) === selectedList) || null;
      return groups.length === 1 ? groups[0] : null;
    }

    function magicInitiateSpellOptions(className, level) {
      const classKey = normalizeName(className);
      return spells
        .filter((spell) => spell.level === level)
        .filter((spell) => spell.classes?.some((name) => normalizeName(name) === classKey))
        .sort((a, b) => a.name.localeCompare(b.name))
        .map((spell) => ({
          value: magicInitiateSpellValue(spell),
          label: spell.name,
          type: "spell",
          description: cleanSpellDescription(spell)
        }));
    }

    function magicInitiateChoiceSpecs(feature, feat, groups) {
      const specs = [];
      if (groups.length > 1) {
        specs.push({ label: "Spell List", count: 1, options: magicInitiateSpellListOptions(feature, groups) });
      }

      const group = selectedMagicInitiateGroup(feature, groups);
      const className = magicInitiateClassNameFromGroup(group);
      if (!className) return specs;

      const cantripOptions = magicInitiateSpellOptions(className, 0);
      if (cantripOptions.length) specs.push({ label: `${className} Cantrips`, count: 2, options: cantripOptions });

      const firstLevelOptions = magicInitiateSpellOptions(className, 1);
      if (firstLevelOptions.length) specs.push({ label: `${className} Level 1 Spell`, count: 1, options: firstLevelOptions });

      return specs;
    }

    function featChoiceContextFromEntry(entry) {
      if (entry?.feature?.choiceContext) return entry.feature.choiceContext;
      if (entry?.parentFeature) return featureChoiceKey(entry.parentFeature);
      return [entry?.meta || "", entry?.title || ""].filter(Boolean).join(":");
    }

    function featFeatureFromEntry(entry) {
      const feat = entry?.feat || findFeatData(entry?.featName || entry?.title);
      if (entry?.feature) return entry.feature;
      return {
        name: feat?.name || entry?.featName || entry?.title || "Feat",
        source: feat?.source || "",
        page: feat?.page,
        level: 1,
        isFeatFeature: true,
        choiceContext: featChoiceContextFromEntry(entry),
        feat,
        entries: feat?.entries || []
      };
    }

    function magicInitiateSpellGrantsForFeature(feature) {
      const feat = feature?.feat || findFeatData(feature?.name);
      const groups = Array.isArray(feat?.additionalSpells) ? feat.additionalSpells : [];
      const group = selectedMagicInitiateGroup(feature, groups);
      const className = magicInitiateClassNameFromGroup(group);
      if (!className) return [];

      const classKey = normalizeName(className);
      const ability = magicInitiateAbilityForClass(className);
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      const featureKey = featureChoiceKey(feature);
      return selected
        .filter((value) => String(value).startsWith("spell:"))
        .map((value) => String(value).replace(/^spell:/, ""))
        .map(findSpellByName)
        .filter(Boolean)
        .filter((spell) => spell.level === 0 || spell.level === 1)
        .filter((spell) => spell.classes?.some((name) => normalizeName(name) === classKey))
        .map((spell) => ({
          spellName: spell.name,
          level: spell.level,
          className,
          count: 1,
          prepared: spell.level === 1,
          fromMagicInitiate: true,
          ability,
          key: ["magic-initiate", featureKey, spell.name].map((item) => normalizeName(String(item))).join("|")
        }));
    }

    function selectedAdditionalSpellGroupsForFeat(entry) {
      const feat = entry.feat || findFeatData(entry.featName || entry.title);
      const groups = Array.isArray(feat?.additionalSpells) ? feat.additionalSpells : [];
      if (!groups.length) return [];
      if (groups.length === 1) return groups;

      const variant = normalizeName(entry.featVariant || entry.feature?.featVariant || featVariantFromName(entry.title || entry.feature?.name || ""));
      if (variant) {
        const matched = groups.filter((group) => normalizeName(group.name || "").includes(variant));
        if (matched.length) return matched;
      }

      const feature = entry.feature || {
        name: feat.name,
        source: feat.source,
        level: 1,
        isFeatFeature: true,
        feat,
        entries: feat.entries || []
      };
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      return groups.filter((group) => selected.includes(featSpellListChoiceValue(group)));
    }

    function activeFeatSpellGrants() {
      return activeFeatEntriesForEffects()
        .flatMap((entry) => {
          const feat = entry.feat || findFeatData(entry.featName || entry.title);
          if (isMagicInitiateFeat(feat)) return magicInitiateSpellGrantsForFeature(featFeatureFromEntry(entry));
          return selectedAdditionalSpellGroupsForFeat(entry)
            .flatMap((group) => additionalSpellGroupMeta(group));
        });
    }

    function featGrantedSpellChoiceLimit(level) {
      return activeFeatSpellGrants()
        .filter((grant) => grant.level === level && !grant.spellName && (level === 0 || grant.prepared))
        .reduce((total, grant) => total + (grant.count || 1), 0);
    }

    function featGrantsSpell(spell, level) {
      if (spell.level !== level) return false;
      return activeFeatSpellGrants().some((grant) => {
        if (grant.level !== level) return false;
        if (grant.spellName) return normalizeName(grant.spellName) === normalizeName(spell.name);
        if (!grant.className) return true;
        return spell.classes?.some((name) => normalizeName(name) === normalizeName(grant.className));
      });
    }

    function getSpellLevelLimit(level) {
      if (level === 0) return cantripsKnownForCharacter() + featGrantedSpellChoiceLimit(0);
      if (isWizardCharacter()) return Infinity;
      if (isBardCharacter()) return Infinity;
      const totalKey = SPELL_SLOT_TOTAL_KEYS.get(level);
      if (!totalKey) return Infinity;
      const value = getFieldValueByNormalizedKey(totalKey.toLowerCase());
      const parsed = Number.parseInt(value, 10);
      const slotLimit = Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
      const featLimit = featGrantedSpellChoiceLimit(level);
      return slotLimit || featLimit ? slotLimit + featLimit : Infinity;
    }

    function getSelectedSpellCount(level, exceptField) {
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => field !== exceptField && Number(field.dataset.spellLevel) === level && field.value.trim())
        .filter((field) => !isAutoGrantedSpellField(field))
        .length;
    }

    function spellSlotTotal(level) {
      const slots = spellSlotsForCharacter();
      return slots[level - 1] || 0;
    }

    function spellSlotRemainingField(level) {
      return getFieldByKey(SPELL_SLOT_REMAINING_KEYS.get(level) || "");
    }

    function spellSlotRemaining(level) {
      const field = spellSlotRemainingField(level);
      const parsed = Number.parseInt(field?.value || "", 10);
      if (Number.isFinite(parsed)) return parsed;
      return spellSlotTotal(level);
    }

    function syncSpellSlotFields({ resetRemaining = false } = {}) {
      for (let level = 1; level <= 9; level += 1) {
        const total = spellSlotTotal(level);
        const totalValue = total ? String(total) : "";
        const remainingField = spellSlotRemainingField(level);
        const currentRemaining = Number.parseInt(remainingField?.value || "", 10);
        setFieldValue(SPELL_SLOT_TOTAL_KEYS.get(level), totalValue);
        if (!remainingField) continue;
        if (!total) {
          remainingField.value = "";
          continue;
        }
        if (resetRemaining || !Number.isFinite(currentRemaining)) {
          remainingField.value = totalValue;
        } else {
          remainingField.value = String(Math.max(0, Math.min(currentRemaining, total)));
        }
      }
    }

    function getCurrentHitPointsField() {
      const keys = [
        "HPCurrent",
        "CurrentHP",
        "Current Hit Points",
        "CurrentHitPoints",
        "HP Current",
        "Hit Points Current",
        "HitPointsCurrent"
      ];
      for (const key of keys) {
        const field = getFieldByKey(key);
        if (field) return field;
      }
      return [...document.querySelectorAll(".field")]
        .find((field) => {
          const key = normalizeName(field.dataset.key || "");
          return key.includes("hp") && key.includes("current") && !key.includes("max") && !key.includes("temp");
        }) || null;
    }

    function isCurrentHitPointsField(field) {
      return Boolean(field) && field === getCurrentHitPointsField();
    }

    function restoreLongRestResources() {
      syncSpellSlotFields({ resetRemaining: true });
      sheetMeta.featureUses = {};
      const currentHpField = getCurrentHitPointsField();
      const maxHp = fieldValue("HPMax");
      if (currentHpField && maxHp) currentHpField.value = maxHp;
      updatePreparedSpellsPanel();
    }

    function spendSpellSlot(level) {
      const remaining = spellSlotRemaining(level);
      if (remaining <= 0) return false;
      setFieldValue(SPELL_SLOT_REMAINING_KEYS.get(level), String(remaining - 1));
      return true;
    }

    function longRestSpellResources() {
      if (!isCharacterReady()) {
        restoreLongRestResources();
        scheduleSave();
        showStatus("Long rest: vida y spell slots restaurados");
        return;
      }
      sheetMeta.longRestActive = !isLongRestActive();
      if (!sheetMeta.longRestActive) {
        restoreLongRestResources();
      }
      updateInteractionState();
      if (itemDrawer?.classList.contains("visible") && itemDrawer.classList.contains("spell-picker-drawer")) {
        const spellField = document.querySelector(".field.select[data-option-type='spell']");
        if (spellField) showSpellSelectionDrawer(spellField);
      }
      scheduleSave();
      showStatus(sheetMeta.longRestActive
        ? isBardCharacter() ? "Long rest iniciado: Bard no cambia magias" : "Long rest iniciado: podes cambiar magias"
        : "Long rest terminado: vida y spell slots restaurados");
    }

    function isSpellAlreadySelected(spellName, exceptField = null) {
      const normalized = normalizeName(spellName);
      if (!normalized) return false;
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .some((field) => field !== exceptField && normalizeName(field.value || "") === normalized);
    }

    function isWizardCharacter() {
      return normalizeName(getMainClassName() || getSelectedClassName()) === "wizard";
    }

    function isBardCharacter() {
      return normalizeName(getMainClassName() || getSelectedClassName()) === "bard";
    }

    function selectedKnownSpellNames() {
      return wizardSpellFields()
        .filter((field) => field.value.trim() && !isAutoGrantedSpellField(field))
        .map((field) => field.value.trim());
    }

    function selectedKnownSpellSet() {
      return new Set(selectedKnownSpellNames().map(normalizeName));
    }

    function knownSpellFieldForSpell(spellName) {
      const normalized = normalizeName(spellName);
      return wizardSpellFields().find((field) => normalizeName(field.value || "") === normalized) || null;
    }

    function extraKnownSpellLimit() {
      return activeFeatSpellGrants()
        .filter((grant) => grant.level > 0 && !grant.spellName)
        .reduce((total, grant) => total + (grant.count || 1), 0);
    }

    function bardKnownSpellLimit() {
      const level = Math.min(20, Math.max(1, getCharacterLevel()));
      const detail = classDetailByName("Bard");
      const progression = detail?.classItem?.spellsKnownProgression;
      const base = Array.isArray(progression) ? progression[level - 1] : BARD_SPELLS_KNOWN[level - 1];
      return (base || 0) + extraKnownSpellLimit();
    }

    function bardCanLearnSpell(spellName) {
      const spell = findSpellByName(spellName);
      if (!spell || spell.level <= 0 || !canUseSpellLevel(spell.level)) return false;
      if (spell.classes?.some((name) => normalizeName(name) === "bard")) return true;
      return featGrantsSpell(spell, spell.level);
    }

    function assignKnownSpellToSheet(spellName) {
      if (!ensureCanModifySpells()) return null;
      const spell = findSpellByName(spellName);
      if (!spell) return null;
      const existing = knownSpellFieldForSpell(spell.name);
      if (existing) return existing;
      const field = firstEmptyWizardFieldForLevel(spell.level);
      if (!field) {
        showStatus(`No hay campo libre para spells nivel ${spell.level}`);
        return null;
      }
      field.value = spell.name;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      return field;
    }

    function removeKnownSpellFromSheet(spellName) {
      if (!ensureCanModifySpells()) return;
      const normalized = normalizeName(spellName);
      wizardSpellFields().forEach((field) => {
        if (normalizeName(field.value || "") !== normalized || isAutoGrantedSpellField(field)) return;
        field.value = "";
        const checkbox = getFieldByKey(field.dataset.preparedKey || "");
        if (checkbox) checkbox.checked = false;
        field.dispatchEvent(new Event("input", { bubbles: true }));
        field.dispatchEvent(new Event("change", { bubbles: true }));
      });
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function getAllBardAccessibleSpellOptions() {
      const autoPrepared = new Set(autoAlwaysPreparedSpellNames().map(normalizeName));
      const maxLevel = maxSpellLevelForCharacter();
      return spells.filter((spell) => spell.level > 0
        && spell.level <= maxLevel
        && !autoPrepared.has(normalizeName(spell.name))
        && bardCanLearnSpell(spell.name));
    }

    function wizardMaxSpellbookSpells() {
      return 6 + Math.max(0, getCharacterLevel() - 1) * 2;
    }

    function wizardPreparedSpellLimit() {
      const level = Math.min(20, Math.max(1, getCharacterLevel()));
      return WIZARD_PREPARED_SPELLS[level - 1] || 0;
    }

    function selectedWizardPreparedSpellCount(exceptCheckbox = null) {
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => Number(field.dataset.spellLevel) > 0 && field.value.trim())
        .filter((field) => {
          const checkbox = getFieldByKey(field.dataset.preparedKey || "");
          return checkbox && checkbox !== exceptCheckbox && checkbox.checked;
        })
        .length;
    }

    function wizardCanLearnSpell(spellName) {
      const spell = findSpellByName(spellName);
      if (!spell || spell.level <= 0) return false;
      return canUseSpellLevel(spell.level) && spell.classes?.some((name) => normalizeName(name) === "wizard");
    }

    function wizardSpellbookNames() {
      if (!Array.isArray(sheetMeta.wizardSpellbook)) sheetMeta.wizardSpellbook = [];
      return sheetMeta.wizardSpellbook.filter(Boolean);
    }

    function wizardSpellbookSet() {
      return new Set(wizardSpellbookNames().map(normalizeName));
    }

    function addWizardSpellbookSpell(spellName) {
      if (!ensureCanModifySpells()) return false;
      if (!Array.isArray(sheetMeta.wizardSpellbook)) sheetMeta.wizardSpellbook = [];
      if (wizardSpellbookSet().has(normalizeName(spellName))) return true;
      if (!wizardCanLearnSpell(spellName)) {
        showStatus("Esa magia no esta disponible para este Wizard.");
        return false;
      }
      if (wizardSpellbookNames().length >= wizardMaxSpellbookSpells()) {
        showStatus(`Spellbook lleno: ${wizardMaxSpellbookSpells()} magia(s) para este nivel.`);
        return false;
      }
      sheetMeta.wizardSpellbook.push(spellName);
      assignWizardSpellToSheet(spellName);
      scheduleSave();
      return true;
    }

    function removeWizardSpellbookSpell(spellName) {
      if (!ensureCanModifySpells()) return;
      if (!Array.isArray(sheetMeta.wizardSpellbook)) return;
      const normalized = normalizeName(spellName);
      sheetMeta.wizardSpellbook = sheetMeta.wizardSpellbook.filter((name) => normalizeName(name) !== normalized);
      clearWizardSpellFromSheet(spellName);
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function syncPreparedWizardSpellsToSpellbook() {
      if (!isWizardCharacter()) return;
      [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .map((field) => field.value.trim())
        .filter(Boolean)
        .map(findSpellByName)
        .filter((spell) => spell?.level > 0 && spell.classes?.some((name) => normalizeName(name) === "wizard"))
        .forEach((spell) => addWizardSpellbookSpell(spell.name));
    }

    function pruneWizardSpellSelectionsFromSpellbook() {
      if (!isWizardCharacter()) return;
      const known = wizardSpellbookSet();
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach((field) => {
        const level = Number(field.dataset.spellLevel);
        if (level <= 0 || !field.value.trim() || isAutoGrantedSpellField(field)) return;
        if (known.has(normalizeName(field.value))) return;
        field.value = "";
        const checkbox = getFieldByKey(field.dataset.preparedKey || "");
        if (checkbox) checkbox.checked = false;
      });
    }

    function handleWizardPreparedLimitChange(event) {
      if (!isWizardCharacter()) return;
      if (!canModifySpells()) return;
      const checkbox = event.target;
      if (checkbox?.type !== "checkbox" || !checkbox.dataset.spellKey || !checkbox.checked) return;
      const spellField = getFieldByKey(checkbox.dataset.spellKey);
      if (!spellField || Number(spellField.dataset.spellLevel) <= 0) return;
      const limit = wizardPreparedSpellLimit();
      if (selectedWizardPreparedSpellCount(checkbox) < limit) return;
      checkbox.checked = false;
      showStatus(`Limite de prepared spells: ${limit}`);
    }

    function setWizardPreparedSpell(spellName, prepared) {
      if (!ensureCanModifySpells()) return false;
      const spell = findSpellByName(spellName);
      if (!spell || spell.level <= 0) return false;
      if (!wizardSpellbookSet().has(normalizeName(spell.name)) && !addWizardSpellbookSpell(spell.name)) return false;
      const field = assignWizardSpellToSheet(spell.name);
      if (!field) return false;
      const checkbox = getFieldByKey(field.dataset.preparedKey || "");
      if (!checkbox) {
        showStatus("No encontre checkbox de prepared para esa magia.");
        return false;
      }
      if (prepared && selectedWizardPreparedSpellCount(checkbox) >= wizardPreparedSpellLimit()) {
        showStatus(`Limite de prepared spells: ${wizardPreparedSpellLimit()}`);
        return false;
      }
      checkbox.checked = Boolean(prepared);
      checkbox.dispatchEvent(new Event("change", { bubbles: true }));
      updatePreparedSpellsPanel();
      scheduleSave();
      showStatus(`${spell.name}: ${prepared ? "preparada" : "no preparada"}`);
      return true;
    }

    function spellMatchesSelection(spell, level) {
      if (spell.level !== level) return false;
      if (!canUseSpellLevel(level)) return false;
      const className = normalizeName(getSelectedClassName());
      const raceName = normalizeName(getSelectedRaceName());
      const classMatches = className && spell.classes?.some((name) => normalizeName(name) === className);
      const raceMatches = raceName && spell.races?.some((name) => normalizeName(name) === raceName);
      const featMatches = featGrantsSpell(spell, level);
      if (className || raceName || activeFeatSpellGrants().length) return Boolean(classMatches || raceMatches || featMatches);
      return true;
    }

    function getSpellOptions(level, field = null) {
      const autoPrepared = new Set(autoAlwaysPreparedSpellNames().map(normalizeName));
      return spells.filter((spell) => spellMatchesSelection(spell, level)
        && !autoPrepared.has(normalizeName(spell.name))
        && (!isWizardCharacter() || level === 0 || wizardSpellbookSet().has(normalizeName(spell.name)) || normalizeName(field?.value || "") === normalizeName(spell.name))
        && !isSpellAlreadySelected(spell.name, field));
    }

    function getWizardAccessibleSpellOptions(level) {
      const autoPrepared = new Set(autoAlwaysPreparedSpellNames().map(normalizeName));
      return spells.filter((spell) => spell.level === level
        && level > 0
        && canUseSpellLevel(level)
        && spell.classes?.some((name) => normalizeName(name) === "wizard")
        && !autoPrepared.has(normalizeName(spell.name)));
    }

    function selectedSpellFieldsForLevel(level) {
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => Number(field.dataset.spellLevel) === level);
    }

    function wizardSpellFields() {
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => Number(field.dataset.spellLevel) > 0);
    }

    function cantripFields() {
      return [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => Number(field.dataset.spellLevel) === 0);
    }

    function wizardFieldForSpell(spellName) {
      const normalized = normalizeName(spellName);
      return wizardSpellFields().find((field) => normalizeName(field.value || "") === normalized) || null;
    }

    function cantripFieldForSpell(spellName) {
      const normalized = normalizeName(spellName);
      return cantripFields().find((field) => normalizeName(field.value || "") === normalized) || null;
    }

    function firstEmptyWizardFieldForLevel(level) {
      return selectedSpellFieldsForLevel(level)
        .find((field) => !field.value.trim() && !isAutoGrantedSpellField(field)) || null;
    }

    function firstEmptyCantripField() {
      return cantripFields().find((field) => !field.value.trim() && !isAutoGrantedSpellField(field)) || null;
    }

    function assignWizardSpellToSheet(spellName) {
      if (!ensureCanModifySpells()) return null;
      const spell = findSpellByName(spellName);
      if (!spell) return null;
      const existing = wizardFieldForSpell(spell.name);
      if (existing) return existing;
      const field = firstEmptyWizardFieldForLevel(spell.level);
      if (!field) {
        showStatus(`No hay campo libre para spells nivel ${spell.level}`);
        return null;
      }
      field.value = spell.name;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      return field;
    }

    function selectedCantripNames() {
      return cantripFields()
        .filter((field) => field.value.trim() && !isAutoGrantedSpellField(field))
        .map((field) => field.value.trim());
    }

    function selectedCantripSet() {
      return new Set(selectedCantripNames().map(normalizeName));
    }

    function canLearnCantrip(spellName) {
      const spell = findSpellByName(spellName);
      if (!spell || spell.level !== 0) return false;
      const className = normalizeName(getSelectedClassName());
      return !className || spell.classes?.some((name) => normalizeName(name) === className);
    }

    function assignCantripToSheet(spellName) {
      if (!ensureCanModifySpells()) return null;
      const spell = findSpellByName(spellName);
      if (!spell || spell.level !== 0) return null;
      const existing = cantripFieldForSpell(spell.name);
      if (existing) return existing;
      if (selectedCantripNames().length >= cantripsKnownForCharacter()) {
        showStatus(`Limite de cantrips: ${cantripsKnownForCharacter()}`);
        return null;
      }
      if (!canLearnCantrip(spell.name)) {
        showStatus("Ese cantrip no esta disponible para tu clase.");
        return null;
      }
      const field = firstEmptyCantripField();
      if (!field) {
        showStatus("No hay campo libre para cantrips");
        return null;
      }
      field.value = spell.name;
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      updatePreparedSpellsPanel();
      scheduleSave();
      return field;
    }

    function removeCantripFromSheet(spellName) {
      if (!ensureCanModifySpells()) return;
      const normalized = normalizeName(spellName);
      cantripFields().forEach((field) => {
        if (normalizeName(field.value || "") !== normalized || isAutoGrantedSpellField(field)) return;
        field.value = "";
        field.dispatchEvent(new Event("input", { bubbles: true }));
        field.dispatchEvent(new Event("change", { bubbles: true }));
      });
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function clearWizardSpellFromSheet(spellName) {
      const normalized = normalizeName(spellName);
      wizardSpellFields().forEach((field) => {
        if (normalizeName(field.value || "") !== normalized) return;
        field.value = "";
        const checkbox = getFieldByKey(field.dataset.preparedKey || "");
        if (checkbox) checkbox.checked = false;
        field.dispatchEvent(new Event("input", { bubbles: true }));
        field.dispatchEvent(new Event("change", { bubbles: true }));
      });
    }

    function autoGrantedSpellNames() {
      const known = new Set(spells.map((spell) => normalizeName(spell.name)));
      const names = [];
      const className = normalizeName(getSelectedClassName());
      (ALWAYS_PREPARED_SPELLS_BY_CLASS[className] || []).forEach((name) => names.push(name));
      activeFeatSpellGrants()
        .filter((grant) => grant.spellName)
        .forEach((grant) => names.push(grant.spellName));
      choosableFeatureEntriesForCharacter()
        .flatMap((entry) => selectedFeatureChoices(featureChoiceKey(entry.feature)))
        .filter((value) => String(value).startsWith("spell:"))
          .forEach((value) => names.push(String(value).replace(/^spell:/, "")));
      const texts = [
        raceAutoEffectDescription(),
        selectedOptionDescription("background", getFieldValueByNormalizedKey("background")),
        ...generatedFeaturesAndTraitsEntries().map((entry) => entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || ""))
      ];

      texts.forEach((text) => {
        [...String(text || "").matchAll(/\bCantrip\s+([A-Za-z' ,/-]+?)(?=\s+(?:1st|2nd|3rd|4th|5th|Your magic|Suggested Characteristics|Feature)\b|$)/gi)]
          .forEach((match) => {
            match[1]
              .replace(/\bor\b/gi, ",")
              .replace(/\band\b/gi, ",")
              .split(",")
              .forEach((name) => names.push(name));
          });
        sentenceList(text).forEach((sentence) => {
          const levelGate = sentence.match(/\bStarting at (\d+)(?:st|nd|rd|th) level\b/i);
          if (levelGate && getCharacterLevel() < (Number.parseInt(levelGate[1], 10) || 1)) return;
          const singleMatch = sentence.match(/\byou (?:also )?know the ([A-Za-z' -]+?) cantrip\b/i);
          if (singleMatch) names.push(singleMatch[1]);
          const preparedMatch = sentence.match(/\byou (?:also )?(?:always have|have) the ([A-Za-z' -]+?) spell prepared\b/i);
          if (preparedMatch) names.push(preparedMatch[1]);
          const castMatch = sentence.match(/\byou can cast the ([A-Za-z' -]+?) spell\b/i);
          if (castMatch) names.push(castMatch[1]);

          const listMatch = sentence.match(/\byou know (?:one of the following cantrips of your choice:\s*)?([A-Za-z' ,/-]+?) cantrips?\b/i);
          if (listMatch && !/choice|from the .* spell list/i.test(sentence)) {
            listMatch[1]
              .replace(/\bor\b/gi, ",")
              .replace(/\band\b/gi, ",")
              .split(",")
              .forEach((name) => names.push(name));
          }
        });
      });

      return uniqueReadableValues(names)
        .map((name) => spells.find((spell) => normalizeName(spell.name) === normalizeName(name))?.name || titleCaseWords([name])[0])
        .filter((name) => known.has(normalizeName(name)));
    }

    function autoAlwaysPreparedSpellNames() {
      const known = new Set(spells.map((spell) => normalizeName(spell.name)));
      const names = [];
      const className = normalizeName(getSelectedClassName());
      (ALWAYS_PREPARED_SPELLS_BY_CLASS[className] || []).forEach((name) => names.push(name));
      activeFeatSpellGrants()
        .filter((grant) => grant.prepared && grant.spellName)
        .forEach((grant) => names.push(grant.spellName));
      const texts = [
        raceAutoEffectDescription(),
        selectedOptionDescription("background", getFieldValueByNormalizedKey("background")),
        ...generatedFeaturesAndTraitsEntries().map((entry) => entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || ""))
      ];

      texts.forEach((text) => {
        sentenceList(text).forEach((sentence) => {
          const levelGate = sentence.match(/\bStarting at (\d+)(?:st|nd|rd|th) level\b/i);
          if (levelGate && getCharacterLevel() < (Number.parseInt(levelGate[1], 10) || 1)) return;
          const preparedMatch = sentence.match(/\byou (?:also )?(?:always have|have) the ([A-Za-z' -]+?) spell prepared\b/i);
          if (preparedMatch) names.push(preparedMatch[1]);
        });
      });

      return uniqueReadableValues(names)
        .map((name) => spells.find((spell) => normalizeName(spell.name) === normalizeName(name))?.name || titleCaseWords([name])[0])
        .filter((name) => known.has(normalizeName(name)));
    }

    function autoCantripNames() {
      const cantrips = new Set(spells.filter((spell) => spell.level === 0).map((spell) => normalizeName(spell.name)));
      return autoGrantedSpellNames().filter((name) => cantrips.has(normalizeName(name)));
    }

    function isAutoGrantedSpellField(field) {
      return field?.dataset?.autoGrantedSpell === "true";
    }

    function isAutoPreparedSpellField(field) {
      return field?.dataset?.autoPreparedSpell === "true";
    }

    function syncAutoPreparedSpellCheckbox(field, preparedSet) {
      const checkbox = getFieldByKey(field?.dataset?.preparedKey || "");
      if (!checkbox || checkbox.type !== "checkbox") return;
      const isPrepared = Boolean(preparedSet?.has(normalizeName(field.value || "")));
      if (isPrepared) {
        field.dataset.autoPreparedSpell = "true";
        checkbox.checked = true;
        return;
      }
      if (isAutoPreparedSpellField(field)) checkbox.checked = false;
      delete field.dataset.autoPreparedSpell;
    }

    function syncAutoPreparedSpellCheckboxes(preparedSet) {
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach((field) => syncAutoPreparedSpellCheckbox(field, preparedSet));
    }

    function featPreparedSpellMatches(field) {
      const spell = findSpellByName(field?.value || "");
      if (!spell) return false;
      const level = Number(field.dataset.spellLevel);
      return activeFeatSpellGrants().some((grant) => {
        if (!grant.prepared || grant.level !== level) return false;
        if (grant.spellName) return normalizeName(grant.spellName) === normalizeName(spell.name);
        if (!grant.className) return true;
        return spell.classes?.some((name) => normalizeName(name) === normalizeName(grant.className));
      });
    }

    function syncFeatPreparedSpellCheckbox(field) {
      const checkbox = getFieldByKey(field?.dataset?.preparedKey || "");
      if (!checkbox || checkbox.type !== "checkbox") return;
      if (field.value.trim() && featPreparedSpellMatches(field)) {
        checkbox.checked = true;
        field.dataset.autoPreparedSpellFromFeat = "true";
        return;
      }
      if (field.dataset.autoPreparedSpellFromFeat === "true") checkbox.checked = false;
      delete field.dataset.autoPreparedSpellFromFeat;
    }

    function syncFeatPreparedSpellCheckboxes() {
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach(syncFeatPreparedSpellCheckbox);
    }

    function syncAutoCantrips() {
      const fields = [...document.querySelectorAll(".field.select[data-option-type='spell']")];
      if (!fields.length) return;
      const autoNames = autoCantripNames();
      const nextSet = new Set(autoNames.map(normalizeName));
      const autoPreparedNames = autoAlwaysPreparedSpellNames();
      const preparedSet = new Set(autoPreparedNames.map(normalizeName));

      fields.forEach((field) => {
        if (!field.value.trim()) return;
        const spell = findSpellByName(field.value);
        if (spell?.level === 0 || !preparedSet.has(normalizeName(field.value))) return;
        field.value = "";
        delete field.dataset.autoGrantedSpell;
        syncAutoPreparedSpellCheckbox(field, preparedSet);
        syncFeatPreparedSpellCheckbox(field);
      });

      fields.forEach((field) => {
        if (nextSet.has(normalizeName(field.value))) field.dataset.autoGrantedSpell = "true";
        syncAutoPreparedSpellCheckbox(field, preparedSet);
      });

      fields.forEach((field) => {
        if (!isAutoGrantedSpellField(field)) return;
        if (!nextSet.has(normalizeName(field.value))) {
          field.value = "";
          syncAutoPreparedSpellCheckbox(field, preparedSet);
          delete field.dataset.autoGrantedSpell;
        }
      });

      autoNames.forEach((name) => {
        if (isSpellAlreadySelected(name)) return;
        const spell = findSpellByName(name);
        const reusable = fields.find((field) => Number(field.dataset.spellLevel) === spell?.level && !field.value.trim());
        if (!reusable) return;
        reusable.value = name;
        reusable.dataset.autoGrantedSpell = "true";
        syncAutoPreparedSpellCheckbox(reusable, preparedSet);
      });

      fields.forEach((field) => {
        if (isAutoGrantedSpellField(field) && !autoNames.some((name) => normalizeName(name) === normalizeName(field.value))) {
          syncAutoPreparedSpellCheckbox(field, preparedSet);
          delete field.dataset.autoGrantedSpell;
        }
      });
      syncAutoPreparedSpellCheckboxes(preparedSet);
      syncFeatPreparedSpellCheckboxes();
      sheetMeta.autoGrantedSpells = autoNames;
      sheetMeta.autoPreparedSpells = autoPreparedNames;
      sheetMeta.autoCantrips = autoCantripNames();
    }

    function normalizeName(name) {
      return name.trim().toLowerCase();
    }

    function findSpellByName(name) {
      const normalized = normalizeName(name);
      return spells.find((spell) => normalizeName(spell.name) === normalized) || null;
    }

    function parseSignedNumber(value) {
      const match = String(value || "").match(/[+-]?\d+/);
      return match ? Number.parseInt(match[0], 10) : 0;
    }

    function getSpellAttackBonus() {
      return parseSignedNumber(getFieldValueByNormalizedKey("spellatkbonus 2"));
    }

    function getStrengthModifier() {
      return parseSignedNumber(getFieldValueByNormalizedKey("strmod"));
    }

    function getDexterityModifier() {
      return parseSignedNumber(getFieldValueByNormalizedKey("dexmod"));
    }

    function getUnarmedAttackBonus() {
      return getStrengthModifier() + parseSignedNumber(getFieldValueByNormalizedKey("profbonus"));
    }

    function abilityModifierByKey(key) {
      const field = getFieldByKey(String(key || "").toUpperCase());
      return abilityModifier(field?.value || "") ?? 0;
    }

    function spellAttackBonusForAbilityKey(key) {
      return parseSignedNumber(getFieldValueByNormalizedKey("profbonus")) + abilityModifierByKey(key);
    }

    function magicInitiateGrantForSpell(spellName) {
      const normalized = normalizeName(spellName || "");
      if (!normalized) return null;
      return activeFeatSpellGrants().find((grant) => grant.fromMagicInitiate && normalizeName(grant.spellName || "") === normalized) || null;
    }

    function getCharacterLevel() {
      return Number.parseInt(getFieldValueByNormalizedKey("characterlevel"), 10) || 1;
    }

    function scaledCantripDice(expression) {
      const match = expression.match(/^(\d+)d(\d+)(.*)$/i);
      if (!match) return expression;
      const level = getCharacterLevel();
      const multiplier = level >= 17 ? 4 : level >= 11 ? 3 : level >= 5 ? 2 : 1;
      return `${Number(match[1]) * multiplier}d${match[2]}${match[3] || ""}`;
    }

    function trueStrikeExtraDiceCount() {
      const level = getCharacterLevel();
      return level >= 17 ? 3 : level >= 11 ? 2 : level >= 5 ? 1 : 0;
    }

    function damageDiceForSpell(spell) {
      if (!spell?.description) return null;
      const spellName = normalizeName(spell.name || "");
      if (spellName === "true strike") {
        const diceCount = trueStrikeExtraDiceCount();
        return diceCount ? `${diceCount}d6` : null;
      }
      const hitMatch = spell.description.match(/on a hit[^.]*?takes?\s+(\d+d\d+(?:\s*[+-]\s*\d+)?)/i);
      const damageMatch = spell.description.match(/takes?\s+(\d+d\d+(?:\s*[+-]\s*\d+)?)/i);
      const expression = hitMatch?.[1] || damageMatch?.[1] || spell.description.match(/\b\d+d\d+(?:\s*[+-]\s*\d+)?\b/i)?.[0] || null;
      if (!expression) return null;
      if (spellName === "eldritch blast") return expression.replace(/\s+/g, "");
      return spell.level === 0 ? scaledCantripDice(expression.replace(/\s+/g, "")) : expression.replace(/\s+/g, "");
    }

    function damageTypeForSpell(spell) {
      if (!spell?.description) return "";
      const typedAfterDice = spell.description.match(/\d+d\d+(?:\s*[+-]\s*\d+)?\s+([a-z]+)\s+damage/i);
      if (typedAfterDice?.[1]) return typedAfterDice[1].toLowerCase();
      const typedDamage = spell.description.match(/\b(acid|bludgeoning|cold|fire|force|lightning|necrotic|piercing|poison|psychic|radiant|slashing|thunder)\s+damage\b/i);
      return typedDamage?.[1]?.toLowerCase() || "";
    }

    function selectedOptionalFeatureNames(featureType = "") {
      const targetType = String(featureType || "").toUpperCase();
      return selectedFeatureChoiceEntries()
        .filter((entry) => entry.type === "optionalfeature")
        .filter((entry) => !targetType || (entry.optionalFeature?.featureType || []).includes(targetType))
        .map((entry) => entry.optionalFeature?.name || entry.title || "")
        .filter(Boolean);
    }

    function hasSelectedInvocation(name) {
      const target = normalizeName(name);
      return selectedOptionalFeatureNames("EI").some((item) => normalizeName(item) === target);
    }

    function eldritchBlastBeamCount() {
      const level = getCharacterLevel();
      return level >= 17 ? 4 : level >= 11 ? 3 : level >= 5 ? 2 : 1;
    }

    function eldritchBlastDamageExpression() {
      const charismaModifier = parseSignedNumber(getFieldValueByNormalizedKey("chamod"));
      const agonizingBonus = hasSelectedInvocation("Agonizing Blast") && charismaModifier ? formatModifier(charismaModifier) : "";
      return `1d10${agonizingBonus}`;
    }

    function eldritchBlastInvocationLabels() {
      const labels = [];
      if (hasSelectedInvocation("Agonizing Blast")) labels.push("Agonizing: CHA al danio");
      if (hasSelectedInvocation("Repelling Blast")) labels.push("Repelling: empuja 10 ft");
      if (hasSelectedInvocation("Grasp of Hadar")) labels.push("Grasp: acerca 10 ft 1/turno");
      if (hasSelectedInvocation("Lance of Lethargy")) labels.push("Lance: -10 ft speed 1/turno");
      if (hasSelectedInvocation("Eldritch Spear")) labels.push("Eldritch Spear: 300 ft");
      return labels;
    }

    function spellAttackSelections(spellName, levelOverride = null) {
      const spell = findSpellByName(spellName);
      const level = levelOverride ?? spell?.level ?? 1;
      const magicInitiateGrant = magicInitiateGrantForSpell(spellName);
      const magicInitiateAbility = magicInitiateGrant?.ability || "";
      const attackBonus = magicInitiateAbility ? spellAttackBonusForAbilityKey(magicInitiateAbility) : getSpellAttackBonus();
      const abilityNote = magicInitiateAbility
        ? `\n\nMagic Initiate: usa ${magicInitiateAbility} como spellcasting ability. Spell save DC ${8 + parseSignedNumber(getFieldValueByNormalizedKey("profbonus")) + abilityModifierByKey(magicInitiateAbility)}, spell attack ${formatModifier(attackBonus)}.`
        : "";
      const base = {
        kind: "spell",
        damageType: damageTypeForSpell(spell),
        description: `${descriptionForSpell(spell)}${abilityNote}`,
        attackBonus,
        attackLabel: magicInitiateAbility ? `Magic Initiate spell attack (${magicInitiateAbility})` : "spell attack",
        level
      };
      if (normalizeName(spellName) !== "eldritch blast") {
        const damage = damageDiceForSpell(spell);
        const trueStrikeDice = normalizeName(spellName) === "true strike" ? trueStrikeExtraDiceCount() : null;
        const damageLabel = trueStrikeDice == null ? damage : trueStrikeDice ? `+${trueStrikeDice}d6` : "+0";
        return [{ name: spellName, damage, damageLabel, ...base }];
      }
      const beams = eldritchBlastBeamCount();
      const invocationLabels = eldritchBlastInvocationLabels();
      const damage = eldritchBlastDamageExpression();
      return Array.from({ length: beams }, (_, index) => ({
        name: beams > 1 ? `${spellName} ${index + 1}/${beams}` : spellName,
        sourceName: spellName,
        damage,
        damageLabel: damage,
        ...base,
        attackLabel: ["spell attack", "tirada separada", ...invocationLabels].join(", ")
      }));
    }

    const DAMAGE_TYPE_SYMBOLS = {
      acid: "ACD",
      bludgeoning: "BLD",
      cold: "CLD",
      fire: "FIR",
      force: "FRC",
      lightning: "LGT",
      necrotic: "NEC",
      piercing: "PRC",
      poison: "PSN",
      psychic: "PSY",
      radiant: "RAD",
      slashing: "SLH",
      thunder: "THN"
    };

    function damageTypeSymbol(type) {
      return DAMAGE_TYPE_SYMBOLS[type] || "?";
    }

    function showDamageTooltip(anchor, type) {
      damageTooltip.classList.remove("feature-tooltip");
      damageTooltip.textContent = type || "Sin tipo de danio detectado";
      const rect = anchor.getBoundingClientRect();
      const margin = 8;
      damageTooltip.classList.add("visible");
      const tooltipRect = damageTooltip.getBoundingClientRect();
      const left = Math.min(Math.max(margin, rect.left + rect.width / 2 - tooltipRect.width / 2), window.innerWidth - tooltipRect.width - margin);
      const top = rect.top > tooltipRect.height + margin
        ? rect.top - tooltipRect.height - 6
        : rect.bottom + 6;
      damageTooltip.style.left = `${left}px`;
      damageTooltip.style.top = `${top}px`;
    }

    function hideDamageTooltip() {
      damageTooltip.classList.remove("visible");
      damageTooltip.classList.remove("feature-tooltip");
    }

    function descriptionForSpell(spell) {
      return spell?.description || "Sin descripcion disponible.";
    }

    const SPELL_SCHOOL_LABELS = {
      A: "Abjuration",
      C: "Conjuration",
      D: "Divination",
      E: "Enchantment",
      I: "Illusion",
      N: "Necromancy",
      T: "Transmutation",
      V: "Evocation"
    };

    function spellSourceLabel(spell) {
      const match = spell?.description?.match(/\bSource:\s*([A-Za-z0-9' .&-]+)/i);
      return match?.[1]?.replace(/\.$/, "").trim() || "";
    }

    function spellSchoolLabel(spell) {
      const match = spell?.description?.match(/\bSchool:\s*([A-Z][A-Za-z]*)\b/i);
      const code = match?.[1]?.toUpperCase() || "";
      return SPELL_SCHOOL_LABELS[code] || match?.[1] || "";
    }

    function spellLevelLabel(level) {
      if (level === 0) return "Cantrip";
      const suffix = level === 1 ? "st" : level === 2 ? "nd" : level === 3 ? "rd" : "th";
      return `${level}${suffix} level`;
    }

    function cleanSpellDescription(spell) {
      return String(spell?.description || "")
        .replace(/\bSource:\s*[A-Za-z0-9' .&-]+\.\s*/i, "")
        .replace(/\bLevel:\s*(?:Cantrip|\d+)\.\s*/i, "")
        .replace(/\bSchool:\s*[A-Z][A-Za-z]*\.\s*/i, "")
        .trim();
    }

    function spellTranslationKey(spell) {
      return [spell?.name || "", spellSourceLabel(spell), spell?.level ?? ""]
        .map((item) => normalizeName(String(item)))
        .join("|");
    }

    function ensureSpellTranslationCache() {
      if (!sheetMeta.spellDescriptionTranslations || typeof sheetMeta.spellDescriptionTranslations !== "object") {
        sheetMeta.spellDescriptionTranslations = {};
      }
      return sheetMeta.spellDescriptionTranslations;
    }

    function decodeTranslationEntities(text) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = text;
      return textarea.value;
    }

    async function translateTextToSpanish(text) {
      if (desktopStore?.translateText) return desktopStore.translateText(text, "en", "es");
      const params = new URLSearchParams({ q: text, langpair: "en|es" });
      const response = await fetch(`https://api.mymemory.translated.net/get?${params.toString()}`);
      if (!response.ok) throw new Error(`Translation request failed (${response.status})`);
      const data = await response.json();
      return data?.responseData?.translatedText || "";
    }

    function splitTranslationChunks(text, maxLength = 460) {
      const chunks = [];
      let current = "";
      splitDescriptionLines(text).forEach((line) => {
        if (line.length > maxLength) {
          if (current) {
            chunks.push(current);
            current = "";
          }
          for (let index = 0; index < line.length; index += maxLength) {
            chunks.push(line.slice(index, index + maxLength));
          }
          return;
        }
        const next = current ? `${current}\n${line}` : line;
        if (next.length > maxLength) {
