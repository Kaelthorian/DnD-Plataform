          if (current) chunks.push(current);
          current = line;
        } else {
          current = next;
        }
      });
      if (current) chunks.push(current);
      return chunks;
    }

    async function translateLongTextToSpanish(text) {
      const chunks = splitTranslationChunks(text);
      const translatedChunks = [];
      for (const chunk of chunks) {
        translatedChunks.push(await translateTextToSpanish(chunk));
      }
      return translatedChunks.join("\n");
    }

    async function translateSpellDescription(spell, description) {
      const cache = ensureSpellTranslationCache();
      const key = spellTranslationKey(spell);
      if (cache[key]) return cache[key];
      const translated = decodeTranslationEntities(await translateLongTextToSpanish(description)).trim();
      if (!translated) throw new Error("No se recibio traduccion");
      cache[key] = translated;
      scheduleSave();
      return translated;
    }

    function spellDescriptionsInSpanish() {
      return sheetMeta.spellDescriptionsLanguage === "es";
    }

    function setSpellDescriptionsInSpanish(enabled) {
      sheetMeta.spellDescriptionsLanguage = enabled ? "es" : "en";
      scheduleSave();
    }

    function renderSpellDescriptionSections(container, description) {
      container.textContent = "";
      appendItemSection(container, "Descripcion", splitDescriptionLines(description).join("\n"));
    }

    function weaponAbilityModifier(item) {
      const str = getStrengthModifier();
      const dex = getDexterityModifier();
      const ranged = itemTypeAbbreviation(item) === "R";
      if (hasItemProperty(item, "F")) return Math.max(str, dex);
      return ranged ? dex : str;
    }

    function selectedFightingStyleNames() {
      return selectedFeatureChoiceEntries()
        .filter((entry) => entry.type === "feat")
        .map((entry) => entry.featName || entry.title || "")
        .filter((name) => {
          const feat = findFeatData(name);
          return feat?.category === "FS" || /^fighting style/i.test(name);
        })
        .map((name) => String(name).replace(/^Fighting Style:\s*/i, ""))
        .map(normalizeName);
    }

    function hasFightingStyle(name) {
      const target = normalizeName(name);
      return selectedFightingStyleNames().some((style) => style === target || style.endsWith(` ${target}`));
    }

    function fightingStyleAttackBonus(item) {
      if (hasFightingStyle("archery") && itemTypeAbbreviation(item) === "R") return 2;
      return 0;
    }

    function fightingStyleDamageBonus(item, slot) {
      let bonus = 0;
      if (hasFightingStyle("dueling")
        && slot === "mainHand"
        && itemTypeAbbreviation(item) !== "R"
        && !hasItemProperty(item, "2H")
        && !isWeaponItem(equippedInSlot("offHand")?.item)) {
        bonus += 2;
      }
      if (hasFightingStyle("thrown weapon fighting") && hasItemProperty(item, "T")) bonus += 2;
      return bonus;
    }

    function equippedArmorWithoutProficiency() {
      return equippedEntries()
        .some(({ item, record }) => ["armor", "offHand"].includes(record.slot) && (isArmorItem(item) || isShieldItem(item)) && !hasEquipmentProficiency(item));
    }

    function armorProficiencyPenaltyText() {
      if (!equippedArmorWithoutProficiency()) return "";
      return "Armor/shield sin proficiency: tenes desventaja en D20 Tests que usen STR o DEX, y no podes castear spells.";
    }

    function weaponAttackSelection(entry, item, slot) {
      const ability = weaponAbilityModifier(item);
      const proficient = hasEquipmentProficiency(item);
      const armorPenalty = equippedArmorWithoutProficiency();
      const prof = proficient ? proficiencyBonus() : 0;
      const offHandAbilityBonus = slot === "offHand" && hasFightingStyle("two-weapon fighting") ? ability : 0;
      const damageBonus = (slot === "offHand" ? offHandAbilityBonus : ability) + fightingStyleDamageBonus(item, slot);
      const record = equippedRecord(equipmentItemKey(entry));
      const damageDice = record?.twoHanded && item.dmg2 ? item.dmg2 : item.dmg1 || "1d4";
      const damageExpression = `${damageDice}${damageBonus ? formatModifier(damageBonus) : ""}`;
      return {
        name: `${item.name || entry.displayName}${record?.twoHanded ? " (2M)" : slot === "offHand" ? " (Off)" : ""}`,
        damage: damageExpression,
        damageLabel: damageExpression,
        damageType: (DAMAGE_TYPE_NAMES[item.dmgType] || item.dmgType || "").toLowerCase(),
        description: itemDescriptionText(item),
        attackBonus: ability + prof + fightingStyleAttackBonus(item),
        attackLabel: [
          proficient ? "weapon attack" : "sin prof",
          fightingStyleAttackBonus(item) ? "Archery" : "",
          fightingStyleDamageBonus(item, slot) ? "Dueling" : "",
          armorPenalty ? "desventaja por armadura/shield sin prof" : ""
        ].filter(Boolean).join(", "),
        level: 0
      };
    }

    function equippedWeaponAttackSelections() {
      return equippedEntries()
        .filter(({ item, record }) => isWeaponItem(item) && ["mainHand", "offHand"].includes(record.slot))
        .map(({ entry, item, record }) => weaponAttackSelection(entry, item, record.slot));
    }

    function sneakAttackDamageExpression() {
      return `${Math.min(10, Math.max(1, Math.ceil(getCharacterLevel() / 2)))}d6`;
    }

    function magicCoinDamageExpression() {
      const level = getCharacterLevel();
      const dice = level >= 14 ? 3 : level >= 6 ? 2 : 1;
      return `${dice}d12+1`;
    }

    function featureGrantedAttackSelections() {
      const rows = [];
      const entries = generatedFeaturesAndTraitsEntries();
      const seen = new Set();
      entries.forEach((entry) => {
        if (entry.type === "raceChoice" || entry.type === "raceChoiceControl") return;
        const description = String(entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || "") || "");
        const title = entry.feature?.name || entry.optionalFeature?.name || entry.title || "";
        const key = normalizeName(`${title}:${description.slice(0, 80)}`);
        if (seen.has(key)) return;
        seen.add(key);
        const usesMax = featureUseMaximum(title, description);
        const resourceKey = activationKeyForEntry(entry);

        if (normalizeName(title).includes("sneak attack")) {
          const damage = sneakAttackDamageExpression();
          rows.push({
            kind: "feature",
            key: resourceKey,
            name: title,
            damage,
            damageLabel: damage,
            damageType: "",
            description,
            attackBonus: null,
            attackLabel: "danio extra de Rogue",
            noAttackRoll: true,
            usesMax,
            level: 0
          });
          return;
        }

        if (normalizeName(title) === "magic coin") {
          const damage = magicCoinDamageExpression();
          rows.push({
            kind: "feature",
            key: resourceKey,
            name: title,
            damage,
            damageLabel: `1 + ${damage.replace(/\+1$/, "")}`,
            damageType: "bludgeoning + thunder",
            description,
            attackBonus: getSpellAttackBonus(),
            attackLabel: "ranged spell attack, CHA",
            usesMax,
            level: 0
          });
          return;
        }

        if (/\bspell attack\b/i.test(description) && !/\byour spellcasting ability\b/i.test(description)) {
          rows.push({
            kind: "feature",
            key: resourceKey,
            name: title || "Spellcasting",
            damage: "",
            damageLabel: "--",
            damageType: "",
            description,
            attackBonus: getSpellAttackBonus(),
            attackLabel: "spell attack",
            usesMax,
            level: 0
          });
          return;
        }

        if (!/\battack\b/i.test(description)) return;
        const damageMatch = description.match(/\b(\d+d\d+(?:\s*[+-]\s*\d+)?)\b[^.]{0,80}\b(acid|bludgeoning|cold|fire|force|lightning|necrotic|piercing|poison|psychic|radiant|slashing|thunder)\b/i);
        if (!damageMatch) return;
        rows.push({
          kind: "feature",
          key: resourceKey,
          name: title,
          damage: damageMatch[1].replace(/\s+/g, ""),
          damageLabel: damageMatch[1].replace(/\s+/g, ""),
          damageType: damageMatch[2].toLowerCase(),
          description,
          attackBonus: /\bspell attack\b/i.test(description) ? getSpellAttackBonus() : getUnarmedAttackBonus(),
          attackLabel: /\bspell attack\b/i.test(description) ? "feature spell attack" : "feature attack",
          usesMax,
          level: 0
        });
      });
      return rows;
    }

    function activeFeatureState() {
      if (!sheetMeta.activeFeatures || typeof sheetMeta.activeFeatures !== "object") sheetMeta.activeFeatures = {};
      return sheetMeta.activeFeatures;
    }

    function featureUseState() {
      if (!sheetMeta.featureUses || typeof sheetMeta.featureUses !== "object") sheetMeta.featureUses = {};
      return sheetMeta.featureUses;
    }

    function abilityModifierByName(name) {
      const key = {
        strength: "STR",
        dexterity: "DEX",
        constitution: "CON",
        intelligence: "INT",
        wisdom: "WIS",
        charisma: "CHA"
      }[normalizeName(name)];
      return key ? abilityModifier(getFieldByKey(key)?.value || "") : null;
    }

    function featureUseMaximum(title, description) {
      const text = `${title}\n${description}`;
      const normalizedTitle = normalizeName(title);
      if (normalizedTitle.includes("bardic inspiration")) {
        return Math.max(1, abilityModifier(getFieldByKey("CHA")?.value || "") ?? 0);
      }
      if (/\bluck points?\b/i.test(text) && /\bequal to your .*proficiency bonus\b/i.test(text)) {
        return proficiencyBonus();
      }
      const luckPointMatch = text.match(/\byou have\s+(\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+luck points?\b/i);
      if (luckPointMatch) return countWordToNumber(luckPointMatch[1]);
      if (/\bnumber of times equal to your (?:variantrule )?proficiency\b|\btimes equal to your proficiency bonus\b/i.test(text)) {
        return proficiencyBonus();
      }
      const abilityMatch = text.match(/\bnumber of times equal to your (Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma) modifier(?:\s*\(minimum of once\))?/i)
        || text.match(/\btimes equal to your (Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma) modifier(?:\s*\(minimum of once\))?/i);
      if (abilityMatch) {
        const modifier = abilityModifierByName(abilityMatch[1]);
        if (modifier == null) return null;
        return /minimum of once/i.test(abilityMatch[0]) ? Math.max(1, modifier) : Math.max(0, modifier);
      }
      const numericMatch = text.match(/\byou can use (?:this feature|this benefit|this reaction|this bonus action)[^.]{0,80}\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten) times\b/i);
      if (numericMatch) return countWordToNumber(numericMatch[1]);
      const poolMatch = text.match(/\byou have a pool of (\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+d\d+s\b/i);
      if (poolMatch) return countWordToNumber(poolMatch[1]);
      if (/\bonce (?:you(?:'ve| have)? )?(?:use|used|cast|expend)[^.]{0,140}\b(?:can't|can(?:not)?t|regain|must finish)/i.test(text)
        || /\bcan't (?:use|cast|do so)[^.]{0,120}\buntil you finish\b/i.test(text)
        || /\bregain the ability to (?:cast|use)[^.]{0,80}\bwhen you finish\b/i.test(text)) {
        return 1;
      }
      return null;
    }

    function featureUseInfo(row) {
      const max = Number.parseInt(row?.usesMax, 10);
      if (!Number.isFinite(max) || max <= 0 || !row?.key) return null;
      const state = featureUseState();
      const spent = Math.max(0, Math.min(max, Number.parseInt(state[row.key] || "0", 10) || 0));
      return { max, spent, remaining: max - spent };
    }

    function magicInitiateFreeUseInfo(spellName) {
      const grant = magicInitiateGrantForSpell(spellName);
      if (!grant?.prepared || grant.level !== 1 || !grant.key) return null;
      const state = featureUseState();
      const spent = Math.max(0, Math.min(1, Number.parseInt(state[grant.key] || "0", 10) || 0));
      return { key: grant.key, max: 1, spent, remaining: 1 - spent, grant };
    }

    function spendMagicInitiateFreeUse(spellName) {
      const info = magicInitiateFreeUseInfo(spellName);
      if (!info || info.remaining <= 0) return false;
      const state = featureUseState();
      state[info.key] = info.spent + 1;
      showStatus(`${spellName}: casteada por Magic Initiate. Uso gratis: 0/1`);
      updatePreparedSpellsPanel();
      scheduleSave();
      return true;
    }

    function activationKeyForEntry(entry) {
      const source = entry.feature || entry.optionalFeature || {};
      return [
        source.className || entry.meta || "feature",
        source.source || "",
        source.level || "",
        source.name || entry.title
      ].map((item) => normalizeName(String(item))).join("|");
    }

    function isActivatableFeature(entry) {
      if (entry.type === "raceChoice" || entry.type === "raceChoiceControl") return false;
      const title = entry.feature?.name || entry.optionalFeature?.name || entry.title || "";
      const description = String(entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || "") || "");
      const text = `${title}\n${description}`;
      if (normalizeName(title).includes("arcane recovery")) return false;
      const hasAttackDamage = /\battack\b/i.test(text) && /\b\d+d\d+(?:\s*[+-]\s*\d+)?\b/i.test(text);
      if (/\bspellcasting\b|\bpact magic\b|\bspell attack\b/i.test(text) || hasAttackDamage) return false;
      return /\b(action|bonus action|reaction)\b|\bwhile active\b|\bactivate\b|\benter (?:it|your)\b|\buse this feature\b|\bexpend\b/i.test(text);
    }

    function featureActivationSelections() {
      return generatedFeaturesAndTraitsEntries()
        .filter(isActivatableFeature)
        .map((entry) => {
          const key = activationKeyForEntry(entry);
          const title = entry.feature?.name || entry.optionalFeature?.name || entry.title || "Feature";
          const description = entry.description || flattenEntryText(entry.feature?.entries || entry.optionalFeature?.entries || "");
          return {
            kind: "activation",
            key,
            name: title.replace(/^Level \d+:\s*/i, ""),
            damage: "",
            damageLabel: "--",
            damageType: "",
            description,
            active: Boolean(activeFeatureState()[key]),
            usesMax: featureUseMaximum(title, description),
            level: 0
          };
        });
    }

    function featResourceSelections() {
      return activeFeatData()
        .map((feat) => {
          if (isMagicInitiateFeat(feat)) return null;
          const description = flattenEntryText(feat.entries || "");
          const usesMax = featureUseMaximum(feat.name, description);
          if (!usesMax) return null;
          return {
            kind: "activation",
            resourceOnly: true,
            key: ["feat", feat.source || "", "", feat.name || ""].map((item) => normalizeName(String(item))).join("|"),
            name: feat.name,
            damage: "",
            damageLabel: "--",
            damageType: "",
            description,
            active: false,
            usesMax,
            level: 0
          };
        })
        .filter(Boolean);
    }

    function toggleFeatureActivation(row) {
      const state = activeFeatureState();
      state[row.key] = !state[row.key];
      showStatus(`${row.name}: ${state[row.key] ? "activo" : "inactivo"}`);
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function expendFeatureUse(row) {
      const info = featureUseInfo(row);
      if (!info) return;
      if (info.remaining <= 0) {
        showStatus(`${row.name}: sin usos restantes`);
        return;
      }
      const state = featureUseState();
      state[row.key] = info.spent + 1;
      const nextRemaining = info.remaining - 1;
      showStatus(`${row.name}: ${nextRemaining}/${info.max} usos restantes`);
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function castPreparedSpell(spell) {
      if (!spell || spell.kind !== "spell") return;
      if (spell.level <= 0) {
        showStatus(`${spell.name}: cantrip, no gasta spell slot`);
        return;
      }
      const sourceName = spell.sourceName || spell.name;
      if (magicInitiateFreeUseInfo(sourceName)?.remaining > 0 && spendMagicInitiateFreeUse(sourceName)) return;
      if (!spendSpellSlot(spell.level)) {
        showStatus(`Sin slots nivel ${spell.level}`);
        return;
      }
      const remaining = spellSlotRemaining(spell.level);
      const total = spellSlotTotal(spell.level);
      showStatus(`${spell.name} casteada. Slots nivel ${spell.level}: ${remaining}/${total}`);
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function rollDiceExpression(expression) {
      const match = expression.match(/^(\d+)d(\d+)([+-]\d+)?$/i);
      if (!match) return null;
      const count = Number.parseInt(match[1], 10);
      const sides = Number.parseInt(match[2], 10);
      const bonus = Number.parseInt(match[3] || "0", 10);
      if (!Number.isFinite(count) || !Number.isFinite(sides) || count < 1 || count > 40 || sides < 2) return null;
      const rolls = Array.from({ length: count }, () => rollDie(sides));
      const total = rolls.reduce((sum, roll) => sum + roll, bonus);
      return { total, rolls, bonus };
    }

    function formatDiceLines(lines = []) {
      return lines.filter(Boolean).join("\n");
    }

    function d20RollDetail(d20, parts, total) {
      const cleanParts = parts.filter((part) => Number.isFinite(part.value) && part.value !== 0);
      return formatDiceLines([
        `Tirada: d20 = ${d20}`,
        ...cleanParts.map((part) => `${part.label}: ${formatModifier(part.value)}`),
        `Total: ${[d20, ...cleanParts.map((part) => part.value)].map((value, index) => index === 0 ? String(value) : formatModifier(value)).join(" ")} = ${total}`
      ]);
    }

    function attackRollParts(bonus, label) {
      const prof = parseSignedNumber(getFieldValueByNormalizedKey("profbonus"));
      const spellAttack = getSpellAttackBonus();
      if (/spell/i.test(label || "") && spellAttack === bonus) {
        const ability = bonus - prof;
        return [
          { label: "Mod. spellcasting", value: ability },
          { label: "Proficiency", value: prof }
        ];
      }
      if (/unarmed/i.test(label || "") && getUnarmedAttackBonus() === bonus) {
        return [
          { label: "STR mod", value: getStrengthModifier() },
          { label: "Proficiency", value: prof }
        ];
      }
      if (/sin prof/i.test(label || "")) return [{ label: "Ability mod", value: bonus }];
      if (prof && Math.abs(bonus - prof) <= 10) {
        return [
          { label: "Ability mod", value: bonus - prof },
          { label: "Proficiency", value: prof }
        ];
      }
      return [{ label: "Attack bonus", value: bonus }];
    }

    function showDiceTray(title, result, detail) {
      diceTitle.textContent = title;
      diceResult.textContent = result;
      diceDetail.textContent = detail;
      diceTray.classList.add("visible");
      clearTimeout(diceTimer);
      diceTimer = setTimeout(() => diceTray.classList.remove("visible"), 12000);
    }

    function rollAttack(attackName, bonus, label) {
      const d20 = rollDie(20);
      const total = d20 + bonus;
      const detail = d20RollDetail(d20, attackRollParts(bonus, label), total);
      showDiceTray(`${attackName}: ataque`, String(total), formatDiceLines([detail, label ? `Nota: ${label}` : ""]));
    }

    function rollD20Check(label, modifier) {
      const d20 = rollDie(20);
      const total = d20 + modifier;
      showDiceTray(label, String(total), d20RollDetail(d20, [{ label: "Modificador", value: modifier }], total));
    }

    function rollDamage(attackName, expression, damageType) {
      if (expression === "unarmed") {
        const strengthModifier = getStrengthModifier();
        const total = Math.max(0, 1 + strengthModifier);
        showDiceTray(`${attackName}: danio`, String(total), formatDiceLines([
          "Base: 1",
          `STR mod: ${formatModifier(strengthModifier)}`,
          `Total: max(0, 1 ${formatModifier(strengthModifier)}) = ${total}`,
          damageType ? `Tipo: ${damageType}` : ""
        ]));
        return;
      }
      const roll = rollDiceExpression(expression);
      if (!roll) {
        showDiceTray(`${attackName}: danio`, "N/A", "No encontre dados de danio en la descripcion.");
        return;
      }
      showDiceTray(`${attackName}: danio`, String(roll.total), formatDiceLines([
        `Dados: ${expression}`,
        `Tiradas: ${roll.rolls.join(" + ")} = ${roll.rolls.reduce((sum, value) => sum + value, 0)}`,
        roll.bonus ? `Bonus fijo: ${formatModifier(roll.bonus)}` : "",
        `Total: ${roll.rolls.reduce((sum, value) => sum + value, 0)}${roll.bonus ? ` ${formatModifier(roll.bonus)}` : ""} = ${roll.total}`,
        damageType ? `Tipo: ${damageType}` : ""
      ]));
    }

    function preparedAttackSelections() {
      const strengthModifier = getStrengthModifier();
      const unarmed = {
        name: "Ataque desarmado",
        damage: "unarmed",
        damageLabel: `1${formatModifier(strengthModifier)}`,
        damageType: "bludgeoning",
        description: "Melee weapon attack using Strength. Hit: bludgeoning damage equal to 1 + your Strength modifier.",
        attackBonus: getUnarmedAttackBonus(),
        attackLabel: "unarmed strike",
        level: -1
      };
      const preparedSpells = [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .filter((field) => {
          if (!field.value.trim()) return false;
          if (Number(field.dataset.spellLevel) === 0) return true;
          if (isBardCharacter()) return true;
          const checkbox = getFieldByKey(field.dataset.preparedKey);
          return checkbox?.checked;
        })
        .flatMap((field) => {
          const spellName = field.value.trim();
          return spellAttackSelections(spellName, Number(field.dataset.spellLevel));
        });
      const preparedSpellNames = new Set([...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .map((field) => field.value.trim())
        .filter(Boolean)
        .map(normalizeName));
      const autoPreparedSpells = autoAlwaysPreparedSpellNames()
        .filter((spellName) => !preparedSpellNames.has(normalizeName(spellName)))
        .flatMap((spellName) => {
          const spell = findSpellByName(spellName);
          return spellAttackSelections(spellName, spell?.level ?? 1);
        });
      const allPreparedSpells = [...preparedSpells, ...autoPreparedSpells]
        .sort((a, b) => a.level - b.level || a.name.localeCompare(b.name));
      const attacks = mainHandUsesTwoHands()
        ? []
        : [unarmed];
      return [...attacks, ...equippedWeaponAttackSelections(), ...featureGrantedAttackSelections(), ...featureActivationSelections(), ...featResourceSelections(), ...allPreparedSpells];
    }

    function updatePreparedSpellsPanel() {
      if (!preparedSpellsPanel) return;
      preparedSpellsPanel.textContent = "";
      const preparedAttacks = preparedAttackSelections();
      preparedAttacks.forEach((spell) => {
        const row = document.createElement("div");
        row.className = "prepared-spell-row";

        const name = document.createElement("div");
        name.className = "prepared-spell-name";
        name.textContent = spell.name;
        name.title = spell.description;
        name.tabIndex = 0;
        name.setAttribute("role", "button");
        name.addEventListener("click", () => showSpellDrawer(spell.sourceName || spell.name));
        name.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          showSpellDrawer(spell.sourceName || spell.name);
        });

        const damageType = document.createElement("div");
        damageType.className = "prepared-spell-damage-type";
        damageType.tabIndex = 0;
        damageType.textContent = damageTypeSymbol(spell.damageType);
        damageType.setAttribute("aria-label", spell.damageType || "Sin tipo de danio detectado");
        damageType.addEventListener("mouseenter", () => showDamageTooltip(damageType, spell.damageType));
        damageType.addEventListener("mouseleave", hideDamageTooltip);
        damageType.addEventListener("focus", () => showDamageTooltip(damageType, spell.damageType));
        damageType.addEventListener("blur", hideDamageTooltip);

        const attackButton = document.createElement("button");
        attackButton.type = "button";
        attackButton.className = "dice-button";
        if (spell.kind === "activation" && spell.resourceOnly) {
          attackButton.textContent = "-";
          attackButton.title = `${spell.name} usa el contador de cargas`;
          attackButton.disabled = true;
        } else if (spell.kind === "activation") {
          attackButton.textContent = spell.active ? "Activo" : "Activar";
          attackButton.title = `${spell.active ? "Desactivar" : "Activar"} ${spell.name}`;
          attackButton.classList.toggle("active", spell.active);
          attackButton.addEventListener("click", () => toggleFeatureActivation(spell));
        } else if (spell.noAttackRoll) {
          attackButton.textContent = "-";
          attackButton.title = `${spell.name} no requiere tirada de ataque propia`;
          attackButton.disabled = true;
        } else {
          attackButton.textContent = "d20";
          attackButton.title = `Tirar ataque para ${spell.name}`;
          attackButton.addEventListener("click", () => rollAttack(spell.name, spell.attackBonus, spell.attackLabel));
        }

        const castButton = document.createElement("button");
        castButton.type = "button";
        castButton.className = "dice-button";
        if (spell.kind === "spell") {
          const sourceName = spell.sourceName || spell.name;
          const magicInitiateUse = spell.level > 0 ? magicInitiateFreeUseInfo(sourceName) : null;
          const hasFreeUse = Boolean(magicInitiateUse && magicInitiateUse.remaining > 0);
          castButton.textContent = spell.level > 0
            ? hasFreeUse ? `Gratis ${magicInitiateUse.remaining}/${magicInitiateUse.max}` : "Cast"
            : "Libre";
          castButton.title = spell.level > 0
            ? hasFreeUse
              ? `Castear ${spell.name} con el uso gratis de Magic Initiate`
              : `Castear ${spell.name} y gastar 1 slot nivel ${spell.level}`
            : `${spell.name} es cantrip y no gasta slots`;
          castButton.disabled = spell.level > 0 && !hasFreeUse && spellSlotRemaining(spell.level) <= 0;
          castButton.addEventListener("click", () => castPreparedSpell(spell));
        } else if ((spell.kind === "activation" || spell.kind === "feature") && featureUseInfo(spell)) {
          const uses = featureUseInfo(spell);
          castButton.textContent = `${uses.remaining}/${uses.max}`;
          castButton.title = `Gastar uso de ${spell.name}. Restantes: ${uses.remaining}/${uses.max}`;
          castButton.disabled = uses.remaining <= 0;
          castButton.addEventListener("click", () => expendFeatureUse(spell));
        } else {
          castButton.textContent = "-";
          castButton.disabled = true;
        }

        const damageButton = document.createElement("button");
        damageButton.type = "button";
        damageButton.className = "dice-button";
        damageButton.textContent = spell.damageLabel || "--";
        damageButton.title = spell.damageLabel ? `Tirar danio ${spell.damageLabel} ${spell.damageType}`.trim() : "Sin dados de danio detectados";
        if (spell.kind === "activation") damageButton.disabled = true;
        else if (!spell.damage) damageButton.disabled = true;
        else damageButton.addEventListener("click", () => rollDamage(spell.name, spell.damage || "", spell.damageType));

        row.append(name, damageType, castButton, attackButton, damageButton);
        preparedSpellsPanel.appendChild(row);
      });
    }

    function pruneUnavailableSpellSelections() {
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach((field) => {
        const level = Number(field.dataset.spellLevel);
        if (isAutoGrantedSpellField(field)) return;
        if (!field.value.trim() || canUseSpellLevel(level)) return;
        field.value = "";
        syncFeatPreparedSpellCheckbox(field);
      });
    }

    function pruneInvalidSpellSourceSelections() {
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach((field) => {
        if (!field.value.trim() || isAutoGrantedSpellField(field)) return;
        const spell = findSpellByName(field.value);
        const level = Number(field.dataset.spellLevel);
        if (spell && spellMatchesSelection(spell, level)) return;
        field.value = "";
        syncFeatPreparedSpellCheckbox(field);
      });
    }

    function pruneDuplicateSpellSelections() {
      const seen = new Set();
      [...document.querySelectorAll(".field.select[data-option-type='spell']")]
        .sort((a, b) => Number(isAutoGrantedSpellField(b)) - Number(isAutoGrantedSpellField(a)))
        .forEach((field) => {
        const normalized = normalizeName(field.value || "");
        if (!normalized) return;
        if (!seen.has(normalized)) {
          seen.add(normalized);
          return;
        }
        if (isAutoGrantedSpellField(field)) return;
        field.value = "";
      });
    }

    function pruneOverLimitSpellSelections() {
      if (isWizardCharacter() || isBardCharacter()) return;
      const usedByLevel = new Map();
      document.querySelectorAll(".field.select[data-option-type='spell']").forEach((field) => {
        const level = Number(field.dataset.spellLevel);
        if (!field.value.trim()) return;
        if (isAutoGrantedSpellField(field)) return;
        const used = usedByLevel.get(level) || 0;
        if (used >= getSpellLevelLimit(level)) {
          field.value = "";
          syncFeatPreparedSpellCheckbox(field);
          return;
        }
        usedByLevel.set(level, used + 1);
      });
    }

    function handleSpellAvailabilityChange(event) {
      const key = event.target?.dataset?.key?.trim().toLowerCase();
      if (!["characterlevel", "spellcasting class 2", "classlevel"].includes(key)) return;
      updateSpellcastingFields({ syncClass: key === "classlevel" });
      updateSpellSlots();
      pruneUnavailableSpellSelections();
      syncAutoCantrips();
      pruneInvalidSpellSourceSelections();
      pruneWizardSpellSelectionsFromSpellbook();
      pruneDuplicateSpellSelections();
      pruneOverLimitSpellSelections();
      updatePreparedSpellsPanel();
      scheduleSave();
    }

    function resolveSelectOptions(field) {
      if (field.dataset.optionType === "spell") return getSpellOptions(Number(field.dataset.spellLevel), field);
      return fieldOptions.get(field.dataset.optionType) || [];
    }

    function optionName(option) {
      if (!option) return "";
      return typeof option === "string" ? option : option.name || "";
    }

    function rawOptionDescriptionText(option) {
      if (!option || typeof option === "string") return "";
      return option.description || "";
    }

    function optionDescriptionText(option) {
      if (!option || typeof option === "string") return "";
      const rawDescription = rawOptionDescriptionText(option);
      if (activeSelectField?.dataset.optionType === "class") return classDescriptionText(optionName(option), rawDescription);
      if (activeSelectField?.dataset.optionType === "race") return raceDescriptionText(optionName(option), rawDescription);
      if (activeSelectField?.dataset.optionType === "background") return backgroundDescriptionText(optionName(option), rawDescription);
      if (activeSelectField?.dataset.optionType === "level") return levelDescriptionText(Number(optionName(option)));
      return rawDescription;
    }

    function splitDescriptionLines(description) {
      return description
        .replace(/\s+(Age|Alignment|Size|Speed|Flight|Source|Hit Die|Armor|Weapons|Saving Throws|Skills|Equipment|Starting Equipment|Spellcasting|Cantrips|Prepared Spells|Spell Slots|Features|Level Summary|Ability Scores|Feat|Skill Proficiencies|Tool Proficiencies|Languages):/g, "\n$1:")
        .split(/\n|(?<=[.!?])\s+(?=[A-Z])/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function setOptionDescription(option) {
      const name = optionName(option);
      const description = optionDescriptionText(option) || "No hay descripcion disponible.";
      optionDescription.textContent = "";
      optionDescription.scrollTop = 0;

      const title = document.createElement("div");
      title.className = "option-description-title";
      title.textContent = name;
      optionDescription.appendChild(title);

      splitDescriptionLines(description).forEach((line) => {
        const body = document.createElement("p");
        body.className = "option-description-line";
        body.textContent = line;
        optionDescription.appendChild(body);
      });

      if (activeSelectField?.dataset.optionType === "background") {
        renderBackgroundChoiceControls(option).forEach((control) => optionDescription.appendChild(control));
      }
      if (activeSelectField?.dataset.optionType === "class") {
        renderClassChoiceControls(option).forEach((control) => optionDescription.appendChild(control));
      }
    }

    function filterListRows(rows, query, emptyNode = null) {
      const normalizedQuery = normalizeName(query || "");
      let visibleCount = 0;
      rows.forEach((row) => {
        const matches = !normalizedQuery || normalizeName(row.textContent || "").includes(normalizedQuery);
        row.style.display = matches ? "" : "none";
        if (matches) visibleCount += 1;
      });
      if (emptyNode) emptyNode.style.display = visibleCount > 0 ? "none" : "";
    }

    function createListSearchInput(rows, placeholder = "Buscar...") {
      const search = document.createElement("input");
      search.type = "search";
      search.className = "list-search";
      search.placeholder = placeholder;
      search.setAttribute("aria-label", placeholder);
      const empty = document.createElement("div");
      empty.className = "list-search-empty";
      empty.textContent = "Sin resultados.";
      empty.style.display = "none";
      search.addEventListener("input", () => filterListRows(rows, search.value, empty));
      return { search, empty };
    }

    function appendSearchableList(parent, rows, placeholder = "Buscar...") {
      const { search, empty } = createListSearchInput(rows, placeholder);
      parent.appendChild(search);
      const list = document.createElement("div");
      list.className = "spell-picker-list";
      rows.forEach((row) => list.appendChild(row));
      parent.appendChild(list);
      parent.appendChild(empty);
      return { search, list, empty };
    }

    function appendCollapsibleSection(parent, title, { collapsed = false, stateKey = "" } = {}) {
      const section = document.createElement("section");
      section.className = "collapsible-section";
      const startsCollapsed = stateKey in collapsibleSectionState ? collapsibleSectionState[stateKey] : collapsed;
      section.classList.toggle("collapsed", startsCollapsed);

      const trigger = document.createElement("button");
      trigger.type = "button";
      trigger.className = "collapsible-trigger";
      const label = document.createElement("span");
      label.textContent = title;
      const icon = document.createElement("span");
      icon.className = "collapsible-icon";
      const syncIcon = () => {
        const isCollapsed = section.classList.contains("collapsed");
        icon.textContent = isCollapsed ? "+" : "-";
        trigger.setAttribute("aria-expanded", String(!isCollapsed));
      };
      trigger.addEventListener("click", () => {
        section.classList.toggle("collapsed");
        if (stateKey) collapsibleSectionState[stateKey] = section.classList.contains("collapsed");
        syncIcon();
      });
      trigger.append(label, icon);

      const body = document.createElement("div");
      body.className = "collapsible-body";
      section.append(trigger, body);
      parent.appendChild(section);
      syncIcon();
      return body;
    }

    function appendSpellLevelGroups(parent, spellsForRows, rowFactory, statePrefix, searchPrefix = "Buscar spell") {
      const grouped = new Map();
      spellsForRows.forEach((spell) => {
        const level = Number(spell?.level || 0);
        if (!grouped.has(level)) grouped.set(level, []);
        grouped.get(level).push(spell);
      });

      [...grouped.entries()]
        .sort(([a], [b]) => a - b)
        .forEach(([level, levelSpells]) => {
          const title = level === 0 ? `Cantrips (${levelSpells.length})` : `Nivel ${level} (${levelSpells.length})`;
          const body = appendCollapsibleSection(parent, title, {
            collapsed: level !== 1,
            stateKey: `${statePrefix}:level-${level}`
          });
          appendSearchableList(
            body,
            levelSpells
              .sort((a, b) => a.name.localeCompare(b.name))
              .map(rowFactory),
            `${searchPrefix} nivel ${level}...`
          );
        });
    }

    function positionOptionMenu(field) {
      const rect = field.getBoundingClientRect();
      const margin = 8;
      const menuWidth = Math.min(720, window.innerWidth - 24);
      const menuHeight = field.dataset.optionType === "spell" ? 560 : 380;
      const availableHeight = window.innerHeight - 24;
      const visibleMenuHeight = Math.min(menuHeight, availableHeight);
      const left = Math.min(Math.max(margin, rect.left), window.innerWidth - menuWidth - margin);
      const spaceBelow = window.innerHeight - rect.bottom - margin;
      const top = spaceBelow >= visibleMenuHeight
        ? rect.bottom + 2
        : Math.max(margin, Math.min(rect.top, window.innerHeight - visibleMenuHeight - margin));

      optionMenu.style.left = `${left}px`;
      optionMenu.style.top = `${top}px`;
      optionMenu.style.width = `${Math.max(menuWidth, rect.width)}px`;
    }

    function closeOptionMenu() {
      optionMenu.hidden = true;
      optionList.textContent = "";
      optionDescription.textContent = "";
      optionMenu.classList.remove("spell-option-menu", "cantrip-option-menu");
      activeSelectField = null;
    }

    function openOptionMenu(field) {
      if (isAutoGrantedSpellField(field)) {
        showStatus("Esta magia la otorga tu personaje y no se puede quitar desde la lista.");
        return;
      }
      const options = resolveSelectOptions(field);
      if (field.dataset.optionType === "spell") {
        const level = Number(field.dataset.spellLevel);
        if (!canUseSpellLevel(level)) {
          showStatus(`Nivel de spell ${level} no disponible para tu nivel`);
          return;
        }
        const limit = getSpellLevelLimit(level);
        const used = getSelectedSpellCount(level, field);
        if (!field.value.trim() && used >= limit) {
          showStatus(level === 0 ? "Limite de cantrips alcanzado" : `Limite de spells nivel ${level} alcanzado`);
          return;
        }
      }

      activeSelectField = field;
      optionMenu.classList.toggle("spell-option-menu", field.dataset.optionType === "spell");
      optionMenu.classList.toggle("cantrip-option-menu", field.dataset.optionType === "spell" && Number(field.dataset.spellLevel) === 0);
      optionList.textContent = "";
      const optionItems = [];
      if (!options.length) {
        const emptyItem = document.createElement("div");
        emptyItem.className = "option-empty";
        emptyItem.textContent = "No hay opciones para el filtro actual.";
        optionList.appendChild(emptyItem);
        setOptionDescription({ name: "Sin opciones", description: "Elegi una clase o raza compatible, o usa otra seccion de nivel de spell." });
      }
      options.forEach((option, index) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = `option-item ${field.value === optionName(option) ? "active" : ""}`;
        item.textContent = optionName(option);
        item.addEventListener("mouseenter", () => setOptionDescription(option));
        item.addEventListener("focus", () => setOptionDescription(option));
        item.addEventListener("click", () => {
          if (field.dataset.optionType === "spell" && isSpellAlreadySelected(optionName(option), field)) {
            showStatus("Esa magia ya esta seleccionada");
            closeOptionMenu();
            return;
          }
          if (field.dataset.optionType === "spell") {
            const level = Number(field.dataset.spellLevel);
            const limit = getSpellLevelLimit(level);
            if (!field.value.trim() && getSelectedSpellCount(level, field) >= limit) {
              showStatus(level === 0 ? "Limite de cantrips alcanzado" : `Limite de spells nivel ${level} alcanzado`);
              closeOptionMenu();
              return;
            }
          }
          field.value = optionName(option);
          if (field.dataset.optionType === "spell") syncFeatPreparedSpellCheckbox(field);
          field.dispatchEvent(new Event("input", { bubbles: true }));
          field.dispatchEvent(new Event("change", { bubbles: true }));
          if (
            (field.dataset.optionType === "background" && findBackgroundChoicesForOption(option).length)
            || (field.dataset.optionType === "race" && findRaceChoicesForOption(option).length)
          ) {
            setOptionDescription(option);
            return;
          }
          closeOptionMenu();
        });
        optionItems.push(item);
        if (index === 0 || field.value === optionName(option)) setOptionDescription(option);
      });
      if (optionItems.length) {
        const { search, empty } = createListSearchInput(optionItems, "Buscar opcion...");
        optionList.appendChild(search);
        optionItems.forEach((item) => optionList.appendChild(item));
        optionList.appendChild(empty);
      }

      optionMenu.hidden = false;
      positionOptionMenu(field);
    }

    function fieldKey(annotation, pageNumber, index) {
      return annotation.fieldName || `page-${pageNumber}-field-${index}`;
    }

    function setPdfRectDataset(element, rect, pageNumber) {
      element.dataset.pageNumber = String(pageNumber);
      element.dataset.pdfX1 = String(Math.min(rect[0], rect[2]));
      element.dataset.pdfY1 = String(Math.min(rect[1], rect[3]));
      element.dataset.pdfX2 = String(Math.max(rect[0], rect[2]));
      element.dataset.pdfY2 = String(Math.max(rect[1], rect[3]));
      element.dataset.pdfCenterX = String((rect[0] + rect[2]) / 2);
      element.dataset.pdfCenterY = String((rect[1] + rect[3]) / 2);
    }

    function makeField(annotation, pageNumber, index, viewport) {
      if (annotation.fieldType === "Btn" && !annotation.checkBox) return null;
      if (annotation.fieldType !== "Tx" && annotation.fieldType !== "Btn") return null;

      const rect = viewport.convertToViewportRectangle(annotation.rect);
      const left = Math.min(rect[0], rect[2]);
      const top = Math.min(rect[1], rect[3]);
      const width = Math.abs(rect[2] - rect[0]);
      const height = Math.abs(rect[3] - rect[1]);
      const isCheckbox = annotation.fieldType === "Btn" && annotation.checkBox;
      const isMultiline = annotation.multiLine && !isCheckbox;
      const key = fieldKey(annotation, pageNumber, index);
      const normalizedKey = key.trim().toLowerCase();
      const selectOptions = getSelectOptions(key, pageNumber, annotation.rect);
      const isSelect = Boolean(selectOptions);
      const element = isSelect
        ? document.createElement("input")
        : isMultiline
          ? document.createElement("textarea")
          : document.createElement("input");

      element.dataset.key = key;
      element.name = key;
      element.title = annotation.fieldName || key;
      element.className = `field ${isCheckbox ? "checkbox" : ""} ${isMultiline ? "textarea" : ""} ${isSelect ? "select" : ""}`;
      if (normalizedKey === "proficiencieslang") element.classList.add("proficiencies-box");
      setPdfRectDataset(element, annotation.rect, pageNumber);
      if (!isCheckbox && isCenteredNumberField(normalizedKey)) element.classList.add("number");
      if (isCheckbox) element.type = "checkbox";
      else if (isSelect) {
        element.type = "text";
        element.readOnly = true;
        if (Array.isArray(selectOptions)) {
          element.dataset.optionType = normalizedKey === "race"
            ? "race"
            : normalizedKey === "background"
              ? "background"
              : normalizedKey === "alignment"
                ? "alignment"
                : "class";
        } else {
          element.dataset.optionType = selectOptions.type;
          element.dataset.spellLevel = String(selectOptions.level);
          element.title = `Spell level ${selectOptions.level}`;
        }
        element.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          if (element.dataset.optionType === "spell") {
            closeOptionMenu();
            showSpellSelectionDrawer(element);
            return;
          }
          openOptionMenu(element);
        });
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " " || event.key === "ArrowDown") {
            event.preventDefault();
            if (element.dataset.optionType === "spell") {
              closeOptionMenu();
              showSpellSelectionDrawer(element);
              return;
            }
            openOptionMenu(element);
          } else if (event.key === "Escape") {
            closeOptionMenu();
          } else if (event.key === "Delete" || event.key === "Backspace") {
            event.preventDefault();
            if (isAutoGrantedSpellField(element)) {
              showStatus("Esta magia la otorga tu personaje y no se puede quitar.");
              return;
            }
            element.value = "";
            syncFeatPreparedSpellCheckbox(element);
            element.dispatchEvent(new Event("input", { bubbles: true }));
            element.dispatchEvent(new Event("change", { bubbles: true }));
            closeOptionMenu();
          }
        });
      } else if (!isMultiline) element.type = "text";

      const fieldSize = isCheckbox ? Math.min(width, height) : null;
      const fieldLeft = isCheckbox ? left + ((width - fieldSize) / 2) : left;
      const fieldTop = isCheckbox ? top + ((height - fieldSize) / 2) : top;
      element.style.left = `${(fieldLeft / viewport.width) * 100}%`;
      element.style.top = `${(fieldTop / viewport.height) * 100}%`;
      const fieldWidth = normalizedKey === "classlevel" ? width * 0.68 : width;
      element.style.width = `${((isCheckbox ? fieldSize : fieldWidth) / viewport.width) * 100}%`;
      element.style.height = `${((isCheckbox ? fieldSize : height) / viewport.height) * 100}%`;
      return element;
    }

    function placeFromPdfRect(element, viewport, pdfRect) {
      const rect = viewport.convertToViewportRectangle(pdfRect);
      const left = Math.min(rect[0], rect[2]);
      const top = Math.min(rect[1], rect[3]);
      const width = Math.abs(rect[2] - rect[0]);
      const height = Math.abs(rect[3] - rect[1]);
      element.style.left = `${(left / viewport.width) * 100}%`;
      element.style.top = `${(top / viewport.height) * 100}%`;
      element.style.width = `${(width / viewport.width) * 100}%`;
      element.style.height = `${(height / viewport.height) * 100}%`;
    }

    function fieldByLayerKey(layer, key) {
      const normalized = key.trim().toLowerCase();
      return [...layer.querySelectorAll(".field")]
        .find((field) => field.dataset.key?.trim().toLowerCase() === normalized) || null;
    }

    function rollModifierFromField(fieldKey) {
      if (fieldKey === "Initiative" && !fieldValue("Initiative")) return parseSignedNumber(fieldValue("DEXmod"));
      return parseSignedNumber(fieldValue(fieldKey));
    }

    function createRollHotspot(layer, viewport, targetFieldKey, label, modifierFieldKey, rectFromField) {
      const target = fieldByLayerKey(layer, targetFieldKey);
      if (!target) return;
      const x1 = Number(target.dataset.pdfX1);
      const y1 = Number(target.dataset.pdfY1);
      const x2 = Number(target.dataset.pdfX2);
      const y2 = Number(target.dataset.pdfY2);
      if (![x1, y1, x2, y2].every(Number.isFinite)) return;

      const rect = rectFromField({ x1, y1, x2, y2 });
      const button = document.createElement("button");
      button.type = "button";
      button.className = "roll-hotspot";
      button.setAttribute("aria-label", `Tirar ${label}`);
      button.title = `Tirar ${label}`;
      button.addEventListener("click", () => rollD20Check(label, rollModifierFromField(modifierFieldKey)));
      placeFromPdfRect(button, viewport, rect);
      layer.appendChild(button);
    }

    function createRollHotspots(layer, viewport) {
      if (layer.dataset.rollHotspotsCreated === "true") return;
      layer.dataset.rollHotspotsCreated = "true";

      Object.entries(DERIVED_STAT_FIELDS).forEach(([ability, config]) => {
        createRollHotspot(
          layer,
          viewport,
          ability,
          `${ability} check`,
          config.modifier,
          ({ x1, y1, x2, y2 }) => [x1 - 4, y1 - 22, x2 + 4, y1 - 4]
        );

        config.saves.forEach((save) => {
          const saveLabel = save.field.replace(/^ST\s+/i, "");
          createRollHotspot(
            layer,
            viewport,
            save.field,
            `${saveLabel} saving throw`,
            save.field,
            ({ x2, y1, y2 }) => [x2 + 4, y1 - 2, x2 + 72, y2 + 2]
          );
        });

        config.skills.forEach((skill) => {
          const skillLabel = skill.field === "Animal" ? "Animal Handling"
            : skill.field === "SleightofHand" ? "Sleight of Hand"
              : skill.field;
          createRollHotspot(
            layer,
            viewport,
            skill.field,
            skillLabel,
            skill.field,
            ({ x2, y1, y2 }) => [x2 + 4, y1 - 2, x2 + 72, y2 + 2]
          );
        });
      });

      createRollHotspot(
        layer,
        viewport,
        "Initiative",
        "Initiative",
        "Initiative",
        ({ x1, y1, x2, y2 }) => [x1 - 4, y1 - 18, x2 + 4, y1 - 4]
      );
    }

    function createAddEquipmentButton(layer, viewport) {
      if (layer.dataset.addEquipmentButtonCreated === "true") return;
      const ppField = fieldByLayerKey(layer, "PP");
      if (!ppField) return;
      layer.dataset.addEquipmentButtonCreated = "true";

      const x1 = Number(ppField.dataset.pdfX1);
      const y1 = Number(ppField.dataset.pdfY1);
      const y2 = Number(ppField.dataset.pdfY2);
      const x2 = Number(ppField.dataset.pdfX2);
      if (![x1, y1, y2, x2].every(Number.isFinite)) return;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "add-equipment-button";
      button.textContent = "+";
      button.title = "Agregar item";
      button.setAttribute("aria-label", "Agregar item");
      button.addEventListener("click", openItemPicker);
      placeFromPdfRect(button, viewport, [x1, y1 - 21, x2, y1 - 3]);
      layer.appendChild(button);
    }

    function createEquipmentPanel(layer) {
      const equipmentField = [...layer.querySelectorAll(".field")]
        .find((field) => field.dataset.key?.trim().toLowerCase() === "equipment");
      if (!equipmentField) return;
      equipmentField.classList.add("equipment-storage");

      const panel = document.createElement("div");
      panel.className = "equipment-panel";
      panel.style.left = equipmentField.style.left;
      panel.style.top = equipmentField.style.top;
      panel.style.width = equipmentField.style.width;
      panel.style.height = equipmentField.style.height;

      const header = document.createElement("div");
      header.className = "equipment-header";
      ["Cant", "Item", "Valor", "", ""].forEach((label) => {
        const cell = document.createElement("div");
        cell.textContent = label;
        header.appendChild(cell);
      });

      const list = document.createElement("div");
      list.className = "equipment-list";
      panel.append(header, list);
      layer.appendChild(panel);
      equipmentPanel = panel;
      updateEquipmentPanel();
    }

    function createPreparedSpellsPanel(layer, viewport) {
      const panel = document.createElement("div");
      panel.className = "prepared-spells-panel";
      panel.dataset.overlay = "prepared-spells";
      placeFromPdfRect(panel, viewport, [221, 226, 390, 401]);
      layer.appendChild(panel);
      preparedSpellsPanel = panel;
      updatePreparedSpellsPanel();
    }

    function linkPreparedSpellFields(layer) {
      const spellFields = [...layer.querySelectorAll(".field.select[data-option-type='spell']")];
      const checkboxes = [...layer.querySelectorAll(".field.checkbox")];
      spellFields.forEach((spellField) => {
        const spellY = Number(spellField.dataset.pdfCenterY);
        const spellX1 = Number(spellField.dataset.pdfX1);
        const spellX2 = Number(spellField.dataset.pdfX2);
        const candidates = checkboxes
          .map((checkbox) => {
            const checkboxY = Number(checkbox.dataset.pdfCenterY);
            const checkboxX = Number(checkbox.dataset.pdfCenterX);
            const rowDistance = Math.abs(checkboxY - spellY);
            const isLeftDot = checkboxX < spellX1 && checkboxX > spellX1 - 18;
            const isRightDot = checkboxX > spellX2 && checkboxX < spellX2 + 34;
            return { checkbox, rowDistance, isLeftDot, isRightDot };
          })
          .filter((candidate) => candidate.rowDistance <= 7 && (candidate.isLeftDot || candidate.isRightDot))
          .sort((a, b) => {
            if (a.isLeftDot !== b.isLeftDot) return a.isLeftDot ? -1 : 1;
            return a.rowDistance - b.rowDistance;
          });
        const preparedCheckbox = candidates[0]?.checkbox;
        if (!preparedCheckbox) return;
        spellField.dataset.preparedKey = preparedCheckbox.dataset.key;
        preparedCheckbox.dataset.spellKey = spellField.dataset.key;
      });
    }

    function makeSyntheticLevelField(viewport) {
      const classLevelRect = [270.043, 728.184, 375.883, 743.841];
      const rect = viewport.convertToViewportRectangle(classLevelRect);
      const left = Math.min(rect[0], rect[2]);
      const top = Math.min(rect[1], rect[3]);
      const width = Math.abs(rect[2] - rect[0]);
      const height = Math.abs(rect[3] - rect[1]);
      const element = document.createElement("input");

      element.dataset.key = "CharacterLevel";
      element.dataset.optionType = "level";
      element.name = "CharacterLevel";
      element.title = "Character Level";
      element.className = "field select number";
      element.type = "text";
      element.readOnly = true;
      element.placeholder = "Lvl";
      element.style.left = `${((left + width * 0.72) / viewport.width) * 100}%`;
      element.style.top = `${(top / viewport.height) * 100}%`;
      element.style.width = `${((width * 0.28) / viewport.width) * 100}%`;
      element.style.height = `${(height / viewport.height) * 100}%`;
      element.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        openOptionMenu(element);
      });
      element.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " " || event.key === "ArrowDown") {
          event.preventDefault();
          openOptionMenu(element);
        } else if (event.key === "Escape") {
          closeOptionMenu();
        } else if (event.key === "Delete" || event.key === "Backspace") {
          event.preventDefault();
          if (isAutoGrantedSpellField(element)) {
            showStatus("Esta magia la otorga tu personaje y no se puede quitar.");
            return;
          }
          element.value = "";
          element.dispatchEvent(new Event("input", { bubbles: true }));
          element.dispatchEvent(new Event("change", { bubbles: true }));
          closeOptionMenu();
        }
      });
      return element;
    }

    function collectData() {
      const data = {};
      document.querySelectorAll(".field").forEach((element) => {
        const key = element.dataset.key;
        if (!key) return;
        data[key] = element.type === "checkbox" ? element.checked : element.value;
      });
      data.__sheetMeta = sheetMeta;
      return data;
    }

    function applyData(data) {
      sheetMeta = data?.__sheetMeta && typeof data.__sheetMeta === "object" ? data.__sheetMeta : { choices: {} };
      if (!sheetMeta.choices || typeof sheetMeta.choices !== "object") sheetMeta.choices = {};
      if (!sheetMeta.currencySources || typeof sheetMeta.currencySources !== "object") sheetMeta.currencySources = {};
      if (typeof sheetMeta.generatedEquipmentText !== "string") sheetMeta.generatedEquipmentText = "";
      if (!sheetMeta.generatedEquipmentSources || typeof sheetMeta.generatedEquipmentSources !== "object") {
        sheetMeta.generatedEquipmentSources = sheetMeta.generatedEquipmentText
          ? { "background:equipment": sheetMeta.generatedEquipmentText }
          : {};
      }
      if (!sheetMeta.equippedItems || typeof sheetMeta.equippedItems !== "object") sheetMeta.equippedItems = {};
      if (!sheetMeta.featureChoices || typeof sheetMeta.featureChoices !== "object") sheetMeta.featureChoices = {};
      if (!sheetMeta.activeFeatures || typeof sheetMeta.activeFeatures !== "object") sheetMeta.activeFeatures = {};
      if (!Array.isArray(sheetMeta.wizardSpellbook)) sheetMeta.wizardSpellbook = [];
      if (!sheetMeta.spellDescriptionTranslations || typeof sheetMeta.spellDescriptionTranslations !== "object") sheetMeta.spellDescriptionTranslations = {};
      if (!["en", "es"].includes(sheetMeta.spellDescriptionsLanguage)) sheetMeta.spellDescriptionsLanguage = "en";
      if (!sheetMeta.generatedSkillProficiencies || typeof sheetMeta.generatedSkillProficiencies !== "object") sheetMeta.generatedSkillProficiencies = {};
      sheetMeta.characterReady = Boolean(sheetMeta.characterReady);
      sheetMeta.longRestActive = Boolean(sheetMeta.longRestActive);
      document.querySelectorAll(".field").forEach((element) => {
        const key = element.dataset.key;
        if (!data || !(key in data)) return;
        if (element.type === "checkbox") element.checked = Boolean(data[key]);
        else element.value = data[key];
      });
      updateInteractionState();
    }

    let statusTimer;
    function showStatus(text) {
      status.textContent = text;
      status.classList.add("visible");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => status.classList.remove("visible"), 900);
    }

    function isCharacterReady() {
      return Boolean(sheetMeta.characterReady);
    }

    function isLongRestActive() {
      return Boolean(sheetMeta.longRestActive);
    }

    function canModifyCharacterSheet() {
      return !isCharacterReady();
    }

    function canModifySpells() {
      if (isBardCharacter()) return !isCharacterReady();
      return !isCharacterReady() || isLongRestActive();
    }

    function fieldCanChangeWhenReady(field) {
      const key = normalizeName(field?.dataset?.key || "");
      if (!key) return false;
      if (key === "equipment") return true;
      if (["cp", "sp", "ep", "gp", "pp"].includes(key)) return true;
      if (isCurrentHitPointsField(field)) return true;
      if (field?.dataset?.optionType === "spell") return canModifySpells();
      if (field?.dataset?.spellKey || field?.dataset?.preparedKey) return canModifySpells();
      return false;
    }

    function ensureCanModifySpells() {
      if (canModifySpells()) return true;
      showStatus(isBardCharacter()
        ? "Bard solo cambia magias al subir de nivel."
        : "Las magias solo se cambian durante long rest.");
      return false;
    }

    function handleLockedSheetEvent(event) {
      if (!isCharacterReady()) return;
      const field = event.target?.closest?.(".field");
      if (!field || fieldCanChangeWhenReady(field)) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      showStatus("Personaje listo: la planilla esta bloqueada.");
    }

    function handleLockedAuxiliaryInput(event) {
      if (!isCharacterReady()) return;
      const target = event.target;
      if (!target || target.closest?.(".field")) return;
      if (target.closest?.("#itemPickerBackdrop")) return;
      if (target.closest?.(".spell-picker")) return;
      if (!target.matches?.("input[type='checkbox'], input[type='radio'], select")) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      showStatus("Personaje listo: esa eleccion esta bloqueada.");
    }

    function updateInteractionState() {
      characterReadyButton?.classList.toggle("active", isCharacterReady());
      if (characterReadyButton) {
        characterReadyButton.textContent = isCharacterReady() ? "🔒 Personaje Listo" : "🔓 Personaje Listo";
      }
      if (clearFieldsButton) clearFieldsButton.disabled = isCharacterReady();
      longRestButton?.classList.toggle("active", isLongRestActive());
      if (longRestButton) {
        longRestButton.textContent = isLongRestActive() ? "Terminar long rest" : "Iniciar long rest";
      }
      document.querySelectorAll(".field").forEach((field) => {
        const locked = isCharacterReady() && !fieldCanChangeWhenReady(field);
        field.classList.toggle("locked-field", locked);
        if (field.type === "checkbox") {
          if (locked) {
            field.disabled = true;
            field.dataset.lockedDisabledApplied = "true";
          } else if (field.dataset.lockedDisabledApplied === "true") {
            field.disabled = false;
            delete field.dataset.lockedDisabledApplied;
          }
        } else if (!field.classList.contains("select")) {
          if (locked) {
            field.readOnly = true;
            field.dataset.lockedReadonlyApplied = "true";
          } else if (field.dataset.lockedReadonlyApplied === "true") {
            field.readOnly = false;
            delete field.dataset.lockedReadonlyApplied;
          }
        }
      });
    }

    function toggleCharacterReady() {
      sheetMeta.characterReady = !isCharacterReady();
      if (!sheetMeta.characterReady) sheetMeta.longRestActive = false;
      updateInteractionState();
      scheduleSave();
      showStatus(sheetMeta.characterReady ? "Personaje listo: planilla bloqueada" : "Edicion de personaje habilitada");
    }

    async function saveData() {
      const data = collectData();
      if (desktopStore) await desktopStore.save(data);
      else localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      showStatus("Guardado automatico");
    }

    async function loadData() {
      if (desktopStore) return desktopStore.load();
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }

    async function clearAllFields() {
      if (!window.confirm("Esto va a borrar todos los campos guardados. ¿Continuar?")) return;

      closeOptionMenu();
      closeItemPicker();
      closeItemDrawer();
      selectedPickerItem = null;
      if (itemPickerAdd) itemPickerAdd.disabled = true;
      if (itemPickerQuantity) itemPickerQuantity.value = "1";
      if (itemPickerSearch) itemPickerSearch.value = "";

      document.querySelectorAll(".field").forEach((element) => {
        if (element.type === "checkbox") element.checked = false;
        else element.value = "";
        Object.keys(element.dataset)
          .filter((key) => key.startsWith("generated") || key === "manualRaceBase")
          .forEach((key) => delete element.dataset[key]);
      });

      applyData({ __sheetMeta: { choices: {} } });
      updateEquipmentPanel();
      updatePreparedSpellsPanel();
      renderAlertsPanel();
      await saveData();
      showStatus("Campos limpiados");
    }

    function formatModifier(value) {
      if (!Number.isFinite(value)) return "";
      if (value > 0) return `+${value}`;
      return String(value);
    }

    function abilityModifier(score) {
      const parsed = Number.parseInt(String(score).trim(), 10);
      if (!Number.isFinite(parsed)) return null;
      return Math.floor((parsed - 10) / 2);
    }

    function proficiencyBonusForLevel(level) {
      const parsed = Number.parseInt(String(level).trim(), 10);
      if (!Number.isFinite(parsed) || parsed < 1) return 0;
      return Math.ceil(parsed / 4) + 1;
    }

    function getFieldByKey(key) {
      const normalizedKey = key.trim().toLowerCase();
      return [...document.querySelectorAll(".field")].find((element) => element.dataset.key?.trim().toLowerCase() === normalizedKey) || null;
    }

    function setFieldValue(key, value) {
      const field = getFieldByKey(key);
      if (!field) return;
      field.value = value;
    }

    function numericFieldValue(key) {
      const value = Number.parseInt(fieldValue(key) || "0", 10);
      return Number.isFinite(value) ? value : 0;
    }

    function setFieldTitle(key, value) {
      const field = getFieldByKey(key);
      if (!field) return;
      field.title = value || field.dataset.key || key;
    }

    function getFeaturesTraitsField() {
      const exactKeys = [
        "Features and Traits",
        "Features & Traits",
        "Features Traits",
        "FeaturesTraits"
      ];
      for (const key of exactKeys) {
        const field = getFieldByKey(key);
        if (field && field.dataset.pageNumber === "1") return field;
      }
      return [...document.querySelectorAll(".field")]
        .find((field) => {
          const key = field.dataset.key?.trim().toLowerCase() || "";
          return field.dataset.pageNumber === "1" && key.includes("feature") && key.includes("trait");
        }) || null;
    }

    function generatedEquipmentText() {
      const sources = sheetMeta.generatedEquipmentSources || {};
      return ["class:equipment", "background:equipment"]
        .map((key) => sources[key] || "")
        .filter(Boolean)
        .join("\n");
    }

    function setGeneratedEquipmentValue(sourceKey, value) {
      const field = getFieldByKey("Equipment");
      if (!field) return;
      if (!sheetMeta.generatedEquipmentSources || typeof sheetMeta.generatedEquipmentSources !== "object") {
        sheetMeta.generatedEquipmentSources = {};
      }
      const previous = generatedEquipmentText() || sheetMeta.generatedEquipmentText || "";
      const next = formatEquipmentList(value || "");
      if (next) sheetMeta.generatedEquipmentSources[sourceKey] = next;
      else delete sheetMeta.generatedEquipmentSources[sourceKey];
      const combined = generatedEquipmentText();
      if (!field.value.trim() || field.value === previous) field.value = combined;
      sheetMeta.generatedEquipmentText = combined;
      updateEquipmentPanel();
    }

    function bindFeatureDrawer(field) {
      if (!field || field.dataset.featureDrawerBound === "true") return;
      field.dataset.featureDrawerBound = "true";
      field.style.cursor = "pointer";
      field.addEventListener("click", () => showFeatureDrawer(field));
      field.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        event.preventDefault();
        showFeatureDrawer(field);
      });
    }

    function fieldValue(key) {
      return getFieldByKey(key)?.value?.trim() || "";
    }

    function addAlert(alerts, severity, title, detail, choice = null) {
      alerts.push({ severity, title, detail, choice });
    }

    const ALERT_SEVERITY_LABELS = {
      critical: "Critico",
      important: "Importante",
      optional: "Opcional"
    };

    const REQUIRED_CORE_FIELDS = [
      ["CharacterName", "Nombre del personaje"],
      ["ClassLevel", "Clase"],
      ["CharacterLevel", "Nivel"],
      ["Race ", "Raza"],
      ["Background", "Background"],
      ["Alignment", "Alignment"],
      ["STR", "Strength"],
      ["DEX", "Dexterity"],
      ["CON", "Constitution"],
      ["INT", "Intelligence"],
      ["WIS", "Wisdom"],
      ["CHA", "Charisma"]
    ];

    const PAGE_TWO_OPTIONAL_FIELDS = [
      ["Age", "Edad"],
      ["Height", "Altura"],
      ["Weight", "Peso"],
      ["Eyes", "Ojos"],
      ["Skin", "Piel"],
      ["Hair", "Pelo"],
      ["Backstory", "Backstory"],
      ["Allies", "Allies"],
      ["Treasure", "Treasure"]
    ];

    const CURRENCY_KEYS = ["CP", "SP", "EP", "GP", "PP"];

    function ensureCurrencyDefaults() {
      CURRENCY_KEYS.forEach((key) => {
        const field = getFieldByKey(key);
        if (field && !field.value.trim()) field.value = "0";
      });
    }

    function parseCurrencyText(text) {
      const totals = { cp: 0, sp: 0, ep: 0, gp: 0, pp: 0 };
      const pattern = /(?:^|[^\w])(\d+)\s*(cp|sp|ep|gp|pp)\b/gi;
      for (const match of String(text || "").matchAll(pattern)) {
        const amount = Number.parseInt(match[1], 10);
        const coin = match[2].toLowerCase();
        if (Number.isFinite(amount)) totals[coin] += amount;
      }
      return totals;
    }

    function removeCurrencyText(text) {
      return String(text || "")
        .replace(/(?:^|,\s*|\s+)(\d+)\s*(?:cp|sp|ep|gp|pp)\b/gi, "")
        .replace(/\b(?:a\s+)?(?:belt\s+)?pouch containing\b/gi, "")
        .replace(/\s*,\s*,\s*/g, ", ")
        .replace(/^\s*,\s*|\s*,\s*$/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function splitEquipmentItems(text) {
      const items = [];
      let current = "";
      let depth = 0;
      for (const char of String(text || "")) {
        if (char === "(") depth += 1;
        if (char === ")") depth = Math.max(0, depth - 1);
        if (char === "," && depth === 0) {
          if (current.trim()) items.push(current.trim());
          current = "";
        } else {
          current += char;
        }
      }
      if (current.trim()) items.push(current.trim());
      return items
        .map((item) => item.replace(/^and\s+/i, "").replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function formatEquipmentList(text) {
      return splitEquipmentItems(text).join("\n");
    }

    function normalizeItemLookupName(value) {
      return normalizeName(String(value || "")
        .replace(/\([^)]*\)/g, "")
        .replace(/^(?:a|an|one|set of|a set of)\s+/i, "")
        .replace(/\b(?:same as above|any)\b/gi, "")
        .replace(/\s+/g, " ")
        .trim());
    }

    function parseEquipmentLine(line) {
      const trimmed = String(line || "").trim();
      const match = trimmed.match(/^(\d+)\s+(.+)$/);
      const rawName = match ? match[2].trim() : trimmed;
      const parentheticalQuantity = rawName.match(/\((\d+)\)\s*$/)?.[1];
      const quantity = match ? Number.parseInt(match[1], 10) : Number.parseInt(parentheticalQuantity || "1", 10);
      return {
        quantity: Number.isFinite(quantity) && quantity > 0 ? quantity : 1,
        rawName,
        displayName: rawName
      };
    }

    function findItemData(name) {
      const parenthetical = String(name || "").match(/\(([^)]+)\)/)?.[1] || "";
      if (parenthetical && !/same as above|any/i.test(parenthetical)) {
        const exactParenthetical = dedupeModernByName(
          items.filter((item) => normalizeItemLookupName(item.name) === normalizeItemLookupName(parenthetical)),
          (item) => item?.name || "",
          (item) => item?.source || ""
        )[0] || null;
        if (exactParenthetical) return exactParenthetical;
      }

      const normalized = normalizeItemLookupName(name);
      if (!normalized) return null;
      const variants = new Set([
        normalized,
        normalized.replace(/s$/, ""),
        normalized.replace(/^bolt$/, "crossbow bolt"),
        normalized.replace(/^arrow$/, "arrow"),
        normalized.replace(/^traveler s clothes$/, "traveler s clothes")
      ]);
      return dedupeModernByName(
        items.filter((item) => variants.has(normalizeItemLookupName(item.name))),
        (item) => item?.name || "",
        (item) => item?.source || ""
      )[0] || null;
    }

    function formatItemValue(value, quantity = 1) {
      if (!Number.isFinite(value)) return "-";
      const gp = (value * quantity) / 100;
      return `${Number.isInteger(gp) ? gp : Number(gp.toFixed(2))} GP`;
    }


    const DAMAGE_TYPE_NAMES = {
      A: "Acid",
      B: "Bludgeoning",
      C: "Cold",
      F: "Fire",
      O: "Force",
      L: "Lightning",
      N: "Necrotic",
      P: "Piercing",
      I: "Poison",
      Y: "Psychic",
      R: "Radiant",
      S: "Slashing",
      T: "Thunder"
    };

    function sourceLabel(source) {
      if (source === "XPHB") return "PHB'24";
      if (source === "XDMG") return "DMG'24";
      return source || "";
    }

    function splitRef(ref) {
      const [abbreviation, source] = String(ref || "").split("|");
      return { abbreviation, source: source || null };
    }

    function itemNameFromRef(ref) {
      return (splitRef(ref).abbreviation || String(ref || "").split("|")[0] || "").replace(/\s*\(\d+\)\s*$/, "");
    }

    function itemQuantityFromRef(ref) {
      const match = String(ref || "").match(/\((\d+)\)/);
      return match ? Number.parseInt(match[1], 10) : 1;
    }

    function equipmentQuantityPrefix(quantity) {
      return Number.isFinite(quantity) && quantity > 1 ? `${quantity} ` : "";
    }

    function itemTypeName(typeRef) {
      const { abbreviation, source } = splitRef(typeRef);
      const type = itemTypes.find((itemType) => itemType.abbreviation === abbreviation && itemType.source === source)
        || itemTypes.find((itemType) => itemType.abbreviation === abbreviation && itemType.source === "XPHB")
        || itemTypes.find((itemType) => itemType.abbreviation === abbreviation);
      return type?.name || "";
    }

    function propertyData(ref) {
      const { abbreviation, source } = splitRef(ref);
      return itemProperties.find((property) => property.abbreviation === abbreviation && property.source === source)
        || itemProperties.find((property) => property.abbreviation === abbreviation && property.source === "XPHB")
        || itemProperties.find((property) => property.abbreviation === abbreviation)
        || null;
    }

    function propertyName(ref, item) {
      const property = propertyData(ref);
      const name = property?.entries?.[0]?.name || property?.name || splitRef(ref).abbreviation;
      if (splitRef(ref).abbreviation === "T" && item?.range) return `${name} (${item.range} ft.)`;
      return name;
    }

    function propertyDescription(ref) {
      const property = propertyData(ref);
      return property ? flattenEntryText(property.entries) : "";
    }

    function masteryData(ref) {
      const { abbreviation, source } = splitRef(ref);
      return itemMasteries.find((mastery) => mastery.name === abbreviation && mastery.source === source)
        || itemMasteries.find((mastery) => mastery.name === abbreviation && mastery.source === "XPHB")
        || itemMasteries.find((mastery) => mastery.name === abbreviation)
        || null;
    }

    function itemCategoryLine(item) {
      const categories = [];
      if (item.weapon) categories.push("Weapon");
      else if (item.type) categories.push(itemTypeName(item.type) || String(item.type).split("|")[0]);
      if (item.weaponCategory) categories.push(`${item.weaponCategory[0].toUpperCase()}${item.weaponCategory.slice(1)} Weapon`);
      const typeName = itemTypeName(item.type);
      if (typeName && !categories.includes(typeName)) categories.push(typeName);
      if (item.rarity && item.rarity !== "none") categories.push(item.rarity);
      return categories.join("\n");
    }

    function itemValueWeightLine(item, quantity = 1) {
      const parts = [];
      if (Number.isFinite(item.value)) parts.push(formatItemValue(item.value, quantity));
      if (Number.isFinite(item.weight)) parts.push(`${item.weight * quantity} lb.`);
      return parts.join(", ");
    }

    function itemDamageLine(item) {
      if (!item.dmg1 || !item.dmgType) return "";
      return `${item.dmg1} ${DAMAGE_TYPE_NAMES[item.dmgType] || item.dmgType}`;
    }

    function itemPropertiesLine(item) {
      return (item.property || []).map((ref) => propertyName(ref, item)).join(", ");
    }

    function itemMasteryLine(item) {
      return (item.mastery || []).map((ref) => `Mastery: ${splitRef(ref).abbreviation}`).join(", ");
    }

    function sourceLine(item) {
      const parts = [];
      if (item.source) parts.push(`Source: ${sourceLabel(item.source)}${item.page ? `, page ${item.page}` : ""}.`);
      if (item.referenceSources?.length) parts.push(`Referenced in ${item.referenceSources.join("; ")}.`);
      const availability = [];
      if (item.srd || item.srd52) availability.push(item.srd52 ? "SRD 5.2.1" : "SRD");
      if (item.basicRules || item.basicRules2024) availability.push(item.basicRules2024 ? "Basic Rules (5.5e/2024)" : "Basic Rules");
      if (availability.length) parts.push(`Available in the ${availability.join(" and ")}.`);
      return parts.join(" ");
    }

    function itemMetaText(item, quantity = 1) {
      if (!item) return "Sin datos de item local.";
      return [
        itemTypeName(item.type) || String(item.type || "").split("|")[0],
        itemValueWeightLine(item, quantity),
        sourceLabel(item.source)
      ].filter(Boolean).join(" - ");
    }

    function itemDescriptionText(item) {
      if (!item) return "No encontre este item en los datos locales. El nombre puede ser generico o una variante del equipo inicial.";
      const header = [
        item.name,
        sourceLabel(item.source),
        item.page ? `p${item.page}` : "",
        itemCategoryLine(item),
        itemValueWeightLine(item),
        itemDamageLine(item),
        itemPropertiesLine(item),
        itemMasteryLine(item)
      ].filter(Boolean).join("\n");

      const details = [];
      if (item.entries) details.push(flattenEntryText(item.entries));
      if (item.additionalEntries) details.push(flattenEntryText(item.additionalEntries));
      (item.property || []).forEach((ref) => {
        const name = propertyName(ref, item).replace(/\s+\([^)]*\)$/, "");
        const description = propertyDescription(ref);
        if (description) details.push(`${name}. ${description.replace(new RegExp(`^${name}\\.\\s*`, "i"), "")}`);
      });
      (item.mastery || []).forEach((ref) => {
        const mastery = masteryData(ref);
        const name = mastery?.name || splitRef(ref).abbreviation;
