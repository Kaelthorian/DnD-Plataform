        const description = mastery ? flattenEntryText(mastery.entries) : "";
        if (description) details.push(`Mastery: ${name}. ${description}`);
      });

      return [header, ...details.filter(Boolean), sourceLine(item)].filter(Boolean).join("\n\n");
    }

    function appendText(parent, className, text, tagName = "div") {
      if (!text) return null;
      const node = document.createElement(tagName);
      node.className = className;
      node.textContent = text;
      parent.appendChild(node);
      return node;
    }

    function appendItemStat(grid, label, value) {
      if (!value) return;
      const stat = document.createElement("div");
      stat.className = "item-stat";
      appendText(stat, "item-stat-label", label);
      appendText(stat, "item-stat-value", value);
      grid.appendChild(stat);
    }

    function appendItemSection(root, title, body) {
      if (!body) return;
      const section = document.createElement("section");
      section.className = "item-section";
      appendText(section, "item-section-title", title);
      appendText(section, "item-section-body", body, "p");
      root.appendChild(section);
    }

    function appendFeatureListSection(root, title, items) {
      const values = (items || []).map(flattenEntryText).filter(Boolean);
      if (!values.length) return;
      const section = document.createElement("section");
      section.className = "item-section";
      appendText(section, "item-section-title", title);
      const list = document.createElement("ul");
      list.className = "item-section-list";
      values.forEach((value) => {
        const item = document.createElement("li");
        item.textContent = value;
        list.appendChild(item);
      });
      section.appendChild(list);
      root.appendChild(section);
    }

    function appendEntryBlocks(root, entries, fallbackTitle = "Descripcion") {
      const blocks = Array.isArray(entries) ? entries : [entries];
      const pendingParagraphs = [];
      const flushParagraphs = () => {
        if (!pendingParagraphs.length) return;
        appendItemSection(root, fallbackTitle, pendingParagraphs.splice(0).join("\n\n"));
      };

      blocks.forEach((entry) => {
        if (!entry) return;
        if (typeof entry === "string") {
          pendingParagraphs.push(strip5eTags(entry));
          return;
        }
        if (Array.isArray(entry)) {
          pendingParagraphs.push(flattenEntryText(entry));
          return;
        }
        if (entry.type === "list") {
          flushParagraphs();
          appendFeatureListSection(root, entry.name || "Beneficios", entry.items || []);
          return;
        }
        if (entry.type === "entries" || entry.entries) {
          flushParagraphs();
          const text = flattenEntryText(entry.entries);
          appendItemSection(root, strip5eTags(entry.name || fallbackTitle), text);
          return;
        }
        pendingParagraphs.push(flattenEntryText(entry));
      });
      flushParagraphs();
    }

    function buildSpellDrawerContent(spell, translatedDescription = "") {
      const root = document.createElement("div");
      root.className = "item-sheet";

      if (!spell) {
        appendItemSection(root, "Spell", "No encontre esta magia en los datos locales.");
        return root;
      }

      appendText(root, "item-sheet-title", spell.name, "h2");
      appendText(root, "item-sheet-subtitle", [spellSourceLabel(spell), spellLevelLabel(spell.level), spellSchoolLabel(spell)].filter(Boolean).join(" - "));

      const stats = document.createElement("div");
      stats.className = "item-stat-grid";
      appendItemStat(stats, "Nivel", spellLevelLabel(spell.level));
      appendItemStat(stats, "Escuela", spellSchoolLabel(spell));
      appendItemStat(stats, "Clases", (spell.classes || []).join(", "));
      appendItemStat(stats, "Razas", (spell.races || []).join(", "));
      appendItemStat(stats, "Daño detectado", damageDiceForSpell(spell));
      appendItemStat(stats, "Tipo de daño", damageTypeForSpell(spell));
      root.appendChild(stats);

      const chips = document.createElement("div");
      chips.className = "item-chip-list";
      [spellSourceLabel(spell), spell.level === 0 ? "Cantrip" : `Level ${spell.level}`, spellSchoolLabel(spell)]
        .filter(Boolean)
        .forEach((value) => appendText(chips, "item-chip", value, "span"));
      if (chips.childElementCount) root.appendChild(chips);

      const description = cleanSpellDescription(spell);
      const descriptionContainer = document.createElement("div");
      descriptionContainer.className = "spell-description-blocks";
      renderSpellDescriptionSections(descriptionContainer, translatedDescription || description);
      root.appendChild(descriptionContainer);
      appendText(root, "item-source", spellSourceLabel(spell) ? `Source: ${spellSourceLabel(spell)}.` : "");
      return root;
    }

    function showSpellDrawer(spellOrName) {
      const spell = typeof spellOrName === "string" ? findSpellByName(spellOrName) : spellOrName;
      showDrawer(
        spell?.name || String(spellOrName || "Spell"),
        spell ? [spellLevelLabel(spell.level), spellSchoolLabel(spell), spellSourceLabel(spell)].filter(Boolean).join(" - ") : "Spell",
        buildSpellDrawerContent(spell)
      );
    }

    function commitSpellSelection(field, spellName) {
      if (!field || !spellName) return;
      if (field.dataset.optionType === "spell" && !ensureCanModifySpells()) return;
      if (isAutoGrantedSpellField(field)) {
        showStatus("Esta magia la otorga tu personaje y no se puede reemplazar.");
        return;
      }
      if (isSpellAlreadySelected(spellName, field)) {
        showStatus("Esa magia ya esta seleccionada");
        return;
      }
      const level = Number(field.dataset.spellLevel);
      if (!field.value.trim() && getSelectedSpellCount(level, field) >= getSpellLevelLimit(level)) {
        showStatus(level === 0 ? "Limite de cantrips alcanzado" : `Limite de spells nivel ${level} alcanzado`);
        return;
      }
      if (isBardCharacter() && level > 0 && !field.value.trim() && selectedKnownSpellNames().length >= bardKnownSpellLimit()) {
        showStatus(`Limite de spells conocidas: ${bardKnownSpellLimit()}`);
        return;
      }
      if (isBardCharacter() && level > 0 && !bardCanLearnSpell(spellName)) {
        showStatus("Esa spell no esta disponible para Bard.");
        return;
      }
      if (isWizardCharacter() && level > 0 && !wizardSpellbookSet().has(normalizeName(spellName))) {
        showStatus("Primero agregala al spellbook.");
        return;
      }
      field.value = spellName;
      syncFeatPreparedSpellCheckbox(field);
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      scheduleSave();
      updatePreparedSpellsPanel();
      showStatus(`${spellName} seleccionada`);
      showSpellSelectionDrawer(field, findSpellByName(spellName));
    }

    function clearSpellSelection(field) {
      if (!field || isAutoGrantedSpellField(field)) return;
      if (field.dataset.optionType === "spell" && !ensureCanModifySpells()) return;
      field.value = "";
      syncFeatPreparedSpellCheckbox(field);
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      scheduleSave();
      updatePreparedSpellsPanel();
      showStatus("Magia quitada");
      showSpellSelectionDrawer(field);
    }

    function showSpellPickerDetail(detailBody, spell, { translated = false } = {}) {
      const detail = detailBody?.closest(".spell-picker-detail");
      if (!detailBody || !detail) return;
      detailBody.dataset.currentSpellName = spell?.name || "";
      detailBody.dataset.currentSpellTranslated = translated ? "true" : "false";
      detailBody.textContent = "";
      const translatedDescription = translated && spell ? ensureSpellTranslationCache()[spellTranslationKey(spell)] || "" : "";
      detailBody.appendChild(buildSpellDrawerContent(spell, translatedDescription));
      detail.classList.remove("hidden");
      updateSpellTranslationToolbar(detailBody);
    }

    function updateSpellTranslationToolbar(detailBody) {
      const button = detailBody?.closest(".spell-picker")?.querySelector("[data-spell-translation-button='true']");
      if (!button) return;
      button.textContent = detailBody.dataset.currentSpellTranslated === "true" ? "Ver original" : "Traducir examinada";
    }

    function buildSpellTranslationToolbar(detailBody, currentSpell) {
      const toolbar = document.createElement("div");
      toolbar.className = "spell-translation-tools";
      const label = document.createElement("span");
      label.className = "spell-translation-status";
      label.textContent = "La traduccion aplica solo a la spell examinada.";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "spell-picker-button secondary";
      button.dataset.spellTranslationButton = "true";
      button.textContent = "Traducir examinada";
      button.addEventListener("click", () => {
        const visibleSpell = findSpellByName(detailBody?.dataset?.currentSpellName || "") || currentSpell;
        if (!visibleSpell) return;
        if (detailBody.dataset.currentSpellTranslated === "true") {
          showSpellPickerDetail(detailBody, visibleSpell);
          showStatus("Descripcion original");
          return;
        }
        showStatus("Traduciendo descripcion de esta spell...");
        translateSpellDescription(visibleSpell, cleanSpellDescription(visibleSpell))
          .then(() => showSpellPickerDetail(detailBody, visibleSpell, { translated: true }))
          .then(() => showStatus("Descripcion traducida"))
          .catch((error) => {
            console.error(error);
            showStatus("No se pudo traducir la descripcion de la spell.");
          });
      });
      toolbar.append(label, button);
      return toolbar;
    }

    function getAllWizardAccessibleSpellOptions() {
      const autoPrepared = new Set(autoAlwaysPreparedSpellNames().map(normalizeName));
      const maxLevel = maxSpellLevelForCharacter();
      return spells.filter((spell) => spell.level > 0
        && spell.level <= maxLevel
        && spell.classes?.some((name) => normalizeName(name) === "wizard")
        && !autoPrepared.has(normalizeName(spell.name)));

    function getAccessibleCantripOptions() {
