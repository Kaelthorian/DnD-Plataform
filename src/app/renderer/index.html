      appendItemStat(stats, "Rango", item.range ? `${item.range} ft.` : "");
      root.appendChild(stats);

      const properties = [...(item.property || []).map((ref) => propertyName(ref, item)), ...(item.mastery || []).map((ref) => `Mastery: ${splitRef(ref).abbreviation}`)];
      if (properties.length) {
        const chips = document.createElement("div");
        chips.className = "item-chip-list";
        properties.forEach((property) => appendText(chips, "item-chip", property, "span"));
        root.appendChild(chips);
      }

      if (item.entries) appendItemSection(root, "Descripción", flattenEntryText(item.entries));
      if (item.additionalEntries) appendItemSection(root, "Uso", flattenEntryText(item.additionalEntries));

      (item.property || []).forEach((ref) => {
        const name = propertyName(ref, item).replace(/\s+\([^)]*\)$/, "");
        const description = propertyDescription(ref);
        if (description) appendItemSection(root, name, description.replace(new RegExp(`^${name}\\.\\s*`, "i"), ""));
      });

      (item.mastery || []).forEach((ref) => {
        const mastery = masteryData(ref);
        const name = mastery?.name || splitRef(ref).abbreviation;
        const description = mastery ? flattenEntryText(mastery.entries) : "";
        if (description) appendItemSection(root, `Mastery: ${name}`, description);
      });

      appendText(root, "item-source", sourceLine(item));
      return root;
    }

    const ABILITY_LABELS = {
      str: "STR",
      dex: "DEX",
      con: "CON",
      int: "INT",
      wis: "WIS",
      cha: "CHA"
    };
    const ABILITY_KEYS = Object.values(ABILITY_LABELS);
    const ASI_CHOICE_VALUE = "Ability Score Improvement";

    const FEAT_CATEGORY_LABELS = {
      O: "Origin",
      G: "General",
      FS: "Fighting Style",
      "FS:P": "Fighting Style: Paladin",
      "FS:R": "Fighting Style: Ranger",
      EB: "Epic Boon",
      D: "Dragonmark"
    };

    function findFeatData(refOrName) {
      const ref = refOrName && typeof refOrName === "object" ? refOrName : null;
      const rawName = ref ? ref.name : refOrName;
      const normalizedSource = normalizeName(ref?.source || "");
      const replacementSource = modernReplacementSource(normalizedSource);
      const normalizedVariant = normalizeName(ref?.variant || "");
      const normalizedFull = normalizeName(String(rawName || "")
        .replace(/^background feat:\s*/i, "")
        .replace(/\([^)]*\)\s*$/g, "")
        .split("|")[0]);
      const exactVariantName = normalizedVariant ? normalizeName(`${rawName}; ${ref.variant}`) : "";
      const normalized = normalizeName(String(rawName || "")
        .replace(/^background feat:\s*/i, "")
        .replace(/\([^)]*\)\s*$/g, "")
        .split(";")[0]
        .split("|")[0]);
      if (!normalized) return null;
      const exactFullMatches = feats.filter((feat) => normalizedFull && normalizeName(feat.name) === normalizedFull);
      const exactVariantMatches = feats.filter((feat) => exactVariantName && normalizeName(feat.name) === exactVariantName);
      const nameMatches = feats.filter((feat) => normalizeName(feat.name) === normalized);
      if (replacementSource) {
        return exactFullMatches.find((feat) => normalizeName(feat.source) === replacementSource)
          || exactVariantMatches.find((feat) => normalizeName(feat.source) === replacementSource)
          || nameMatches.find((feat) => normalizeName(feat.source) === replacementSource)
          || exactFullMatches[0]
          || exactVariantMatches[0]
          || nameMatches[0]
          || null;
      }
      return feats.find((feat) => normalizedFull && normalizeName(feat.name) === normalizedFull && (!normalizedSource || normalizeName(feat.source) === normalizedSource))
        || feats.find((feat) => normalizedFull && normalizeName(feat.name) === normalizedFull)
        || feats.find((feat) => exactVariantName && normalizeName(feat.name) === exactVariantName && (!normalizedSource || normalizeName(feat.source) === normalizedSource))
        || feats.find((feat) => exactVariantName && normalizeName(feat.name) === exactVariantName)
        || feats.find((feat) => normalizeName(feat.name) === normalized && (!normalizedSource || normalizeName(feat.source) === normalizedSource))
        || dedupeModernByName(nameMatches, (feat) => feat?.name || "", (feat) => feat?.source || "")[0]
        || feats.find((feat) => normalizeName(feat.name) === normalized)
        || null;
    }

    function formatAbilityChoice(value) {
      if (!value || typeof value !== "object") return "";
      if (Array.isArray(value.choose)) return `Choose ${value.choose.map((ability) => ABILITY_LABELS[ability] || ability.toUpperCase()).join(", ")}`;
      return Object.entries(value)
        .filter(([, amount]) => Number.isFinite(amount))
        .map(([ability, amount]) => `${ABILITY_LABELS[ability] || ability.toUpperCase()} ${formatModifier(amount)}`)
        .join(", ");
    }

    function formatFeatAbility(feat) {
      const values = Array.isArray(feat?.ability) ? feat.ability : [];
      return values.map(formatAbilityChoice).filter(Boolean).join(" / ");
    }

    function activeFeatEntriesForEffects() {
      return [
        ...backgroundFeatureEntries().filter((entry) => entry.type === "feat"),
        ...selectedFeatureChoiceEntries().filter((entry) => entry.type === "feat")
      ];
    }

    function activeFeatData() {
      const seen = new Set();
      return activeFeatEntriesForEffects()
        .map((entry) => entry.feat || findFeatData(entry.featName || entry.title))
        .filter(Boolean)
        .filter((feat) => {
          const key = `${normalizeName(feat.name)}|${normalizeName(feat.source || "")}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function formatPrerequisiteItem(item) {
      if (!item || typeof item !== "object") return "";
      const parts = [];
      if (item.level) parts.push(`Level ${item.level}`);
      if (item.spellcasting2020 || item.spellcasting) parts.push("Spellcasting");
      if (item.pactMagic) parts.push("Pact Magic");
      if (item.feature) parts.push(`Feature: ${Array.isArray(item.feature) ? item.feature.join(", ") : item.feature}`);
      if (item.otherSummary?.entry) parts.push(strip5eTags(item.otherSummary.entry));
      if (Array.isArray(item.ability)) parts.push(`Ability: ${item.ability.map(formatAbilityChoice).filter(Boolean).join(" / ")}`);
      return parts.join("; ");
    }

    function formatFeatPrerequisites(feat) {
      const values = Array.isArray(feat?.prerequisite) ? feat.prerequisite : [];
      return values.map(formatPrerequisiteItem).filter(Boolean).join(" OR ");
    }

    function formatAdditionalSpells(feat) {
      const spellGroups = Array.isArray(feat?.additionalSpells) ? feat.additionalSpells : [];
      return spellGroups
        .map((group) => {
          const ability = typeof group.ability === "string"
            ? ABILITY_LABELS[group.ability] || group.ability.toUpperCase()
            : Array.isArray(group.ability?.choose)
              ? `choose ${group.ability.choose.map((item) => ABILITY_LABELS[item] || item.toUpperCase()).join(", ")}`
              : "";
          return [group.name, ability ? `ability: ${ability}` : ""].filter(Boolean).join(" - ");
        })
        .filter(Boolean)
        .join("\n");
    }

    function formatStructuredValue(value) {
      if (!value) return "";
      if (typeof value === "string") return strip5eTags(value);
      if (typeof value === "number" || typeof value === "boolean") return String(value);
      if (Array.isArray(value)) return value.map(formatStructuredValue).filter(Boolean).join(", ");
      if (typeof value === "object") {
        return Object.entries(value)
          .map(([key, item]) => `${key}: ${formatStructuredValue(item)}`)
          .filter(Boolean)
          .join("; ");
      }
      return "";
    }

    function buildFeatDrawerContent(feat, fallbackName = "Feat", backgroundFeature = "", featureOverride = null) {
      const root = document.createElement("div");
      root.className = "item-sheet";

      if (!feat) {
        appendItemSection(root, fallbackName, "No encontre este feat en los datos locales.");
        return root;
      }

      appendText(root, "item-sheet-title", feat.name, "h2");
      appendText(root, "item-sheet-subtitle", [sourceLabel(feat.source), feat.page ? `p${feat.page}` : ""].filter(Boolean).join(" - "));

      const stats = document.createElement("div");
      stats.className = "item-stat-grid";
      appendItemStat(stats, "Tipo", "Feat");
      appendItemStat(stats, "Categoria", FEAT_CATEGORY_LABELS[feat.category] || feat.category);
      appendItemStat(stats, "Prerequisito", formatFeatPrerequisites(feat));
      appendItemStat(stats, "Mejora", formatFeatAbility(feat));
      appendItemStat(stats, "Repetible", feat.repeatable ? "Si" : "");
      root.appendChild(stats);

      const chips = document.createElement("div");
      chips.className = "item-chip-list";
      [FEAT_CATEGORY_LABELS[feat.category] || feat.category, feat.srd52 ? "SRD 5.2.1" : "", feat.basicRules2024 ? "Basic Rules 2024" : ""]
        .filter(Boolean)
        .forEach((value) => appendText(chips, "item-chip", value, "span"));
      if (chips.childElementCount) root.appendChild(chips);

      appendEntryBlocks(root, feat.entries, "Beneficios");
      appendFeatureChoiceControls(root, featureOverride || {
        name: feat.name,
        source: feat.source,
        page: feat.page,
        level: 1,
        isFeatFeature: true,
        feat,
        entries: feat.entries || []
      });
      appendItemSection(root, "Spells adicionales", formatAdditionalSpells(feat));
      appendItemSection(root, "Sentidos", formatStructuredValue(feat.senses));
      appendItemSection(root, "Resistencias", formatStructuredValue(feat.resist));
      appendItemSection(root, "Background Feature", backgroundFeature);
      appendText(root, "item-source", sourceLine(feat));
      return root;
    }

    function buildTextFeatureDrawerContent(title, description, meta = "") {
      const root = document.createElement("div");
      root.className = "item-sheet";
      appendText(root, "item-sheet-title", title || "Feature", "h2");
      appendText(root, "item-sheet-subtitle", meta);
      String(description || "")
        .split(/\n{2,}|(?<=[.!?])\s+(?=[A-Z])/)
        .map((item) => item.trim())
        .filter(Boolean)
        .forEach((paragraph, index) => appendItemSection(root, index === 0 ? "Descripcion" : "Detalle", paragraph));
      return root;
    }

    function featureChoiceKey(feature) {
      return [feature?.className || "feature", feature?.source || "", feature?.level || "", feature?.name || "", feature?.choiceContext || ""]
        .map((item) => normalizeName(String(item)))
        .join("|");
    }

    function selectedFeatureChoices(key) {
      const value = sheetMeta.featureChoices?.[key];
      return Array.isArray(value) ? value : value ? [value] : [];
    }

    function setSelectedFeatureChoices(key, values) {
      if (!sheetMeta.featureChoices || typeof sheetMeta.featureChoices !== "object") sheetMeta.featureChoices = {};
      const next = [...new Set(values.filter(Boolean))];
      if (!next.includes(ASI_CHOICE_VALUE)) {
        for (let index = next.length - 1; index >= 0; index -= 1) {
          if (String(next[index]).startsWith("asi:")) next.splice(index, 1);
        }
      }
      if (next.length) sheetMeta.featureChoices[key] = next;
      else delete sheetMeta.featureChoices[key];
      updateDerivedStats();
      updateArmorClass();
      updatePreparedSpellsPanel();
      renderAlertsPanel();
      scheduleSave();
    }

    function optionalFeatureByName(name) {
      const normalized = normalizeName(name);
      return optionalFeatures.find((item) => normalizeName(item.name || "") === normalized && item.source === "XPHB")
        || optionalFeatures.find((item) => normalizeName(item.name || "") === normalized)
        || null;
    }

    function featureChoiceOptionData(option) {
      const name = option.optionalfeature || option.feat || option.name || "";
      const cleanName = strip5eTags(String(name).split("|")[0]);
      if (!cleanName) return null;
      const optional = option.optionalfeature ? optionalFeatureByName(cleanName) : null;
      const feat = option.feat ? findFeatData(cleanName) : null;
      return {
        value: cleanName,
        label: cleanName,
        type: option.optionalfeature ? "optionalfeature" : option.feat ? "feat" : "choice",
        description: flattenEntryText(optional?.entries || feat?.entries || option.entries || option.entry || "")
      };
    }

    function weaponMasteryOptionsForFeature(feature) {
      const text = flattenEntryText(feature?.entries || "").toLowerCase();
      const meleeOnly = /melee weapons|martial melee|melee weapon/.test(text) && !/simple weapon;martial weapon/.test(text);
      const needsProficiency = /with which you have proficiency/i.test(text);
      const seen = new Set();
      return itemPickerItems()
        .filter((item) => item.source === "XPHB" && item.weapon && item.mastery?.length)
        .filter((item) => !meleeOnly || itemTypeAbbreviation(item) === "M")
        .filter((item) => !needsProficiency || hasEquipmentProficiency(item))
        .filter((item) => {
          const key = normalizeName(item.name);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .map((item) => {
          const masteryName = splitRef(item.mastery[0]).abbreviation;
          const mastery = masteryData(item.mastery[0]);
          const description = flattenEntryText(mastery?.entries || "");
          return {
            value: `weapon-mastery:${item.name}`,
            label: `${item.name} (${masteryName})`,
            type: "weaponMastery",
            weaponName: item.name,
            masteryName,
            description
          };
        });
    }

    function weaponMasteryCountForFeature(feature) {
      const className = normalizeName(feature?.className || "");
      const level = Math.max(1, Math.min(20, getCharacterLevel()));
      if (className === "fighter") return level >= 16 ? 6 : level >= 9 ? 5 : level >= 4 ? 4 : 3;
      if (["barbarian", "rogue", "paladin", "ranger"].includes(className)) return level >= 10 ? 4 : level >= 4 ? 3 : 2;
      const text = flattenEntryText(feature?.entries || "");
      const wordMatch = text.match(/of\s+(one|two|three|four|five|six)\s+kinds?/i);
      if (wordMatch) return countWordToNumber(wordMatch[1]);
      const numberMatch = text.match(/of\s+(\d+)\s+kinds?/i);
      return numberMatch ? Number.parseInt(numberMatch[1], 10) : 1;
    }

    function classTableValueForFeature(feature, labelPattern) {
      const className = feature?.className || getMainClassName() || getSelectedClassName();
      const detail = classDetailByName(className);
      const classItem = detail?.classItem;
      const level = Math.max(1, Math.min(20, getCharacterLevel()));
      if (!classItem?.classTableGroups?.length) return null;
      for (const group of classItem.classTableGroups) {
        const labels = group.colLabels || [];
        const index = labels.findIndex((label) => labelPattern.test(strip5eTags(label)));
        if (index < 0) continue;
        const row = group.rows?.[level - 1];
        const value = Array.isArray(row) ? row[index] : null;
        const number = Number.parseInt(strip5eTags(value), 10);
        if (Number.isFinite(number)) return number;
      }
      return null;
    }

    function optionalFeatureOptionsByType(featureType) {
      const type = String(featureType || "").toUpperCase();
      const seen = new Set();
      return optionalFeatures
        .filter((item) => (item.featureType || []).includes(type))
        .filter((item) => {
          const key = normalizeName(item.name || "");
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .sort((a, b) => a.name.localeCompare(b.name))
        .map((item) => ({ value: item.name, label: item.name, type: "optionalfeature", description: flattenEntryText(item.entries) }));
    }

    function eldritchInvocationCountForFeature(feature) {
      const tableValue = classTableValueForFeature(feature, /^invocations?(?: known)?$/i);
      if (tableValue != null) return Math.max(1, tableValue);
      const text = flattenEntryText(feature?.entries || "");
      const match = text.match(/\b(one|two|three|four|five|six|seven|eight|nine|\d+)\s+eldritch invocations?\b/i);
      return match ? countWordToNumber(match[1]) || Number.parseInt(match[1], 10) || 1 : 1;
    }

    function artificerInfusionKnownCountForFeature(feature) {
      const tableValue = classTableValueForFeature(feature, /^(?:infusions known|plans known)$/i);
      if (tableValue != null) return Math.max(1, tableValue);
      const text = flattenEntryText(feature?.entries || "");
      const match = text.match(/\b(?:learn|known|pick|choose)\s+(one|two|three|four|five|six|seven|eight|nine|\d+)\s+(?:artificer\s+)?infusions?\b/i);
      return match ? countWordToNumber(match[1]) || Number.parseInt(match[1], 10) || 4 : 4;
    }

    function artificerInfusedItemCountForFeature(feature) {
      const tableValue = classTableValueForFeature(feature, /^(?:infused items|magic items)$/i);
      if (tableValue != null) return Math.max(1, tableValue);
      const text = flattenEntryText(feature?.entries || "");
      const match = text.match(/\b(one|two|three|four|five|six|seven|eight|nine|\d+)\s+(?:items?|objects?)\b/i);
      return match ? countWordToNumber(match[1]) || Number.parseInt(match[1], 10) || 2 : 2;
    }

    function isAbilityScoreImprovementFeature(feature) {
      const name = normalizeName(feature?.name || "");
      const text = normalizeName(flattenEntryText(feature?.entries || feature?.entry || ""));
      return name === "ability score improvement"
        || (text.includes("ability score improvement feat") && text.includes("another feat"));
    }

    function featChoiceOptionsForAbilityScoreImprovement() {
      const seen = new Set();
      const options = [{
        value: ASI_CHOICE_VALUE,
        label: ASI_CHOICE_VALUE,
        type: "abilityScoreImprovement",
        description: "Increase one ability score by 2, or two ability scores by 1."
      }];
      feats
        .filter((feat) => feat.name && normalizeName(feat.name) !== normalizeName(ASI_CHOICE_VALUE))
        .filter((feat) => !feat.category || feat.category === "G" || feat.category === "O")
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((feat) => {
          const key = normalizeName(feat.name);
          if (seen.has(key)) return;
          seen.add(key);
          options.push({
            value: feat.name,
            label: feat.name,
            type: "feat",
            description: flattenEntryText(feat.entries)
          });
        });
      return options;
    }

    function spellChoiceOptionsForFeatureText(text, fallbackClassName = "") {
      const normalizedText = String(text || "");
      const lower = normalizedText.toLowerCase();
      if (!/\bcantrips?\b/.test(lower) || !/\b(?:choice|choose|of your choice)\b/.test(lower)) return null;
      const countMatch = lower.match(/\b(one|two|three|four|\d+)\s+(?:other\s+|additional\s+)?cantrips?\b/);
      const count = countMatch ? countWordToNumber(countMatch[1]) || Number.parseInt(countMatch[1], 10) || 1 : 1;
      const classMatch = normalizedText.match(/\b(?:from|of)\s+the\s+\{@filter\s+([A-Za-z]+)[^}]*class=([A-Za-z]+)[^}]*\}/i)
        || normalizedText.match(/\bfrom the\s+([A-Za-z]+)\s+spell list/i)
        || normalizedText.match(/\b([A-Za-z]+)\s+cantrip of your choice/i);
      const className = classMatch?.[2] || classMatch?.[1] || fallbackClassName;
      const classKey = normalizeName(className);
      const options = spells
        .filter((spell) => spell.level === 0)
        .filter((spell) => !classKey || spell.classes?.some((name) => normalizeName(name) === classKey))
        .sort((a, b) => a.name.localeCompare(b.name))
        .map((spell) => ({
          value: `spell:${spell.name}`,
          label: spell.name,
          type: "spell",
          description: cleanSpellDescription(spell)
        }));
      return options.length ? { label: "Cantrip", count, options } : null;
    }

    function languageChoiceSpecForFeatureText(text) {
      const source = String(text || "");
      const match = source.match(/\b(one|two|three|four|\d+)\s+(?:other\s+|extra\s+|additional\s+)?languages?\s+of your choice\b/i);
      if (!match) return null;
      const count = countWordToNumber(match[1]) || Number.parseInt(match[1], 10) || 1;
      const options = languageChoiceOptions().map((option) => ({
        value: `language:${option.value}`,
        label: option.label || option.text || option.value,
        type: "language",
        description: "Language proficiency."
      }));
      return options.length ? { label: "Language", count, options } : null;
    }

    function abilityScoreIncreaseOptions() {
      const options = ABILITY_KEYS.map((ability) => ({
        value: `asi:${ability}+2`,
        label: `${ability} +2`,
        type: "abilityScoreIncrease",
        description: `Increase ${ability} by 2.`
      }));
      for (let first = 0; first < ABILITY_KEYS.length; first += 1) {
        for (let second = first + 1; second < ABILITY_KEYS.length; second += 1) {
          const left = ABILITY_KEYS[first];
          const right = ABILITY_KEYS[second];
          options.push({
            value: `asi:${left}+1:${right}+1`,
            label: `${left} +1, ${right} +1`,
            type: "abilityScoreIncrease",
            description: `Increase ${left} and ${right} by 1.`
          });
        }
      }
      return options;
    }

    function featAbilityChoiceOptions(feat) {
      return (Array.isArray(feat?.ability) ? feat.ability : [])
        .flatMap((item) => Array.isArray(item?.choose)
          ? item.choose.map((ability) => {
            const key = ABILITY_LABELS[ability] || String(ability || "").toUpperCase();
            return ABILITY_KEYS.includes(key)
              ? { value: `feat-ability:${key}+1`, label: `${key} +1`, type: "abilityScoreIncrease", description: `${feat.name}: increase ${key} by 1.` }
              : null;
          }).filter(Boolean)
          : [])
        .filter((option, index, list) => list.findIndex((item) => item.value === option.value) === index);
    }

    function toolChoiceOptionsFromFeat(feat) {
      return (Array.isArray(feat?.toolProficiencies) ? feat.toolProficiencies : [])
        .flatMap((group) => group?.choose?.from || [])
        .map((tool) => titleCaseWords([String(tool).split("|")[0]])[0])
        .filter(Boolean)
        .map((tool) => ({ value: `tool:${tool}`, label: tool, type: "tool", description: `${feat.name}: tool proficiency.` }));
    }

    function collectStructuredChoiceSpecs(entries, specs = []) {
      if (!entries) return specs;
      const list = Array.isArray(entries) ? entries : [entries];
      list.forEach((entry) => {
        if (!entry || typeof entry !== "object") return;
        if (entry.type === "options" && Array.isArray(entry.entries)) {
          const options = entry.entries.map(featureChoiceOptionData).filter(Boolean);
          if (options.length) specs.push({ label: entry.name || "Elegir opcion", count: entry.count || 1, options });
        }
        collectStructuredChoiceSpecs(entry.entries, specs);
        collectStructuredChoiceSpecs(entry.items, specs);
      });
      return specs;
    }

    function collectNamedListChoiceOptions(entries) {
      const options = [];
      const list = Array.isArray(entries) ? entries : [entries];
      list.forEach((entry) => {
        if (!entry || typeof entry !== "object") return;
        if (entry.type === "list" && Array.isArray(entry.items)) {
          entry.items.forEach((item) => {
            if (!item?.name) return;
            const value = strip5eTags(item.name);
            options.push({
              value,
              label: value,
              type: "raceChoice",
              description: flattenEntryText(item.entries || item.entry || "")
            });
          });
        }
        collectNamedListChoiceOptions(entry.entries).forEach((option) => options.push(option));
        collectNamedListChoiceOptions(entry.items).forEach((option) => options.push(option));
      });
      return options;
    }

    function expertiseSkillCountForFeature(feature, text) {
      const level = Number(feature?.level) || 0;
      const normalizedText = String(text || "");
      const match = normalizedText.match(/\b(one|two|three|\d+)\s+(?:more\s+)?(?:of\s+your\s+)?skill proficiencies\b/i)
        || normalizedText.match(/\bchoose\s+(one|two|three|\d+)\s+(?:of\s+your\s+)?skill proficiencies\b/i)
        || normalizedText.match(/\bExpertise\b[^.]*\bin\s+(one|two|three|\d+)\b/i);
      const parsed = match ? countWordToNumber(match[1]) || Number.parseInt(match[1], 10) : null;
      if (Number.isFinite(parsed)) return parsed;
      if (/choose one of your skill proficiencies/i.test(normalizedText)) return 1;
      if (normalizeName(feature?.className || "") === "ranger" && level >= 9) return 2;
      return 2;
    }

    function expertiseSkillOptionsForFeature(text) {
      const source = String(text || "");
      const restrictedMatch = source.match(/following skills(?: of your choice)?:\s*([^.;]+)/i)
        || source.match(/following skills in which you have proficiency:\s*([^.;]+)/i);
      const mentioned = restrictedMatch
        ? SKILL_NAMES.filter((skill) => textIncludesPhrase(restrictedMatch[1], skill))
        : [];
      return expertiseSkillChoiceOptions(mentioned.length ? mentioned : SKILL_NAMES);
    }

    function isExpertiseSkillFeature(feature, text) {
      const name = normalizeName(feature?.name || "");
      if (name.includes("tool expertise") || name.includes("infiltration expertise")) return false;
      return /\bexpertise\b/i.test(`${feature?.name || ""} ${text || ""}`) && /\bskills?|skill proficiencies\b/i.test(text || "");
    }

    function featureChoiceSpecs(feature) {
      const specs = collectStructuredChoiceSpecs(feature?.entries || []);
      const text = flattenEntryText(feature?.entries || "").toLowerCase();
      const featureSearchText = `${normalizeName(feature?.name || "")} ${text}`;
      if (normalizeName(feature?.name || "") === "eldritch invocation options") return [];
      const cantripSpec = isMagicInitiateFeat(feature?.feat || feature)
        ? null
        : spellChoiceOptionsForFeatureText(flattenEntryText(feature?.entries || ""), feature?.className || getMainClassName());
      if (cantripSpec) specs.push(cantripSpec);
      const languageSpec = languageChoiceSpecForFeatureText(flattenEntryText(feature?.entries || ""));
      if (languageSpec) specs.push(languageSpec);
      const hasOptionalSpecByType = (featureType) => specs.some((spec) => (spec.options || []).some((option) => {
        const optional = option.type === "optionalfeature" ? optionalFeatureByName(option.value) : null;
        return (optional?.featureType || []).includes(featureType);
      }));
      specs.forEach((spec) => {
        const hasEldritchOptions = /eldritch invocation/.test(featureSearchText) && (spec.options || []).some((option) => {
          const optional = option.type === "optionalfeature" ? optionalFeatureByName(option.value) : null;
          return (optional?.featureType || []).includes("EI");
        });
        if (hasEldritchOptions) spec.count = eldritchInvocationCountForFeature(feature);
        const hasArtificerInfusionOptions = /(?:infusions known|artificer infusions|infuse item)/.test(featureSearchText) && (spec.options || []).some((option) => {
          const optional = option.type === "optionalfeature" ? optionalFeatureByName(option.value) : null;
          return (optional?.featureType || []).includes("AI");
        });
        if (hasArtificerInfusionOptions) spec.count = artificerInfusionKnownCountForFeature(feature);
      });
      if (isAbilityScoreImprovementFeature(feature)) {
        specs.push({ label: "Feat or Ability Score Improvement", count: 1, options: featChoiceOptionsForAbilityScoreImprovement() });
        if (selectedFeatureChoices(featureChoiceKey(feature)).includes(ASI_CHOICE_VALUE)) {
          specs.push({ label: "Ability Score Increase", count: 1, options: abilityScoreIncreaseOptions() });
        }
      }
      if (feature?.isRaceFeature && /origin feat/.test(text)) {
        const options = feats
          .filter((feat) => feat.category === "O")
          .map((feat) => ({ value: feat.name, label: feat.name, type: "feat", description: flattenEntryText(feat.entries) }));
        if (options.length) specs.push({ label: "Origin Feat", count: 1, options });
      }
      if (feature?.isFeatFeature) {
        const feat = feature.feat || findFeatData(feature.name);
        const additionalSpellGroups = Array.isArray(feat?.additionalSpells) ? feat.additionalSpells : [];
        const fixedSpellVariant = normalizeName(feature.featVariant || featVariantFromName(feature.name || ""));
        if (isMagicInitiateFeat(feat)) {
          specs.push(...magicInitiateChoiceSpecs(feature, feat, additionalSpellGroups));
        } else if (additionalSpellGroups.length > 1 && !fixedSpellVariant) {
          specs.push({
            label: "Spell List",
            count: 1,
            options: additionalSpellGroups.map((group) => ({
              value: featSpellListChoiceValue(group),
              label: group.name || "Spell list",
              type: "spellList",
              description: `${feat?.name || feature.name}: use this spell list for granted spells.`
            }))
          });
        }
        const abilityOptions = featAbilityChoiceOptions(feat);
        if (abilityOptions.length) specs.push({ label: "Feat Ability", count: 1, options: abilityOptions });
        const skillAndToolMatch = /any combination of three .*skills?.*tools?/i.test(text);
        if (skillAndToolMatch) {
          const options = [
            ...SKILL_NAMES.map((skill) => ({ value: `skill:${skill}`, label: skill, type: "skill", description: `${feat?.name || feature.name}: skill proficiency.` })),
            ...toolChoiceOptionsFromFeat(feat)
          ];
          if (options.length) specs.push({ label: "Skill/Tool", count: 3, options });
        } else if (/proficiency in one skill of your choice|one skill of your choice/.test(text)) {
          const options = SKILL_NAMES.map((skill) => ({ value: `skill:${skill}`, label: skill, type: "skill", description: `${feat?.name || feature.name}: skill proficiency.` }));
          specs.push({ label: "Skill", count: 1, options });
        }
        const toolOptions = skillAndToolMatch ? [] : toolChoiceOptionsFromFeat(feat);
        if (toolOptions.length) {
          const count = Math.max(1, ...((Array.isArray(feat?.toolProficiencies) ? feat.toolProficiencies : []).map((group) => group?.choose?.count || 1)));
          specs.push({ label: "Tool", count, options: toolOptions });
        }
      }
      if (feature?.isBackgroundFeatChoice) {
        const options = (feature.featRefs || [])
          .map((ref) => {
            const feat = findFeatData(ref.name);
            const label = featDisplayName({ ...ref, name: feat?.name || ref.name });
            return {
              value: feat?.name || ref.name,
              label,
              type: "feat",
              description: flattenEntryText(feat?.entries || "")
            };
          })
          .filter((option) => option.value);
        if (options.length) specs.push({ label: "Background Feat", count: 1, options });
      }
      if (feature?.isClassStartingSkillChoice) {
        const options = skillChoiceOptions(feature.skillOptions || SKILL_NAMES);
        if (options.length) specs.push({ label: "Skill Proficiencies", count: feature.skillCount || 1, options });
      }
      if (feature?.isRaceFeature && /proficiency in one skill of your choice|one skill of your choice/.test(text)) {
        const options = SKILL_NAMES.map((skill) => ({ value: skill, label: skill, type: "skill", description: "" }));
        specs.push({ label: "Skill", count: 1, options });
      }
      if (feature?.isRaceFeature && /choose (?:a )?(?:lineage|legacy)/.test(text)) {
        const table = (feature.entries || []).find((entry) => entry?.type === "table" && Array.isArray(entry.rows));
        const tableOptions = (table?.rows || [])
          .map((row) => Array.isArray(row) ? row[0] : null)
          .filter(Boolean)
          .map((value) => ({ value: strip5eTags(value), label: strip5eTags(value), type: "raceChoice", description: "" }));
        const options = tableOptions.length ? tableOptions : collectNamedListChoiceOptions(feature.entries || []);
        if (options.length) specs.push({ label: table?.caption || "Race Choice", count: 1, options });
      }
      if (feature?.isSubclassChoice) {
        const options = subclassOptionsForFeature(feature);
        if (options.length) specs.push({ label: "Subclass", count: 1, options });
      }
      if (/weapon mastery/.test(feature?.name || "") || /weapon mastery properties/.test(text)) {
        const options = weaponMasteryOptionsForFeature(feature);
        if (options.length) specs.push({ label: "Weapon Mastery", count: weaponMasteryCountForFeature(feature), options });
      }
      if (/fighting style feat/.test(text)) {
        const options = feats
          .filter((feat) => String(feat.category || "").startsWith("FS"))
          .filter((feat, index, list) => list.findIndex((item) => normalizeName(item.name) === normalizeName(feat.name)) === index)
          .map((feat) => ({ value: feat.name, label: feat.name, type: "feat", description: flattenEntryText(feat.entries) }));
        if (options.length) specs.push({ label: "Fighting Style", count: 1, options });
      }
      if (/epic boon feat/.test(text)) {
        const options = feats
          .filter((feat) => feat.category === "EB")
          .map((feat) => ({ value: feat.name, label: feat.name, type: "feat", description: flattenEntryText(feat.entries) }));
        if (options.length) specs.push({ label: "Epic Boon", count: 1, options });
      }
      if (!hasOptionalSpecByType("AI") && /(?:infusions known|artificer infusions)/.test(featureSearchText)) {
        const options = optionalFeatureOptionsByType("AI");
        if (options.length) specs.push({ label: "Artificer Infusion Known", count: artificerInfusionKnownCountForFeature(feature), options });
      }
      if (!hasOptionalSpecByType("AI") && /(?:infuse item|infused items)/.test(featureSearchText)) {
        const options = optionalFeatureOptionsByType("AI");
        if (options.length) specs.push({ label: "Infused Item Active", count: artificerInfusedItemCountForFeature(feature), options });
      }
      if (!hasOptionalSpecByType("EI") && /eldritch invocation/.test(text) && /choice|choose|invocation of your choice/.test(text)) {
        const options = optionalFeatureOptionsByType("EI");
        if (options.length) specs.push({ label: "Eldritch Invocation", count: eldritchInvocationCountForFeature(feature), options });
      }
      if (isExpertiseSkillFeature(feature, text)) {
        const options = expertiseSkillOptionsForFeature(flattenEntryText(feature?.entries || ""));
        if (options.length) specs.push({ label: "Expertise", count: expertiseSkillCountForFeature(feature, text), options });
      }
      return specs;
    }

    function selectedFeatureChoiceCountForSpec(selected, spec) {
      const options = Array.isArray(spec?.options) ? spec.options : [];
      return selected.filter((value) => options.some((option) => option.value === value)).length;
    }

    function shouldSkipFeatureChoiceSpec(feature, spec) {
      if (feature?.isRaceFeature && normalizeName(spec.label) === "skill" && findSelectedRaceChoices().some((choice) => normalizeName(choice.sectionLabel) === "skill proficiencies")) return true;
      if (feature?.isRaceFeature && findSelectedRaceChoices().some((choice) => normalizeName(choice.sectionLabel) === normalizeName(feature.name || ""))) return true;
      return false;
    }

    function missingFeatureChoiceSpecs(feature) {
      if (!feature) return [];
      const selected = selectedFeatureChoices(featureChoiceKey(feature));
      return featureChoiceSpecs(feature)
        .filter((spec) => !shouldSkipFeatureChoiceSpec(feature, spec))
        .map((spec) => {
          const required = Math.max(1, Number.parseInt(spec.count || 1, 10) || 1);
          const selectedCount = selectedFeatureChoiceCountForSpec(selected, spec);
          return { spec, missing: Math.max(0, required - selectedCount) };
        })
        .filter((item) => item.missing > 0);
    }

    function featureChoiceStateForEntry(entry) {
      if (entry?.type === "raceChoiceControl" && entry.choice) {
        const required = Math.max(1, Number.parseInt(entry.choice.count || 1, 10) || 1);
        const selectedCount = backgroundChoiceSelectionCount(entry.choice);
        const missing = Math.max(0, required - selectedCount);
        return {
          complete: missing === 0,
          label: missing === 0 ? "Completo" : `Pendiente: faltan ${missing} opcion(es)`
        };
      }
      const feature = entry?.type === "feat"
        ? featFeatureFromEntry(entry)
        : entry?.feature || entry?.parentFeature || null;
      const missingSpecs = missingFeatureChoiceSpecs(feature);
      if (!missingSpecs.length) return { complete: true, label: "Completo" };
      const detail = missingSpecs
        .slice(0, 2)
        .map(({ spec, missing }) => `${spec.label}: faltan ${missing}`)
        .join("; ");
      return { complete: false, label: detail ? `Pendiente: ${detail}` : "Pendiente" };
    }

    function applyFeatureListButtonState(button, entry) {
      const state = featureChoiceStateForEntry(entry);
      button.classList.toggle("choice-complete", state.complete);
      button.classList.toggle("choice-pending", !state.complete);
      button.title = state.label;
      button.setAttribute("aria-label", `${button.textContent}. ${state.label}`);
    }

    function rerenderFeatureChoiceDrawer(feature) {
      const entries = generatedFeaturesAndTraitsEntries();
      if (feature?.isFeatFeature) {
        const feat = feature.feat || findFeatData(feature.name);
        const body = buildFeatDrawerContent(feat, feature.name || "Feat", "", feature);
        appendFeatureBackButton(body, entries);
        showDrawer(
          feat?.name || feature.name || "Feat",
          feat ? [FEAT_CATEGORY_LABELS[feat.category] || "Feat", sourceLabel(feat.source), feat.page ? `p${feat.page}` : ""].filter(Boolean).join(" - ") : "Feat",
          body,
          "feat-readable-drawer"
        );
        return;
      }
      const body = buildClassFeatureDrawerContent(feature);
      appendFeatureBackButton(body, entries);
      showDrawer(feature?.name || "Feature", "Feature choice", body);
    }

    function appendFeatureChoiceControls(root, feature) {
      const specs = featureChoiceSpecs(feature);
      if (!specs.length) return;
      const key = featureChoiceKey(feature);
      const selected = selectedFeatureChoices(key);
      specs.forEach((spec, specIndex) => {
        const section = document.createElement("div");
        section.className = "option-choice-group";
        appendText(section, "option-choice-title", `${spec.label}: elegir ${spec.count === 1 ? "una opcion" : `${spec.count} opciones`}`);
        spec.options.forEach((option) => {
          const disabled = Boolean(option.disabled) || isSkillOptionAlreadyProficient(option, selected);
          const label = document.createElement("label");
          label.className = "option-choice";
          label.classList.toggle("disabled", disabled);
          const input = document.createElement("input");
          input.type = spec.count > 1 ? "checkbox" : "radio";
          input.name = `${key}:${specIndex}`;
          input.value = option.value;
          input.checked = selected.includes(option.value);
          input.disabled = disabled;
          input.addEventListener("change", () => {
            let current = selectedFeatureChoices(key).filter((value) => !spec.options.some((item) => item.value === value));
            if (option.type === "spellList" && isMagicInitiateFeat(feature?.feat || feature)) {
              current = current.filter((value) => !String(value).startsWith("spell:"));
            }
            let picked = [...section.querySelectorAll("input:checked")].map((item) => item.value);
            if (picked.length > spec.count) {
              input.checked = false;
              picked = picked.filter((value) => value !== option.value);
              showStatus(`Maximo ${spec.count} opcion(es)`);
            }
            setSelectedFeatureChoices(key, [...current, ...picked]);
            if (isAbilityScoreImprovementFeature(feature)) {
              const body = buildClassFeatureDrawerContent(feature);
              appendFeatureBackButton(body, generatedFeaturesAndTraitsEntries());
              showDrawer(feature?.name || "Class Feature", "Feature choice", body);
            } else if (isMagicInitiateFeat(feature?.feat || feature)) {
              rerenderFeatureChoiceDrawer(feature);
            }
          });
          const text = document.createElement("span");
          text.className = "option-choice-text";
          const optionLabel = skillOptionLabel(option, disabled);
          text.textContent = option.description ? `${optionLabel}: ${option.description.split(/(?<=[.!?])\s+/)[0]}` : optionLabel;
          label.append(input, text);
          section.appendChild(label);
          if (option.type === "feat") {
            const inspect = document.createElement("button");
            inspect.type = "button";
            inspect.className = "spell-picker-button secondary";
            inspect.textContent = "Examinar feat";
            inspect.addEventListener("click", () => {
              const feat = findFeatData(option.value);
              const body = buildFeatDrawerContent(feat, option.label || option.value);
              appendFeatureBackButton(body, generatedFeaturesAndTraitsEntries());
              showDrawer(feat?.name || option.label || "Feat", "Feat", body, "feat-readable-drawer");
            });
            section.appendChild(inspect);
          }
          if (option.type === "optionalfeature") {
            const inspect = document.createElement("button");
            inspect.type = "button";
            inspect.className = "spell-picker-button secondary";
            inspect.textContent = "Examinar opcion";
            inspect.addEventListener("click", () => {
              const optional = optionalFeatureByName(option.value);
              const body = buildTextFeatureDrawerContent(optional?.name || option.label || option.value, flattenEntryText(optional?.entries || option.description || ""), "Feature option");
              appendFeatureBackButton(body, generatedFeaturesAndTraitsEntries());
              showDrawer(optional?.name || option.label || "Feature option", "Feature option", body);
            });
            section.appendChild(inspect);
          }
        });
        root.appendChild(section);
      });
    }

    function buildClassFeatureDrawerContent(feature) {
      const root = document.createElement("div");
      root.className = "item-sheet";
      appendText(root, "item-sheet-title", feature?.name || "Class Feature", "h2");
      appendText(root, "item-sheet-subtitle", [
        feature?.className ? `${feature.className} level ${feature.level}` : "",
        sourceLabel(feature?.source),
        feature?.page ? `p${feature.page}` : ""
      ].filter(Boolean).join(" - "));
      appendEntryBlocks(root, feature?.entries || feature?.entry || [], "Descripcion");
      appendFeatureChoiceControls(root, feature);
      appendText(root, "item-source", [
        feature?.source ? `Source: ${sourceLabel(feature.source)}${feature.page ? `, page ${feature.page}` : ""}.` : "",
        feature?.className ? `Class: ${feature.className}.` : ""
      ].filter(Boolean).join(" "));
      return root;
    }

    function appendFeatureBackButton(root, entries) {
      if (!entries?.length) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "feature-list-button";
      button.textContent = "Volver";
      button.addEventListener("click", () => {
        const refreshedEntries = generatedFeaturesAndTraitsEntries();
        showDrawer("Features & Traits", "Generated", buildFeaturesAndTraitsDrawerContent(refreshedEntries.length ? refreshedEntries : entries));
      });
      root.prepend(button);
    }

    function openFeatureEntry(entry, entries = []) {
      if (!entry) return;
      if (entry.type === "feat") {
        const feat = findFeatData(entry.featName || entry.title);
        const feature = featFeatureFromEntry({ ...entry, feat });
        const body = buildFeatDrawerContent(feat, entry.title, entry.backgroundFeature || "", feature);
        appendFeatureBackButton(body, entries);
        showDrawer(
          feat?.name || entry.title,
          feat ? [FEAT_CATEGORY_LABELS[feat.category] || "Feat", sourceLabel(feat.source), feat.page ? `p${feat.page}` : ""].filter(Boolean).join(" - ") : entry.meta,
          body,
          "feat-readable-drawer"
        );
        return;
      }
      if (entry.type === "classFeature" || entry.type === "classSkillChoice") {
        const body = buildClassFeatureDrawerContent(entry.feature);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.feature?.name || entry.title, entry.meta, body);
        return;
      }
      if (entry.type === "raceFeature") {
        const body = buildClassFeatureDrawerContent(entry.feature);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.feature?.name || entry.title, entry.meta, body);
        return;
      }
      if (entry.type === "backgroundFeatChoice") {
        const body = buildClassFeatureDrawerContent(entry.feature);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.feature?.name || entry.title, entry.meta, body);
        return;
      }
      if (entry.type === "optionalfeature") {
        const body = buildTextFeatureDrawerContent(entry.optionalFeature?.name || entry.title, flattenEntryText(entry.optionalFeature?.entries || entry.description || ""), entry.meta);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.optionalFeature?.name || entry.title, entry.meta, body);
        return;
      }
      if (entry.type === "weaponMastery") {
        const body = buildTextFeatureDrawerContent(`${entry.weaponName} (${entry.masteryName})`, entry.description, "Weapon Mastery");
        appendFeatureBackButton(body, entries);
        showDrawer(`${entry.weaponName} (${entry.masteryName})`, "Weapon Mastery", body);
        return;
      }
      if (entry.type === "subclass") {
        const body = buildTextFeatureDrawerContent(entry.subclass?.name || entry.title, entry.description || "Subclass seleccionada.", entry.meta);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.subclass?.name || entry.title, entry.meta, body);
        return;
      }
      if (entry.type === "raceChoiceControl") {
        const body = buildRaceChoiceDrawerContent(entry.choice);
        appendFeatureBackButton(body, entries);
        showDrawer(entry.title, entry.meta, body);
        return;
      }
      const body = buildTextFeatureDrawerContent(entry.title, entry.description, entry.meta);
      appendFeatureBackButton(body, entries);
      showDrawer(entry.title, entry.meta, body);
    }

    function buildFeaturesAndTraitsDrawerContent(entries) {
      const root = document.createElement("div");
      root.className = "item-sheet";
      appendText(root, "item-sheet-title", "Features & Traits", "h2");
      appendText(root, "item-sheet-subtitle", `${entries.length} entrada(s) generadas`);
      if (!entries.length) {
        appendItemSection(root, "Sin datos", "Elegí una clase/background y nivel para generar features.");
        return root;
      }
      const rows = entries.map((entry) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "feature-list-button";
        button.textContent = `${entry.title}${entry.meta ? ` - ${entry.meta}` : ""}`;
        applyFeatureListButtonState(button, entry);
        button.addEventListener("click", () => openFeatureEntry(entry, entries));
        return button;
      });
      appendSearchableList(root, rows, "Buscar feature...");
      return root;
    }

    function equippedItems() {
      if (!sheetMeta.equippedItems || typeof sheetMeta.equippedItems !== "object") sheetMeta.equippedItems = {};
      return sheetMeta.equippedItems;
    }

    function equipmentItemKey(entry) {
      return normalizeItemLookupName(entry.displayName);
    }

    function hasItemProperty(item, abbreviation) {
      return (item?.property || []).some((ref) => splitRef(ref).abbreviation === abbreviation);
    }

    function itemTypeAbbreviation(item) {
      return splitRef(item?.type).abbreviation;
    }

    function isArmorItem(item) {
      return Boolean(item?.armor || ["LA", "MA", "HA"].includes(itemTypeAbbreviation(item)));
    }

    function isShieldItem(item) {
      return itemTypeAbbreviation(item) === "S" || normalizeItemLookupName(item?.name || "") === "shield";
    }

    function isWeaponItem(item) {
      return Boolean(item?.weapon || item?.weaponCategory || ["M", "R"].includes(itemTypeAbbreviation(item)));
    }

    function isConsumableItem(item) {
      const typeName = itemTypeName(item?.type).toLowerCase();
      return /\b(potion|scroll|ammunition|food|drink)\b/.test(typeName) || ["P", "SC", "A", "FD"].includes(itemTypeAbbreviation(item));
    }

    function isAccessoryItem(item) {
      const typeName = itemTypeName(item?.type).toLowerCase();
      return (/\b(ring|wondrous|tattoo)\b/.test(typeName) || ["RG", "W"].includes(itemTypeAbbreviation(item)))
        && item?.rarity && item.rarity !== "none";
    }

    function itemFilterCategory(item) {
      if (isWeaponItem(item)) return "weapon";
      if (isArmorItem(item) || isShieldItem(item)) return "armor";
      if (isAccessoryItem(item)) return "accessory";
      if (isConsumableItem(item)) return "consumable";
      return "gear";
    }

    function itemEquipKind(item) {
      if (isWeaponItem(item)) return "weapon";
      if (isShieldItem(item)) return "shield";
      if (isArmorItem(item)) return "armor";
      if (isAccessoryItem(item)) return "accessory";
      return "";
    }

    function equippedRecord(key) {
      const value = equippedItems()[key];
      if (!value) return null;
      if (value === true) return { slot: "legacy" };
      return typeof value === "object" ? value : null;
    }

    function recordSlots(record) {
      if (!record) return [];
      if (Array.isArray(record.slots)) return record.slots.filter(Boolean);
      return record.slot ? [record.slot] : [];
    }

    function slotLabel(slot, proficient = true) {
      const labels = {
        mainHand: "Main",
        offHand: "Off",
        armor: "Armadura",
        accessory: "Acc."
      };
      return `${labels[slot] || "Equipado"}${proficient ? "" : " !"}`;
    }

    function recordLabel(record) {
      const slots = recordSlots(record);
      if (!slots.length) return "Equipado";
      return slots.map((slot) => {
        const label = slotLabel(slot, record.proficient !== false);
        return slot === "mainHand" && record.twoHanded ? `${label} 2M` : label;
      }).join("+");
    }

    function equippedEntries() {
      return equipmentEntries()
        .flatMap((entry) => {
          const key = equipmentItemKey(entry);
          const item = findItemData(entry.displayName);
          const record = equippedRecord(key);
          return recordSlots(record).map((slot) => ({ entry, key, item, record: { ...record, slot } }));
        })
        .filter(Boolean);
    }

    function equippedInSlot(slot) {
      return equippedEntries().find((item) => item.record.slot === slot) || null;
    }

    function mainHandUsesTwoHands() {
      const main = equippedInSlot("mainHand");
      return Boolean(main?.item && (hasItemProperty(main.item, "2H") || main.record.twoHanded));
    }

    function pruneEquippedItems() {
      const quantities = new Map(equipmentEntries().map((entry) => [equipmentItemKey(entry), entry.quantity]));
      Object.keys(equippedItems()).forEach((key) => {
        const quantity = quantities.get(key) || 0;
        const entry = equipmentEntries().find((item) => equipmentItemKey(item) === key);
        const item = entry ? findItemData(entry.displayName) : null;
        if (quantity <= 0) {
          delete equippedItems()[key];
          return;
        }
        if (!itemEquipKind(item)) {
          delete equippedItems()[key];
          return;
        }
        const record = equippedRecord(key);
        if (record?.slot === "legacy") return;
        const slots = recordSlots(record).slice(0, quantity);
        if (!slots.length) delete equippedItems()[key];
        else equippedItems()[key] = { ...record, slots, slot: undefined, twoHanded: record.twoHanded && slots.includes("mainHand") };
      });
    }

    function combinedProficiencyText() {
      return [
        selectedOptionDescription("class", getSelectedClassName()),
        selectedOptionDescription("race", getSelectedRaceName()),
        selectedOptionDescription("background", getFieldValueByNormalizedKey("background")),
        fieldValue("ProficienciesLang")
      ].join(" ").toLowerCase();
    }

    function hasEquipmentProficiency(item) {
      const text = combinedProficiencyText();
      if (!item) return false;
      if (isShieldItem(item)) return /\bshield(s)?\b/.test(text);
      if (isArmorItem(item)) {
        const type = itemTypeAbbreviation(item);
        if (type === "LA") return /\blight\b/.test(text);
        if (type === "MA") return /\bmedium\b/.test(text);
        if (type === "HA") return /\bheavy\b/.test(text);
        return true;
      }
      if (isWeaponItem(item)) {
        const category = normalizeName(item.weaponCategory || "");
        const name = normalizeItemLookupName(item.name || "");
        if (category && new RegExp(`\\b${category}\\b`).test(text)) return true;
        if (text.includes(name)) return true;
        return /\ball weapons\b|\bsimple, martial\b|\bmartial, simple\b/.test(text);
      }
      return true;
    }

    function itemArmorClassBonus(item) {
      const value = item?.bonusAc;
      if (typeof value === "number" && Number.isFinite(value)) return value;
      const match = String(value || "").match(/[+-]?\d+/);
      return match ? Number.parseInt(match[0], 10) || 0 : 0;
    }

    function armorRuleFromItem(item) {
      if (!item) return null;
      const namedRule = ARMOR_AC_RULES.find((rule) => normalizeItemLookupName(rule.name) === normalizeItemLookupName(item.name || ""));
      const bonus = itemArmorClassBonus(item);
      if (namedRule) return { ...namedRule, bonus };
      if (!Number.isFinite(item.ac)) return null;
      const type = itemTypeAbbreviation(item);
      const dexCap = type === "HA" ? 0 : type === "MA" ? 2 : null;
      return { name: item.name, base: item.ac, dexCap, bonus };
    }

    function canEquipToSlot(entry, item, slot) {
      const kind = itemEquipKind(item);
      const key = equipmentItemKey(entry);
      if (!kind) return { ok: false, reason: "Ese item no tiene slot equipable." };
      if (slot === "mainHand" && kind !== "weapon") return { ok: false, reason: "Solo armas pueden ir en main hand." };
      if (slot === "offHand" && !["weapon", "shield"].includes(kind)) return { ok: false, reason: "Solo arma ligera o shield pueden ir en off hand." };
      if (slot === "armor" && kind !== "armor") return { ok: false, reason: "Solo armaduras pueden ir en armadura." };
      if (slot === "accessory" && kind !== "accessory") return { ok: false, reason: "Solo accesorios pueden ir como accesorio." };
      if (slot === "offHand" && kind === "weapon" && !hasItemProperty(item, "L")) return { ok: false, reason: "El arma de off hand tiene que ser Light." };
      if (slot === "mainHand" && hasItemProperty(item, "2H") && equippedInSlot("offHand")) return { ok: false, reason: "Un arma two-handed necesita la off hand libre." };
      if (slot === "offHand" && mainHandUsesTwoHands()) return { ok: false, reason: "La main hand esta usando dos manos." };

      const occupied = equippedInSlot(slot);
      if (occupied && occupied.key !== key) return { ok: false, reason: `${slotLabel(slot)} ya esta ocupado.` };
      return { ok: true };
    }

    function preferredEquipSlot(entry, item) {
      const kind = itemEquipKind(item);
      const key = equipmentItemKey(entry);
      const current = equippedRecord(key);
      if (current?.slot && current.slot !== "legacy") return "";
      if (kind === "armor") return "armor";
      if (kind === "shield") return "offHand";
      if (kind === "accessory") return "accessory";
      if (kind === "weapon") {
        if (!equippedInSlot("mainHand")) return "mainHand";
        if (hasItemProperty(item, "L") && !equippedInSlot("offHand")) return "offHand";
        return "mainHand";
      }
      return "";
    }

    function setEquipped(entry, item, slot) {
      const key = equipmentItemKey(entry);
      if (!slot) {
        delete equippedItems()[key];
        return true;
      }
      const check = canEquipToSlot(entry, item, slot);
      if (!check.ok) {
        showStatus(check.reason);
        return false;
      }
      const current = equippedRecord(key);
      const slots = current && current.slot !== "legacy" ? recordSlots(current) : [];
      if (!slots.includes(slot)) slots.push(slot);
      equippedItems()[key] = { slots, proficient: hasEquipmentProficiency(item) };
      return true;
    }

    function setVersatileTwoHanded(entry, item) {
      const key = equipmentItemKey(entry);
      const current = equippedRecord(key);
      if (!hasItemProperty(item, "V") || !recordSlots(current).includes("mainHand")) return false;
      if (equippedInSlot("offHand")) {
        showStatus("Necesitas off hand libre para usarla en dos manos.");
        return false;
      }
      equippedItems()[key] = { ...current, slots: ["mainHand"], twoHanded: true, proficient: hasEquipmentProficiency(item) };
      return true;
    }

    function toggleEquipped(entry, item) {
      const key = equipmentItemKey(entry);
      const current = equippedRecord(key);
      let nextSlot = "";
      if (!current) {
        nextSlot = preferredEquipSlot(entry, item);
      } else if (isWeaponItem(item) && hasItemProperty(item, "V") && recordSlots(current).includes("mainHand") && !current.twoHanded) {
        const changed = setVersatileTwoHanded(entry, item);
        if (!changed) return;
        scheduleSave();
        updateEquipmentPanel();
        updateArmorClass();
        updatePreparedSpellsPanel();
        renderAlertsPanel();
        return;
      } else if (isWeaponItem(item) && hasItemProperty(item, "L") && entry.quantity > recordSlots(current).length) {
        const slots = recordSlots(current);
        if (!slots.includes("mainHand") && !equippedInSlot("mainHand")) nextSlot = "mainHand";
        else if (!slots.includes("offHand") && !equippedInSlot("offHand")) nextSlot = "offHand";
      }
      const changed = nextSlot ? setEquipped(entry, item, nextSlot) : setEquipped(entry, item, "");
      if (!changed) return;
      scheduleSave();
      updateEquipmentPanel();
      updateArmorClass();
      updatePreparedSpellsPanel();
      renderAlertsPanel();
    }

    function showDrawer(title, meta, body, drawerClass = "") {
      itemDrawer.classList.remove("spell-picker-drawer", "feat-readable-drawer");
      if (drawerClass) itemDrawer.classList.add(drawerClass);
      itemDrawerTitle.textContent = title || "Detalle";
      itemDrawerMeta.textContent = meta || "";
      itemDrawerBody.textContent = "";
      if (body instanceof Node) itemDrawerBody.appendChild(body);
      else itemDrawerBody.textContent = body || "Sin descripcion disponible.";
      itemDrawer.classList.add("visible");
      itemDrawer.setAttribute("aria-hidden", "false");
    }

    function showItemDrawer(entry, item) {
      showDrawer(
        item?.name || entry.displayName,
        `${entry.quantity}x - ${itemMetaText(item, entry.quantity)}`,
        buildItemDrawerContent(item)
      );
    }

    function closeItemDrawer() {
      itemDrawer.classList.remove("visible");
      itemDrawer.setAttribute("aria-hidden", "true");
    }

    function showFeatureDrawer(field) {
      if (field?.dataset.generatedFeaturesAndTraits === "true") {
        const entries = generatedFeaturesAndTraitsEntries();
        showDrawer("Features & Traits", "Generated", buildFeaturesAndTraitsDrawerContent(entries));
        return;
      }

      const featName = field.dataset.featureName || selectedBackgroundFeatName();
      const featureText = field.dataset.backgroundFeature || selectedBackgroundFeatureText();
      const feat = findFeatData(featName);
      if (feat) {
        showDrawer(feat.name, [FEAT_CATEGORY_LABELS[feat.category] || "Feat", sourceLabel(feat.source), feat.page ? `p${feat.page}` : ""].filter(Boolean).join(" - "), buildFeatDrawerContent(feat, featName, featureText), "feat-readable-drawer");
        return;
      }

      const body = field.dataset.featureDescription || featureText || field.title || "";
      if (!body) return;
      showDrawer(field.dataset.featureTitle || "Features & Traits", field.dataset.featureMeta || "Feature", buildTextFeatureDrawerContent(field.dataset.featureTitle || "Features & Traits", body, field.dataset.featureMeta || ""));
    }

    function itemPickerItems() {
      return dedupeModernByName(items, (item) => item?.name || "", (item) => item?.source || "")
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    function pickerQuantity() {
      const value = Number.parseInt(itemPickerQuantity?.value || "1", 10);
      return Number.isFinite(value) && value > 0 ? value : 1;
    }

    function renderItemPickerList() {
      if (!itemPickerList) return;
      const query = normalizeName(itemPickerSearch?.value || "");
      const selectedKey = normalizeName(selectedPickerItem?.name || "");
      itemPickerList.textContent = "";
      itemPickerFilters?.querySelectorAll(".item-picker-filter").forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === activeItemFilter);
      });
      itemPickerItems()
        .filter((item) => {
          const matchesFilter = activeItemFilter === "all" || itemFilterCategory(item) === activeItemFilter;
          if (!matchesFilter) return false;
          if (!query) return true;
          return normalizeName([
            item.name,
            itemTypeName(item.type),
            item.weaponCategory,
            itemFilterCategory(item),
            sourceLabel(item.source)
          ].filter(Boolean).join(" ")).includes(query);
        })
        .forEach((item) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = `item-picker-row ${normalizeName(item.name) === selectedKey ? "selected" : ""}`;

          const name = document.createElement("span");
          name.className = "item-picker-row-name";
          name.textContent = item.name;

          const meta = document.createElement("span");
          meta.className = "item-picker-row-meta";
          meta.textContent = [formatItemValue(item.value), sourceLabel(item.source)].filter(Boolean).join(" - ");

          row.append(name, meta);
          row.addEventListener("click", () => selectPickerItem(item));
          itemPickerList.appendChild(row);
        });
    }

    function selectPickerItem(item) {
      selectedPickerItem = item;
      if (itemPickerAdd) itemPickerAdd.disabled = !item;
      renderItemPickerList();
      if (item) showItemDrawer({ displayName: item.name, quantity: pickerQuantity() }, item);
    }

    function openItemPicker() {
      selectedPickerItem = null;
      if (itemPickerSearch) itemPickerSearch.value = "";
      if (itemPickerQuantity) itemPickerQuantity.value = "1";
      if (itemPickerAdd) itemPickerAdd.disabled = true;
      renderItemPickerList();
      itemPickerBackdrop?.classList.add("visible");
      itemPickerBackdrop?.setAttribute("aria-hidden", "false");
      itemPickerSearch?.focus();
    }

    function closeItemPicker() {
      itemPickerBackdrop?.classList.remove("visible");
      itemPickerBackdrop?.setAttribute("aria-hidden", "true");
    }

    function equipmentLines() {
      const text = fieldValue("Equipment");
      return (text.includes("\n") ? text.split(/\n+/) : splitEquipmentItems(text))
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function formatEquipmentEntryLine(quantity, name) {
      return `${quantity} ${name}`;
    }

    function addItemToEquipment(item, quantity) {
      const field = getFieldByKey("Equipment");
      if (!field || !item?.name) return;
      const lines = equipmentLines();
      const targetKey = normalizeItemLookupName(item.name);
      let added = false;
      const nextLines = lines.map((line) => {
        const entry = parseEquipmentLine(line);
        if (normalizeItemLookupName(entry.displayName) !== targetKey) return line;
        added = true;
        return formatEquipmentEntryLine(entry.quantity + quantity, entry.displayName);
      });
      if (!added) nextLines.push(formatEquipmentEntryLine(quantity, item.name));
      field.value = nextLines.join("\n");
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      updateEquipmentPanel();
      updateArmorClass();
      scheduleSave();
      showStatus("Item agregado");
    }

    function removeItemFromEquipment(entry, quantity = 1) {
      const field = getFieldByKey("Equipment");
      if (!field) return;
      const targetKey = equipmentItemKey(entry);
      const nextLines = [];
      equipmentLines().forEach((line) => {
        const current = parseEquipmentLine(line);
        if (equipmentItemKey(current) !== targetKey) {
          nextLines.push(line);
          return;
        }
        const nextQuantity = current.quantity - quantity;
        if (nextQuantity > 0) nextLines.push(formatEquipmentEntryLine(nextQuantity, current.displayName));
        else delete equippedItems()[targetKey];
      });

      field.value = nextLines.join("\n");
      field.dispatchEvent(new Event("input", { bubbles: true }));
      field.dispatchEvent(new Event("change", { bubbles: true }));
      scheduleSave();
      updateEquipmentPanel();
      updateArmorClass();
      updatePreparedSpellsPanel();
      renderAlertsPanel();
      showStatus("Item removido");
    }

    function addSelectedPickerItem() {
      if (!selectedPickerItem) return;
      addItemToEquipment(selectedPickerItem, pickerQuantity());
      closeItemPicker();
    }

    function equipmentEntries() {
      const text = fieldValue("Equipment");
      const lines = text.includes("\n") ? text.split(/\n+/) : splitEquipmentItems(text);
      return lines
        .map(parseEquipmentLine)
        .filter((entry) => entry.displayName);
    }

    function updateEquipmentPanel() {
      if (!equipmentPanel) return;
      pruneEquippedItems();
      const list = equipmentPanel.querySelector(".equipment-list");
      if (!list) return;
      list.textContent = "";
      const entries = equipmentEntries();
      if (!entries.length) {
        const empty = document.createElement("div");
        empty.className = "equipment-empty";
        empty.textContent = "Sin equipo.";
        list.appendChild(empty);
        return;
      }

      entries.forEach((entry) => {
        const item = findItemData(entry.displayName);
        const row = document.createElement("div");
        row.className = "equipment-row";

        const qty = document.createElement("div");
        qty.className = "equipment-qty";
        qty.textContent = `${entry.quantity}x`;

        const name = document.createElement("button");
        name.type = "button";
        name.className = "equipment-name";
        name.textContent = item?.name || entry.displayName;
        name.title = "Ver informacion del item";
        name.addEventListener("click", () => showItemDrawer(entry, item));

        const value = document.createElement("div");
        value.className = "equipment-value";
        value.textContent = formatItemValue(item?.value, entry.quantity);

        const equip = document.createElement("button");
        equip.type = "button";
        equip.className = "equipment-equip";
        const key = equipmentItemKey(entry);
        const equipKind = itemEquipKind(item);
        const record = equippedRecord(key);
        if (record?.slot === "legacy") setEquipped(entry, item, preferredEquipSlot(entry, item));
        const nextRecord = equippedRecord(key);
        const equipped = Boolean(nextRecord);
        equip.textContent = !equipKind ? "-" : equipped ? recordLabel(nextRecord) : "Equipar";
        equip.classList.toggle("equipped", equipped);
        equip.disabled = !equipKind;
        equip.title = !equipKind ? "Este item no se equipa" : equipped ? "Desequipar item" : "Equipar item";
        if (equipKind) equip.addEventListener("click", () => toggleEquipped(entry, item));

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "equipment-remove";
        remove.textContent = "X";
        remove.title = "Sacar 1 item";
        remove.setAttribute("aria-label", `Sacar ${entry.displayName}`);
        remove.addEventListener("click", () => removeItemFromEquipment(entry, 1));

        row.append(qty, name, value, equip, remove);
        list.appendChild(row);
      });
    }

    function applyCurrencySource(sourceKey, nextTotals) {
      if (!sheetMeta.currencySources || typeof sheetMeta.currencySources !== "object") sheetMeta.currencySources = {};
      ensureCurrencyDefaults();
      const previous = sheetMeta.currencySources[sourceKey] || {};
      CURRENCY_KEYS.forEach((key) => {
        const coin = key.toLowerCase();
        const delta = (nextTotals?.[coin] || 0) - (previous?.[coin] || 0);
        if (!delta) return;
        setFieldValue(key, String(numericFieldValue(key) + delta));
      });

      if (nextTotals && CURRENCY_KEYS.some((key) => nextTotals[key.toLowerCase()])) {
        sheetMeta.currencySources[sourceKey] = nextTotals;
      } else {
        delete sheetMeta.currencySources[sourceKey];
      }
    }

    function selectedChoice(key) {
      return sheetMeta.choices?.[key] || "";
    }

    function setSelectedChoice(key, value) {
      sheetMeta.choices[key] = value;
      updateDerivedStats();
      scheduleSave();
      renderAlertsPanel();
      showStatus("Eleccion guardada");
    }
